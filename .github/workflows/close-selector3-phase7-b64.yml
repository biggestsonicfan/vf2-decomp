name: Retry selector3 phase7
on:
  push:
    branches: [master]
    paths: [.github/workflows/close-selector3-phase7-b64.yml]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        run: |
          rm -f .github/workflows/close-selector3-phase7-b64.yml .github/workflows/close-selector3-phase7.yml .github/workflows/dump-selector3-profile-helper.yml .github/workflows/dump-selector3-phase7.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c .github/workflows
          git commit -m 'Close selector3 phase7 observed path'
          git push origin HEAD:master
