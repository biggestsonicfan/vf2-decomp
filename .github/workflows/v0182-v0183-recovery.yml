name: v0182-v0183 recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0182-v0183-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovery
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v0182-v0183.patch
          git apply /tmp/v0182-v0183.patch
          echo '' | base64 -d > decomp/i960/notes/game_info_1645c_state4_bit15_bit16_high_v0182.md
          echo '' | base64 -d > decomp/i960/notes/game_info_1645c_state4_bit6_high_v0183.md
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          git diff --check
      - name: Commit recovery
        shell: bash
        run: |
          git config user.name 'celsowm'
          git config user.email 'celsowm@gmail.com'
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_state4_bit15_bit16_high_v0182.md decomp/i960/notes/game_info_1645c_state4_bit6_high_v0183.md
          git commit -m 'Recover state-4 bit6 and bit15/16 high extensions'
          git rm .github/workflows/v0182-v0183-recovery.yml
          git commit -m 'Remove v0182-v0183 recovery workflow'
          git push origin HEAD:master
