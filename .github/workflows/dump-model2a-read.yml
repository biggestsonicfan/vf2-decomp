name: Dump model2a read
on:
  push:
    branches: [master]
    paths: [.github/workflows/dump-model2a-read.yml]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/hardware/model2a.c').read_text()
          a=s.index('vf2_status vf2_model2a_read(')
          b=s.index('vf2_status vf2_model2a_write(',a)
          print(s[a:b])
          PY
