name: Debug selector3 phase1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/debug-selector3-phase1.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/finish-selector3-phase1-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("          PY\n", start)
          script = wf[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, 'phase1_v2_patch.py', 'exec'))

          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()
          s=s.replace('#include "recovery_internal.h"\n', '#include "recovery_internal.h"\n#include <stdio.h>\n', 1)
          dispatch=s.index('vf2_status execute_frame_dispatch_tick(')
          body=s.index('{', dispatch)+1
          s=s[:body]+'''\n    fprintf(stderr, "DISPATCH ip=%08x depth=%u\\n", (unsigned)cpu->ip, (unsigned)cpu->local_frame_depth);'''+s[body:]
          needle='''    cpu->registers[3] = (uint32_t)selector;\n    selector_word = UINT32_C(1) << selector;\n'''
          assert needle in s
          s=s.replace(needle,'''    fprintf(stderr, "DISPATCH selector=%u\\n", (unsigned)selector);\n    cpu->registers[3] = (uint32_t)selector;\n    selector_word = UINT32_C(1) << selector;\n''',1)
          needle='''        if (status != VF2_OK ||\n            (phase == UINT8_C(0) &&\n'''
          assert needle in s
          s=s.replace(needle,'''        fprintf(stderr, "S3 phase=%u entry_phase=%u target=%08x status=%d\\n", (unsigned)phase, (unsigned)entry_phase, (unsigned)phase_target, (int)status);\n        if (status != VF2_OK ||\n            (phase == UINT8_C(0) &&\n''',1)
          phase1=s.index('static vf2_status execute_selector3_phase1(')
          phase3=s.index('static vf2_status execute_selector3_phase3(', phase1)
          seg=s[phase1:phase3]
          needle='''    if (status != VF2_OK) {\n        return status;\n    }\n    if (!countdown) {\n'''
          repl='''    if (status != VF2_OK) {\n        fprintf(stderr, "P1 status fail=%d mode=%u flags=%08x runtime=%08x input=%08x\\n", (int)status, (unsigned)mode, (unsigned)profile_flags, (unsigned)runtime_flags, (unsigned)input_flags);\n        return status;\n    }\n    fprintf(stderr, "P1 enter mode=%u flags=%08x runtime=%08x input=%08x countdown=%d\\n", (unsigned)mode, (unsigned)profile_flags, (unsigned)runtime_flags, (unsigned)input_flags, countdown);\n    if (!countdown) {\n'''
          assert needle in seg
          seg=seg.replace(needle,repl,1)
          needle2='''    status = vf2_model2a_read_u32(\n        machine, UINT32_C(0x00500024), &counter\n    );\n'''
          repl2='''    status = vf2_model2a_read_u32(\n        machine, UINT32_C(0x00500024), &counter\n    );\n    fprintf(stderr, "P1 counter read status=%d value=%u\\n", (int)status, (unsigned)counter);\n'''
          assert needle2 in seg
          seg=seg.replace(needle2,repl2,1)
          s=s[:phase1]+seg+s[phase3:]
          p.write_text(s)

          p=Path('tests/analysis/test_orchestrator_bridge.c')
          s=p.read_text()
          needle='''    CHECK(value == UINT32_C(1));\n\n    /* The alternate phase-one branch'''
          repl='''    fprintf(stderr, "P1 countdown post phase=%u counter=%u\\n", (unsigned)selector, (unsigned)value);\n    CHECK(value == UINT32_C(1));\n\n    /* The alternate phase-one branch'''
          assert needle in s
          s=s.replace(needle,repl,1)
          needle='''    CHECK(selector == UINT8_C(6));\n    CHECK(vf2_model2a_read_u32(&machine, UINT32_C(0x00500024), &value) == VF2_OK);'''
          repl='''    fprintf(stderr, "P1 measure post phase=%u\\n", (unsigned)selector);\n    CHECK(selector == UINT8_C(6));\n    CHECK(vf2_model2a_read_u32(&machine, UINT32_C(0x00500024), &value) == VF2_OK);'''
          assert needle in s
          p.write_text(s.replace(needle,repl,1))
          PY
      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON
      - name: Build target
        run: cmake --build build --target vf2_orchestrator_bridge_tests --parallel
      - name: Run bridge test
        run: ./build/vf2_orchestrator_bridge_tests
