name: v0145 type22 bit2 integration

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0145 recovery
        run: |
          git apply --index .github/v0145.patch
          git diff --cached --check
      - name: Configure
        run: cmake -S . -B build -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          rm -f .github/v0145.patch
          rm -f .github/workflows/v0145-integrate.yml
          rm -f .github/workflows/export-v0145-worktree.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Recover game-info type-22 bit-2 paths'
          git push origin HEAD:master
