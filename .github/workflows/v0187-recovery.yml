name: v0187 recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0187-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0187 recovery
        run: |
          echo '' | base64 -d > /tmp/v0187.patch
          git apply /tmp/v0187.patch
          echo '' | base64 -d > decomp/i960/notes/game_info_1645c_state4_bit14_pair_high_v0187.md
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          git diff --check
      - name: Commit recovery
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm -f .github/workflows/v0187-recovery.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_state4_bit14_pair_high_v0187.md
          git commit -m 'Recover state-4 bit14 pair-high continuation'
          git push origin HEAD:master
