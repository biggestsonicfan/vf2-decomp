name: Apply selector17 index5 main shell
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover main navigation, manual entry and exit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()

          s=s.replace('''    static const uint32_t cursor_addresses[5] = {
              UINT32_C(0x01001320), UINT32_C(0x010002a0),
              UINT32_C(0x01000320), UINT32_C(0x01000420),
              UINT32_C(0x010005a0)
          };''','''    static const uint32_t cursor_addresses[6] = {
              UINT32_C(0x01001320), UINT32_C(0x010002a0),
              UINT32_C(0x01000320), UINT32_C(0x01000420),
              UINT32_C(0x010005a0), UINT32_C(0x010011a0)
          };''',1)

          s=s.replace('''    int edit_delta = 0;
          int manual_navigation_delta = 0;''','''    int edit_delta = 0;
          int main_navigation_delta = 0;
          int manual_navigation_delta = 0;''',1)

          old='''        (coin_flags & ~UINT32_C(2)) != 0u ||
              (phase_a5 < UINT8_C(5) &&
               (phase_a7 != UINT8_C(0xff) || coin_flags != 0u)) ||
              (phase_a5 == UINT8_C(5) && phase_a7 > UINT8_C(4))) {'''
          new='''        (coin_flags & ~UINT32_C(2)) != 0u ||
              (phase_a5 < UINT8_C(5) &&
               (phase_a7 != UINT8_C(0xff) || coin_flags != 0u)) ||
              (phase_a5 == UINT8_C(5) &&
               ((phase_a7 == UINT8_C(0xff) && coin_flags != 0u) ||
                (phase_a7 != UINT8_C(0xff) && phase_a7 > UINT8_C(4))))) {'''
          if old not in s: raise SystemExit('validation block not found')
          s=s.replace(old,new,1)

          old='''    if (navigation_flags == UINT32_C(0x100)) edit_delta = 1;
              else if (navigation_flags == UINT32_C(0x200)) edit_delta = -1;
              else if (phase_a5 == UINT8_C(5) && navigation_flags == UINT32_C(0x1000))
                  manual_navigation_delta = 1;
              else if (phase_a5 == UINT8_C(5) && navigation_flags == UINT32_C(0x2000))
                  manual_navigation_delta = -1;
              else if (navigation_flags != 0u) return VF2_ERROR_UNSUPPORTED;'''
          new='''    if (navigation_flags == UINT32_C(0x100)) edit_delta = 1;
              else if (navigation_flags == UINT32_C(0x200)) edit_delta = -1;
              else if (phase_a5 == UINT8_C(5) && phase_a7 != UINT8_C(0xff) &&
                       navigation_flags == UINT32_C(0x1000))
                  manual_navigation_delta = 1;
              else if (phase_a5 == UINT8_C(5) && phase_a7 != UINT8_C(0xff) &&
                       navigation_flags == UINT32_C(0x2000))
                  manual_navigation_delta = -1;
              else if (phase_a7 == UINT8_C(0xff) && navigation_flags == UINT32_C(0x1000))
                  main_navigation_delta = 1;
              else if (phase_a7 == UINT8_C(0xff) && navigation_flags == UINT32_C(0x2000))
                  main_navigation_delta = -1;
              else if (navigation_flags != 0u) return VF2_ERROR_UNSUPPORTED;'''
          if old not in s: raise SystemExit('input block not found')
          s=s.replace(old,new,1)

          s=s.replace('''    if (phase_a5 == UINT8_C(5)) {''','''    if (phase_a5 == UINT8_C(5) && phase_a7 != UINT8_C(0xff)) {''',1)

          old='''    if (status == VF2_OK) {
              status = write_u16(machine, cursor_addresses[phase_a5], UINT16_C(0x801c));
          }

          if (status == VF2_OK && edit_delta != 0) {'''
          new='''    if (status == VF2_OK) {
              status = write_u16(
                  machine, cursor_addresses[phase_a5],
                  main_navigation_delta == 0 ? UINT16_C(0x801c) : UINT16_C(0x8020)
              );
          }

          if (status == VF2_OK && main_navigation_delta != 0) {
              int next = (int)phase_a5 + main_navigation_delta;
              uint8_t next_selection = 0u;
              if (next < 0) next = 5;
              else if (next > 5) next = 0;
              next_selection = (uint8_t)next;
              status = vf2_model2a_write(
                  machine, UINT32_C(0x005000a5),
                  &next_selection, sizeof(next_selection)
              );
              if (status == VF2_OK) {
                  status = vf2_model2a_write_u32(
                      machine, UINT32_C(0x005ff680),
                      main_navigation_delta < 0 ? UINT32_MAX : UINT32_C(1)
                  );
              }
              if (status == VF2_OK) {
                  status = vf2_model2a_write_u32(
                      machine, UINT32_C(0x005ff684), UINT32_C(0x0007ae10)
                  );
              }
              instructions = main_navigation_delta > 0
                  ? (phase_a5 == UINT8_C(5) ? UINT64_C(4195) : UINT64_C(4194))
                  : (phase_a5 == UINT8_C(0) ? UINT64_C(4192) : UINT64_C(4191));
              calls = UINT64_C(34);
          } else if (status == VF2_OK && phase_a5 == UINT8_C(5) &&
                     phase_a7 == UINT8_C(0xff) && edit_delta != 0) {
              const uint8_t manual_state = 0u;
              status = vf2_model2a_write(
                  machine, UINT32_C(0x005000a7), &manual_state, sizeof(manual_state)
              );
              instructions = edit_delta > 0 ? UINT64_C(14063) : UINT64_C(14060);
              calls = UINT64_C(36);
          } else if (status == VF2_OK && phase_a5 == 0u && edit_delta > 0) {
              static const uint32_t extra_text_records[3] = {
                  UINT32_C(0x0005ff08), UINT32_C(0x0005ff14), UINT32_C(0x0005ff18)
              };
              const uint8_t phase_index = UINT8_C(5);
              uint32_t record = 0u;
              uint32_t last_source = 0u;
              uint32_t last_destination = 0u;
              uint64_t restored_characters = 0u;
              size_t restore_index = 0u;
              status = clear_tile_plane_64x48(machine, UINT32_C(0x01000000));
              for (restore_index = 0u; status == VF2_OK && restore_index < 3u; ++restore_index) {
                  status = phase16_copy_text_record(
                      machine, extra_text_records[restore_index],
                      &last_source, &last_destination, &restored_characters
                  );
              }
              if (status == VF2_OK) {
                  status = vf2_model2a_write(
                      machine, UINT32_C(0x005000a4), &phase_index, sizeof(phase_index)
                  );
              }
              if (status == VF2_OK) {
                  status = vf2_model2a_write_u32(
                      machine, UINT32_C(0x005ff680), UINT32_C(0x00078cb0)
                  );
              }
              if (status == VF2_OK) {
                  status = vf2_model2a_write_u32(
                      machine, UINT32_C(0x005ff684), 0u
                  );
              }
              if (status != VF2_OK) return status;
              instructions = UINT64_C(19056);
              calls = UINT64_C(74);
              characters += restored_characters;
          } else if (status == VF2_OK && phase_a5 == 0u && edit_delta < 0) {
              instructions = UINT64_C(4185);
              calls = UINT64_C(35);
          } else if (status == VF2_OK && edit_delta != 0) {'''
          if old not in s: raise SystemExit('main action block not found')
          s=s.replace(old,new,1)

          old='''    cpu->registers[16] = edit_delta == 0 ? 0u : (uint32_t)checksum;
              cpu->registers[17] = edit_delta == 0 ? UINT32_C(0x3f4f5c29) : 0u;
              cpu->registers[18] = edit_delta == 0 ? UINT32_C(0xc0a0a3d7) : UINT32_C(15);'''
          new='''    if (main_navigation_delta != 0) {
              cpu->registers[16] = main_navigation_delta < 0 ? UINT32_MAX : UINT32_C(1);
              cpu->registers[17] = UINT32_C(0x3f4f5c29);
              cpu->registers[18] = UINT32_C(0xc0a0a3d7);
          } else if (phase_a5 == UINT8_C(5) && phase_a7 == UINT8_C(0xff) && edit_delta != 0) {
              cpu->registers[16] = UINT32_C(62);
              cpu->registers[17] = 0u;
              cpu->registers[18] = UINT32_C(0xc0a0a3d7);
          } else if (phase_a5 == 0u && edit_delta > 0) {
              cpu->registers[16] = UINT32_C(0x00078cb0);
              cpu->registers[17] = 0u;
              cpu->registers[18] = UINT32_C(15);
          } else if (phase_a5 == 0u && edit_delta < 0) {
              cpu->registers[16] = UINT32_MAX;
              cpu->registers[17] = UINT32_C(0x3f4f5c29);
              cpu->registers[18] = UINT32_C(0xc0a0a3d7);
          } else {
              cpu->registers[16] = edit_delta == 0 ? 0u : (uint32_t)checksum;
              cpu->registers[17] = edit_delta == 0 ? UINT32_C(0x3f4f5c29) : 0u;
              cpu->registers[18] = edit_delta == 0 ? UINT32_C(0xc0a0a3d7) : UINT32_C(15);
          }'''
          if old not in s: raise SystemExit('main register block not found')
          s=s.replace(old,new,1)

          old='''    cpu->registers[25] = UINT32_C(0x010005d4);'''
          new='''    if (main_navigation_delta != 0) {
              cpu->registers[25] = cursor_addresses[phase_a5];
          } else if (phase_a5 == UINT8_C(5) && phase_a7 == UINT8_C(0xff) && edit_delta != 0) {
              cpu->registers[25] = UINT32_C(0x01001580);
          } else if (phase_a5 == 0u && edit_delta > 0) {
              cpu->registers[25] = UINT32_C(0x010016ac);
          } else {
              cpu->registers[25] = UINT32_C(0x010005d4);
          }'''
          if old not in s: raise SystemExit('main r25 block not found')
          s=s.replace(old,new,1)

          old='''    if (phase_a5 == 0u && edit_delta == 0) {
              cpu->arithmetic_control = (cpu->arithmetic_control & ~UINT32_C(7)) | UINT32_C(1);
              cpu->compare_result = VF2_I960_COMPARE_GREATER;
          } else {
              cpu->arithmetic_control = (cpu->arithmetic_control & ~UINT32_C(7)) | UINT32_C(2);
              cpu->compare_result = VF2_I960_COMPARE_EQUAL;
          }'''
          new='''    if (main_navigation_delta != 0) {
              static const uint32_t nav_cc_forward[6] = {1u, 1u, 1u, 1u, 2u, 4u};
              static const uint32_t nav_cc_back[6] = {2u, 1u, 1u, 1u, 1u, 1u};
              const uint32_t cc = main_navigation_delta > 0
                  ? nav_cc_forward[phase_a5] : nav_cc_back[phase_a5];
              cpu->arithmetic_control = (cpu->arithmetic_control & ~UINT32_C(7)) | cc;
              cpu->compare_result = cc == UINT32_C(1)
                  ? VF2_I960_COMPARE_GREATER
                  : (cc == UINT32_C(2) ? VF2_I960_COMPARE_EQUAL : VF2_I960_COMPARE_LESS);
          } else if (phase_a5 == 0u && edit_delta <= 0) {
              cpu->arithmetic_control = (cpu->arithmetic_control & ~UINT32_C(7)) | UINT32_C(1);
              cpu->compare_result = VF2_I960_COMPARE_GREATER;
          } else {
              cpu->arithmetic_control = (cpu->arithmetic_control & ~UINT32_C(7)) | UINT32_C(2);
              cpu->compare_result = VF2_I960_COMPARE_EQUAL;
          }'''
          if old not in s: raise SystemExit('main cc block not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - run: rm .github/workflows/apply-phase17-index5-main-shell.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover selector17 index5 main shell"
          git push
