name: v0143 warm selector scheduler stack

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0143-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0143 patches
        run: |
          git apply .github/v0143-hybrid.patch
          git apply .github/v0143-runtime.patch
          git apply .github/v0143-test.patch
          git diff --check
      - name: Configure GCC
        run: cmake -S . -B build-gcc -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build GCC
        run: cmake --build build-gcc --parallel
      - name: Test GCC
        run: ctest --test-dir build-gcc --output-on-failure
      - name: Configure Clang
        env: { CC: clang }
        run: cmake -S . -B build-clang -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build Clang
        run: cmake --build build-clang --parallel
      - name: Test Clang
        run: ctest --test-dir build-clang --output-on-failure
      - name: Configure sanitizers
        env: { CC: clang }
        run: cmake -S . -B build-san -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-san --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-san --output-on-failure
      - name: Commit v0143
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > decomp/i960/notes/warm_selector_scheduler_v0143.md <<'EOF'
          # Warm selector scheduler stack recovery (v0143)

          After the ROM-backed TEST exit and warm initialization, the main loop reaches `0x0000a010` at local-frame depth 3 with selector 2 and runtime flags `0x00008800`. The scheduler semantics are the same cold path recovered previously, but nested under three persistent warm frames.

          The scheduler entry now admits exactly depth 0 or the ROM-observed warm depth 3. The first runnable task remains `fa_game_info` at index 13 and `0x0001645c`; the warm entry is ROM-validated at 1,467 instructions, 32 calls, and 30 returns with an exact snapshot match.

          Scheduler task transitions now admit the historical depth 1 or the warm depth 4. The `fa_game_info` to `fa_camera` transition is ROM-validated at 448 instructions, 9 calls, and 9 returns. The task-name formatter was corrected to write only the eight styled tile characters; the ROM does not overwrite the trailing word after the 16-byte formatted name. A regression test now preserves a sentinel in that trailing word.

          The scheduler finish uses frame slots relative to the live scheduler depth instead of absolute slots 1 and 2. This preserves the three outer warm frames while reproducing the scheduler/text stale frames at slots 4 and 5. The warm `fa_osage1` return to `0x0000a014` is ROM-validated at 281 instructions, 4 calls, and 5 returns with an exact snapshot match.

          The complete selector-2 frame from warm `0x0000a010` to the next `0x0000a010` executes 204 native blocks, 1,276,892 recovered instructions, 421 calls, and 421 returns. The resulting snapshot matches the ROM byte-for-byte and selector advances naturally from 2 to 3.

          No ROM bytes or snapshots are committed.
          EOF
          git rm .github/v0143-hybrid.patch .github/v0143-runtime.patch .github/v0143-test.patch .github/workflows/v0143-integrate.yml
          git add src/recovered/hybrid.c src/recovered/native_runtime.c tests/test_main.c decomp/i960/notes/warm_selector_scheduler_v0143.md
          git commit -m "Recover warm selector scheduler stack"
          git push origin HEAD:master
