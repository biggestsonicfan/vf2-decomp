name: v0143 warm selector semantic rebase

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0143-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply semantic rebase
        run: |
          git apply --index .github/v0143-part1.patch
          git apply --index .github/v0143-part2.patch
          git apply --index .github/v0143-part3.patch
          git apply --index .github/v0143-part4.patch
          git apply --index .github/v0143-part5.patch
          git diff --cached --check

      - name: Configure
        run: cmake -S . -B build -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/v0142.patch \
            .github/workflows/v0142-integrate.yml \
            .github/workflows/export-v0142-base.yml \
            .github/workflows/export-v0143-worktree.yml \
            .github/v0143.b64.00 \
            .github/v0143.b64.01 \
            .github/v0143.b64.02 \
            .github/v0143-part1.patch \
            .github/v0143-part2.patch \
            .github/v0143-part3.patch \
            .github/v0143-part4.patch \
            .github/v0143-part5.patch \
            .github/workflows/v0143-integrate.yml
          git commit -m "Recover warm selector and scheduler paths"
          git push origin HEAD:master
