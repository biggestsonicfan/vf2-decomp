name: v0127 tighten positive bit6 frontier

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0127-tighten-positive-bit6-frontier.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply evidence-backed positive bit6 gate
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
          NOTE_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('src/recovered/hybrid.c')
          text = path.read_text()
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          if text.count(old) != 1:
              raise SystemExit(f'hybrid.c positive bit6 anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          note = base64.b64decode(os.environ['NOTE_B64']).decode()
          Path('decomp/i960/notes/game_info_1645c_positive_bit6_fail_closed_v0127.md').write_text(note)
          PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit hardened frontier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0127-tighten-positive-bit6-frontier.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_positive_bit6_fail_closed_v0127.md
          git commit -m "Fail closed unmeasured positive state-8 bit-6 masks"
          git push origin HEAD:master
