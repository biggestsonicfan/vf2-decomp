name: v0127 tighten positive bit6 frontier

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0127-tighten-positive-bit6-frontier.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply evidence-backed positive bit6 gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/recovered/hybrid.c')
          text = path.read_text()
          old = '''    native_bit6_fighter_path =
        fighter0_state != 4u && fighter1_state != 4u &&
        ((fighter0_state_flags | fighter1_state_flags) &
         (UINT32_C(1) << 6u)) != 0u &&
        ((fighter0_state_flags | fighter1_state_flags) &
         ((UINT32_C(1) << 14u) | (UINT32_C(1) << 15u) |
          (UINT32_C(1) << 16u))) == 0u &&
        (int32_t)shared_fighter_threshold >= 0;
'''
          new = '''    {
        const uint32_t combined_state8_flags =
            fighter0_state_flags | fighter1_state_flags;
        const uint32_t bit6 = UINT32_C(1) << 6u;
        const uint32_t bit8 = UINT32_C(1) << 8u;
        const uint32_t low_bits =
            (UINT32_C(1) << 1u) | (UINT32_C(1) << 2u) |
            (UINT32_C(1) << 4u);
        const uint32_t high_bits =
            (UINT32_C(1) << 21u) | (UINT32_C(1) << 26u) |
            (UINT32_C(1) << 29u) | (UINT32_C(1) << 30u) |
            (UINT32_C(1) << 31u);
        const uint32_t measured_bits = bit6 | bit8 | low_bits | high_bits;
        const uint32_t selected_high_bits =
            combined_state8_flags & high_bits;
        const uint32_t high_without_first = selected_high_bits == 0u
            ? 0u
            : selected_high_bits & (selected_high_bits - UINT32_C(1));
        const bool one_high_bit =
            selected_high_bits != 0u && high_without_first == 0u;
        const bool two_high_bits =
            high_without_first != 0u &&
            (high_without_first & (high_without_first - UINT32_C(1))) == 0u;
        const bool measured_positive_state8_bit6_mask =
            (combined_state8_flags & bit6) != 0u &&
            (combined_state8_flags & ~measured_bits) == 0u &&
            (selected_high_bits == 0u ||
             (((one_high_bit || two_high_bits) &&
               (combined_state8_flags & bit8) != 0u &&
               (combined_state8_flags & low_bits) == 0u)) ||
             (selected_high_bits == high_bits &&
              (combined_state8_flags & bit8) != 0u));

        /* Positive state-8/bit-6 evidence is deliberately narrower than the
         * old generic bit-6 predicate.  The committed v0090/v0091 matrices
         * prove: no-high masks over low bits 1/2/4 with optional bit 8;
         * isolated/pairwise high-bit masks only with bit 8 and no low bits;
         * and the all-five-high mask with bit 8 and every low-bit subset.
         * High triples/quads and mixed single/pair-high + low-bit masks have
         * no committed oracle evidence and must fail closed. */
        native_bit6_fighter_path =
            fighter0_state == 8u && fighter1_state == 8u &&
            measured_positive_state8_bit6_mask &&
            (int32_t)shared_fighter_threshold >= 0;
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'hybrid.c positive bit6 anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          note = Path('decomp/i960/notes/game_info_1645c_positive_bit6_fail_closed_v0127.md')
          note.write_text('''# `fa_game_info` `0x1645c`: fail-closed positive state-8 bit-6 admission\n\n## Result\n\nThe generic positive `native_bit6_fighter_path` admission was broader than the\ncommitted differential evidence. It accepted any non-state-4 composition with\nbit 6 set and bits 14/15/16 clear, including high-bit triples/quads and mixed\nlow/high compositions that the recovery notes explicitly leave unproven.\n\nv0127 narrows that gate to the masks already measured by the committed child\nmatrices:\n\n- no high bits: bit 6 with any subset of low bits 1/2/4 and optional bit 8;\n- one or two of high bits 21/26/29/30/31: bit 8 is required and low bits\n  1/2/4 must be clear;\n- all five high bits: bit 8 is required and every subset of low bits 1/2/4\n  remains admitted.\n\nThe state byte must be 8 for both fighter records, the threshold must remain\nnonnegative, and any flag outside the measured bit set is rejected. High-bit\ntriples/quads, single/pair-high masks without bit 8, and single/pair-high masks\nmixed with low bits now fail closed rather than silently borrowing the generic\nbit-6 corridor.\n\nThis change does not claim new game behavior. It makes the implementation match\nthe existing evidence boundary recorded in\n`game_info_18644_positive_bit6_high_masks_v0090.md` and\n`game_info_18644_positive_bit6_high_pairs_v0091.md`.\n\n## Validation\n\nThe repository strict CMake build and CTest suite must pass before this change is\ncommitted. The existing ROM-backed matrix tools remain the oracle for widening\nthis gate in a later recovery.\n''')
          PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit hardened frontier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0127-tighten-positive-bit6-frontier.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_positive_bit6_fail_closed_v0127.md
          git commit -m "Fail closed unmeasured positive state-8 bit-6 masks"
          git push origin HEAD:master
