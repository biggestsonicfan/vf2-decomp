name: Recover game-info mode bit6
on:
  push:
    paths:
      - .github/workflows/recover-game-info-mode-bit6.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply measured mode-bit6 corridor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          s = s.replace(
              '    bool high_result = false;\n    bool countdown_path = false;\n',
              '    bool high_result = false;\n    bool countdown_path = false;\n    bool mode_bit6 = false;\n',
              1
          )
          old = '''    if (status == VF2_OK) {\n        status = hybrid_read_u8(\n            machine, r13 + UINT32_C(0x00003351), &byte_value\n        );\n    }\n    if (status == VF2_OK && byte_value != 0u) {\n        status = VF2_ERROR_UNSUPPORTED;\n    }\n'''
          new = '''    if (status == VF2_OK) {\n        status = hybrid_read_u8(\n            machine, r13 + UINT32_C(0x00003351), &byte_value\n        );\n    }\n    if (status == VF2_OK) {\n        /* 0x18898..0x188a8 tests bit 6, not byte != 0.  Values such as\n         * 0x01 therefore remain on the ordinary path.  With bit 6 set,\n         * the observed neutral corridor performs the extra fighter-flag\n         * load/BBS 29 pair and rejoins at 0x188ac. */\n        mode_bit6 = (byte_value & (UINT8_C(1) << 6u)) != 0u;\n        if (mode_bit6) {\n            status = vf2_model2a_read_u32(machine, fighter1, &r15);\n            if (status == VF2_OK &&\n                (r15 & (UINT32_C(1) << 29u)) != 0u) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n            if (status == VF2_OK &&\n                (countdown_path ||\n                 (r8 & ((UINT32_C(1) << 8u) |\n                        (UINT32_C(1) << 14u) |\n                        (UINT32_C(1) << 15u) |\n                        (UINT32_C(1) << 16u))) != 0u)) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n        }\n    }\n'''
          if old not in s:
              raise SystemExit('mode guard anchor missing')
          s = s.replace(old, new, 1)
          old2 = '''        if (countdown_path && (r8 & (UINT32_C(1) << 15u)) == 0u) {\n            /* Controlled ROM probes show the countdown corridor removes\n             * exactly 13 instructions from either observed baseline: the\n             * ordinary 101-instruction body becomes 88, while the prior\n             * +0x5b8 bit-1 corridor's 96-instruction body becomes 83. */\n            body_instructions =\n                (r3 & (UINT32_C(1) << 1u)) != 0u ? 83u : 88u;\n        }\n'''
          new2 = old2 + '''        if (mode_bit6) {\n            /* Raw ROM measurements at the 0x18644 entry/return boundaries\n             * give 102->105 instructions for the ordinary first invocation\n             * and 97->99 for the prior +0x5b8 bit-1 invocation. */\n            body_instructions +=\n                (r3 & (UINT32_C(1) << 1u)) != 0u ? 2u : 3u;\n        }\n'''
          if old2 not in s:
              raise SystemExit('body accounting anchor missing')
          p.write_text(s.replace(old2, new2, 1))
          PY
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: |
          exe=$(find build -type f -name vf2i960 | head -n1)
          test -n "$exe"
          cp "$exe" vf2i960
          chmod +x vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-mode-bit6
          path: vf2i960
          if-no-files-found: error
      - name: Document and commit
        run: |
          cat > decomp/i960/notes/game_info_18644_mode_bit6.md <<'EOF'
          # fa_game_info `0x18644` mode bit 6 (`base+0x3351`)

          The ROM tail at `0x18898..0x188ac` uses `bbc 6`, so nonzero values with bit 6 clear are not a separate branch. A controlled `base+0x3351 = 0x01` probe matches the zero baseline at 678 instructions for the full task.

          With `base+0x3351 = 0x40` and fighter bit 29 clear, the ROM executes the extra `ld (g8),r15` / `bbs 29,r15` pair and rejoins the normal tail. The full task measures 683 instructions. Isolated `0x18644` entry/return probes measure 102 -> 105 instructions for the first invocation and 97 -> 99 for the swapped second invocation, explaining the +5 total. This recovery covers that neutral bit-6-set corridor; bit29-set and combinations with the already-special state/countdown branches remain explicit unsupported boundaries.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_18644_mode_bit6.md
          git rm -f .github/workflows/recover-game-info-mode-bit6.yml
          git commit -m 'Recover fa_game_info mode bit6 corridor'
          git push
