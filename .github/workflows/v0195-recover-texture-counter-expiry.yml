name: v0195 recover texture counter expiry
'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0195-recover-texture-counter-expiry.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover counter expiry helper
        env:
          H: 
          C0: 
          C1: 
          T: 
        run: |
          python3 - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          def dec(k): return zlib.decompress(base64.b64decode(os.environ[k])).decode()

          p = Path('src/recovered/texture_bridge_texture.c')
          s = p.read_text()
          fn = s.index('vf2_status execute_texture_counter_update(')
          s = s[:fn] + dec('H') + s[fn:]
          fn = s.index('vf2_status execute_texture_counter_update(')
          a = s.index('    if (counter0 == UINT32_C(1)) {', fn)
          b = s.index('    if (counter0 > UINT32_C(1)) {', a)
          s = s[:a] + dec('C0') + s[b:]
          a = s.index('    if (counter1 == UINT32_C(1)) {', fn)
          b = s.index('    if (counter1 > UINT32_C(1)) {', a)
          s = s[:a] + dec('C1') + s[b:]
          decl = '    size_t bytes_written = 0u;\n    vf2_status status = VF2_OK;\n'
          if s.count(decl, fn) < 1: raise SystemExit('counter declarations missing')
          s = s[:fn] + s[fn:].replace(decl, '    size_t bytes_written = 0u;\n    uint64_t procedure_calls = 0u;\n    uint64_t procedure_returns = 0u;\n    vf2_status status = VF2_OK;\n', 1)
          # The decoded expiry blocks account four procedure calls/returns each.
          s = s.replace('        procedure_calls += UINT64_C(4);\n        procedure_returns += UINT64_C(4);\n', '        procedure_calls += UINT64_C(4);\n        procedure_returns += UINT64_C(4);\n', 2)
          zero = '        report->recovered_instruction_count = instructions;\n        report->cpu_poststate_applied = 1;\n'
          zpos = s.index(zero, fn)
          s = s[:zpos] + s[zpos:].replace(zero, '        report->recovered_instruction_count = instructions;\n        report->recovered_procedure_calls = procedure_calls;\n        report->recovered_procedure_returns = procedure_returns;\n        report->cpu_poststate_applied = 1;\n', 1)
          s = s[:fn] + s[fn:].replace('        report->recovered_procedure_calls = UINT64_C(3);\n        report->recovered_procedure_returns = UINT64_C(3);\n', '        report->recovered_procedure_calls = UINT64_C(3) + procedure_calls;\n        report->recovered_procedure_returns = UINT64_C(3) + procedure_returns;\n', 1)
          final = '    report->recovered_instruction_count = instructions;\n    report->cpu_poststate_applied = 1;\n    return VF2_OK;\n'
          fpos = s.index(final, fn)
          s = s[:fpos] + s[fpos:].replace(final, '    report->recovered_instruction_count = instructions;\n    report->recovered_procedure_calls = procedure_calls;\n    report->recovered_procedure_returns = procedure_returns;\n    report->cpu_poststate_applied = 1;\n    return VF2_OK;\n', 1)
          p.write_text(s)

          p = Path('src/recovered/native_runtime.c')
          s = p.read_text()
          a = s.index('static vf2_status\nexecute_texture_counter_interpreter(')
          b = s.index('\ntypedef struct vf2_native_wrapper_boundary_context', a)
          s = s[:a] + s[b+1:]
          a = s.index('    } else if (cpu->ip == VF2_TEXTURE_COUNTER_UPDATE_ENTRY) {')
          b = s.index('            vf2_hybrid_bridge_report bridge_report;', a)
          s = s[:a] + '    } else if (cpu->ip == VF2_TEXTURE_COUNTER_UPDATE_ENTRY) {\n        if (status == VF2_OK) {\n' + s[b:]
          p.write_text(s)

          p = Path('tests/analysis/test_orchestrator_bridge.c')
          s = p.read_text()
          a = 'static void test_counter_update_active_countdowns(void)\n'
          if s.count(a) != 1: raise SystemExit('test anchor missing')
          s = s.replace(a, dec('T') + a, 1)
          c = '    test_counter_update_active_countdowns();\n'
          if s.count(c) != 1: raise SystemExit('test call missing')
          p.write_text(s.replace(c, '    test_counter_update_first_expiry_recovered();\n' + c, 1))
          PY
          git diff --check
          ! grep -q 'execute_texture_counter_interpreter' src/recovered/native_runtime.c
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm .github/workflows/v0195-recover-texture-counter-expiry.yml
          git add src/recovered/texture_bridge_texture.c src/recovered/native_runtime.c tests/analysis/test_orchestrator_bridge.c
          git commit -m 'Recover texture counter expiry helper at 0x4b934'
          git push origin HEAD:master
