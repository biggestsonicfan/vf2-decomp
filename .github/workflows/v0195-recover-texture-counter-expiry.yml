name: v0195 recover texture counter expiry
'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0195-recover-texture-counter-expiry.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover counter expiry helper
        env:
          HELPER_B64: 
          C0_B64: 
          C1_B64: 
          TEST_B64: c3RhdGljIHZvaWQgdGVzdF9jb3VudGVyX3VwZGF0ZV9maXJzdF9leHBpcnlfcmVjb3ZlcmVkKHZvaWQpCnsKICAgIHZmMl9tb2RlbDJhIG1hY2hpbmU7CiAgICB2ZjJfaTk2MF9jcHUgY3B1OwogICAgdmYyX2h5YnJpZF9icmlkZ2VfcmVwb3J0IHJlcG9ydCA9IHsව
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          def dec(name):
              return base64.b64decode(os.environ[name]).decode()

          p = Path('src/recovered/texture_bridge_texture.c')
          s = p.read_text()
          anchor = 'vf2_status execute_texture_counter_update(\n'
          if s.count(anchor) != 1:
              raise SystemExit('counter update anchor missing')
          s = s.replace(anchor, dec('HELPER_B64') + anchor, 1)
          old = '''    if (counter0 == UINT32_C(1)) {
              return VF2_ERROR_UNSUPPORTED;
          }
          '''
          if s.count(old) != 1:
              raise SystemExit('counter0 expiry anchor missing')
          s = s.replace(old, dec('C0_B64'), 1)
          old = '''    if (counter1 == UINT32_C(1)) {
              return VF2_ERROR_UNSUPPORTED;
          }
          '''
          if s.count(old) != 1:
              raise SystemExit('counter1 expiry anchor missing')
          s = s.replace(old, dec('C1_B64'), 1)
          p.write_text(s)

          p = Path('src/recovered/native_runtime.c')
          s = p.read_text()
          start = s.index('static vf2_status\nexecute_texture_counter_interpreter(')
          end = s.index('\ntypedef struct vf2_native_wrapper_boundary_context', start)
          s = s[:start] + s[end+1:]
          old = '''    } else if (cpu->ip == VF2_TEXTURE_COUNTER_UPDATE_ENTRY) {
              uint32_t counter0 = 0u;
              uint32_t counter1 = 0u;
              status = vf2_model2a_read_u32(
                  machine, VF2_TEXTURE_COUNTER0, &counter0
              );
              if (status == VF2_OK) {
                  status = vf2_model2a_read_u32(
                      machine, VF2_TEXTURE_COUNTER1, &counter1
                  );
              }
              if (status == VF2_OK &&
                  (counter0 == UINT32_C(1) || counter1 == UINT32_C(1))) {
                  status = execute_texture_counter_interpreter(
                      machine, cpu, &local_report
                  );
              } else if (status == VF2_OK) {
                  vf2_hybrid_bridge_report bridge_report;
          '''
          new = '''    } else if (cpu->ip == VF2_TEXTURE_COUNTER_UPDATE_ENTRY) {
              if (status == VF2_OK) {
                  vf2_hybrid_bridge_report bridge_report;
          '''
          if s.count(old) != 1:
              raise SystemExit('native counter routing anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/analysis/test_orchestrator_bridge.c')
          s = p.read_text()
          anchor = 'static void test_counter_update_active_countdowns(void)\n'
          if s.count(anchor) != 1:
              raise SystemExit('counter test anchor missing')
          s = s.replace(anchor, dec('TEST_B64') + anchor, 1)
          call = '    test_counter_update_active_countdowns();\n'
          if s.count(call) != 1:
              raise SystemExit('counter test call anchor missing')
          s = s.replace(
              call,
              '    test_counter_update_first_expiry_recovered();\n' + call,
              1
          )
          p.write_text(s)
          PY
          git diff --check
          ! grep -q 'execute_texture_counter_interpreter' src/recovered/native_runtime.c
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm .github/workflows/v0195-recover-texture-counter-expiry.yml
          git add src/recovered/texture_bridge_texture.c src/recovered/native_runtime.c tests/analysis/test_orchestrator_bridge.c
          git commit -m 'Recover texture counter expiry helper at 0x4b934'
          git push origin HEAD:master
