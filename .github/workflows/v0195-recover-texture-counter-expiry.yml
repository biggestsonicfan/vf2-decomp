name: v0195 recover texture counter expiry
'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0195-recover-texture-counter-expiry.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover counter expiry helper
        run: |
          python3 .github/v0195_apply.py
          git diff --check
          ! grep -q 'execute_texture_counter_interpreter' src/recovered/native_runtime.c
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm .github/workflows/v0195-recover-texture-counter-expiry.yml .github/v0195_apply.py
          git add src/recovered/texture_bridge_texture.c src/recovered/native_runtime.c
          git commit -m 'Recover texture counter expiry helper at 0x4b934'
          git push origin HEAD:master
