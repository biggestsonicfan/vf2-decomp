name: Fix selector17 index6 page3 gcc
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_phase17_index6_page3_gcc.py
      - run: rm scripts/fix_phase17_index6_page3_gcc.py .github/workflows/fix-phase17-index6-page3-gcc.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix selector17 index6 page3 GCC warning"
          git push
