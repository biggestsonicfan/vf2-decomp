name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch-verification:
    name: patch verification branch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 21 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/verify-ca9c676'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-ca9c676
          fetch-depth: 0
      - name: Apply exact cleanup patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/analysis/test_orchestrator_bridge.c')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  """    CHECK(value == UINT32_C(639));

    vf2_model2a_shutdown(&machine);
}


static void test_frame_interrupt_support_batch(void)
""",
                  """    CHECK(value == UINT32_C(639));

    vf2_model2a_shutdown(&machine);
    free(rom);
}


static void test_frame_interrupt_support_batch(void)
""",
              ),
              (
                  """    CHECK(report.recovered_instruction_count == UINT64_C(4));

    vf2_model2a_shutdown(&machine);
}


static void test_frame_geometry_gate_busy_paths(void)
""",
                  """    CHECK(report.recovered_instruction_count == UINT64_C(4));

    vf2_model2a_shutdown(&machine);
    free(rom);
}


static void test_frame_geometry_gate_busy_paths(void)
""",
              ),
              (
                  """static void test_frame_geometry_gate_busy_paths(void)
{
    vf2_model2a machine;
    vf2_i960_cpu cpu;
    vf2_hybrid_bridge_report report = {0};
    uint8_t byte = 0u;
""",
                  """static void test_frame_geometry_gate_busy_paths(void)
{
    vf2_model2a machine;
    vf2_i960_cpu cpu;
    vf2_hybrid_bridge_report report = {0};
    uint8_t *rom = NULL;
    uint8_t byte = 0u;
""",
              ),
              (
                  """    {
        uint8_t *const rom = (uint8_t *)calloc(rom_size, 1u);
        CHECK(rom != NULL);
        if (rom == NULL) {
            vf2_model2a_shutdown(&machine);
            return;
        }
        CHECK(vf2_model2a_attach_main_rom(&machine, rom, rom_size) == VF2_OK);
    }
""",
                  """    rom = (uint8_t *)calloc(rom_size, 1u);
    CHECK(rom != NULL);
    if (rom == NULL) {
        vf2_model2a_shutdown(&machine);
        return;
    }
    CHECK(vf2_model2a_attach_main_rom(&machine, rom, rom_size) == VF2_OK);
""",
              ),
              (
                  """    CHECK(report.kind == VF2_HYBRID_BRIDGE_NONE);

    vf2_model2a_shutdown(&machine);
}


static void test_game_meter_update(void)
""",
                  """    CHECK(report.kind == VF2_HYBRID_BRIDGE_NONE);

    vf2_model2a_shutdown(&machine);
    free(rom);
}


static void test_game_meter_update(void)
""",
              ),
          ]

          for old, new in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new, 1)
              elif old_count == 0 and new_count == 1:
                  continue
              else:
                  raise SystemExit(
                      f'unexpected match counts old={old_count} new={new_count}: {old[:80]!r}'
                  )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/analysis/test_orchestrator_bridge.c
          git commit -m "tests: release synthetic ROM fixtures"
          git push origin HEAD:ci/verify-ca9c676

  build:
    name: ${{ matrix.compiler }} release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: clang ASan and UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON
          -DVF2_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
