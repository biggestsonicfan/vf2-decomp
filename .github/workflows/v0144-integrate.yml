name: v0144 seventh dispatch checkpoint

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0144-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0144 patch
        run: |
          git apply --index .github/v0144.patch
          git diff --cached --check
      - name: Configure
        run: cmake -S . -B build -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit v0144
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/v0144.patch
          git rm .github/workflows/v0144-integrate.yml
          git commit -m "Promote seventh-dispatch differential checkpoint"
          git push origin HEAD:master
