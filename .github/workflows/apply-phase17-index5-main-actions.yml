name: Apply selector17 index5 main actions
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_phase17_index5_main_actions.py
      - run: rm scripts/apply_phase17_index5_main_actions.py .github/workflows/apply-phase17-index5-main-actions.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover selector17 index5 main actions"
          git push
