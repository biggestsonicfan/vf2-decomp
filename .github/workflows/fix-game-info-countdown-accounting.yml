name: Fix game-info countdown accounting
on:
  push:
    paths:
      - .github/workflows/fix-game-info-countdown-accounting.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply measured countdown accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          old = '''        if (countdown_path && (r8 & (UINT32_C(1) << 15u)) == 0u) {\n            body_instructions = 85u;\n        }\n'''
          new = '''        if (countdown_path && (r8 & (UINT32_C(1) << 15u)) == 0u) {\n            /* Controlled ROM probes show the countdown corridor removes\n             * exactly 13 instructions from either observed baseline: the\n             * ordinary 101-instruction body becomes 88, while the prior\n             * +0x5b8 bit-1 corridor's 96-instruction body becomes 83. */\n            body_instructions =\n                (r3 & (UINT32_C(1) << 1u)) != 0u ? 83u : 88u;\n        }\n'''
          if old not in s:
              raise SystemExit('countdown accounting anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: |
          exe=$(find build -type f -name vf2i960 | head -n1)
          test -n "$exe"
          cp "$exe" vf2i960
          chmod +x vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-countdown-accounting
          path: vf2i960
          if-no-files-found: error
      - name: Commit fix and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c
          git rm -f .github/workflows/debug-game-info-accounting.yml .github/workflows/fix-game-info-countdown-accounting.yml
          git commit -m 'Fix fa_game_info countdown accounting'
          git push
