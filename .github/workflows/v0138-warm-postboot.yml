name: v0138 warm post-boot

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0138-warm-postboot.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover warm post-boot waits and geometry table
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/native_runtime.c')
          s = p.read_text()

          old = '''    candidate.executed_instructions =\n        start_instructions + (candidate.procedure_returns - start_returns);\n    *cpu = candidate;\n'''
          new = '''    candidate.executed_instructions =\n        start_instructions + (candidate.procedure_returns - start_returns);\n\n    if (cpu->local_frame_depth >= 4u) {\n        uint64_t warm_wait_instruction_correction = 0u;\n        uint32_t interrupt_stack = 0u;\n        uint32_t saved_ac_address = 0u;\n\n        if (candidate.ip == VF2_NATIVE_POST_BOOT_TEXTURE_WAIT_EXIT &&\n            cpu->local_frame_depth == 6u) {\n            warm_wait_instruction_correction = UINT64_C(4);\n        } else if ((candidate.ip == VF2_NATIVE_POST_BOOT_LUMA_WAIT_EXIT ||\n                    candidate.ip == VF2_NATIVE_POST_BOOT_PATTERN_WAIT_EXIT ||\n                    candidate.ip == VF2_NATIVE_POST_BOOT_FINAL_WAIT_EXIT ||\n                    candidate.ip == VF2_NATIVE_POST_BOOT_GEOMETRY_TABLE_WAIT_EXIT) &&\n                   (cpu->local_frame_depth == 4u || cpu->local_frame_depth == 5u)) {\n            warm_wait_instruction_correction = UINT64_C(7);\n        }\n\n        if (warm_wait_instruction_correction != 0u) {\n            status = vf2_model2a_read_u32(machine, cpu->prcb + UINT32_C(24),\n                                          &interrupt_stack);\n            if (status == VF2_OK) {\n                saved_ac_address =\n                    ((interrupt_stack + UINT32_C(63)) & ~UINT32_C(63)) +\n                    UINT32_C(52);\n                status = vf2_model2a_write_u32(\n                    machine, saved_ac_address,\n                    (cpu->arithmetic_control & ~UINT32_C(7)) | UINT32_C(1));\n            }\n            if (status != VF2_OK) {\n                return status;\n            }\n            candidate.executed_instructions += warm_wait_instruction_correction;\n            candidate.arithmetic_control &= ~UINT32_C(7);\n            candidate.compare_result = VF2_I960_COMPARE_NONE;\n        }\n    }\n    *cpu = candidate;\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '    if (cpu->local_frame_depth != 1u || cpu->registers[6] != UINT32_C(0x2000) ||\n'
          new = '    if ((cpu->local_frame_depth != 1u && cpu->local_frame_depth != 4u) ||\n        cpu->registers[6] != UINT32_C(0x2000) ||\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '        if (cpu->local_frame_depth != 1u || cpu->registers[8] != 0u) {\n'
          new = '        if ((cpu->local_frame_depth != 1u && cpu->local_frame_depth != 4u) ||\n            cpu->registers[8] != 0u) {\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''    if (cpu->local_frame_depth != 0u || geometry_base != VF2_GEOMETRY_BASE ||\n        geometry_port != VF2_GEOMETRY_BASE + UINT32_C(0x4000)) {\n'''
          new = '''    if ((cpu->local_frame_depth != 0u && cpu->local_frame_depth != 3u) ||\n        geometry_base != VF2_GEOMETRY_BASE ||\n        geometry_port != VF2_GEOMETRY_BASE + UINT32_C(0x4000)) {\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''    if (cpu->local_frame_depth != 1u || cpu->registers[4] != UINT32_C(0x00011970) ||\n        cpu->registers[5] != 0u || cpu->registers[6] != UINT32_C(0x000118e8)) {\n'''
          new = '''    if ((cpu->local_frame_depth != 1u && cpu->local_frame_depth != 4u) ||\n        cpu->registers[4] != UINT32_C(0x00011970) ||\n        cpu->registers[5] != 0u || cpu->registers[6] != UINT32_C(0x000118e8)) {\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''    if (cpu->local_frame_depth != 0u) {\n        return VF2_ERROR_UNSUPPORTED;\n    }\n\n    status = vf2_i960_cpu_enter_procedure(\n        cpu, VF2_NATIVE_POST_BOOT_GRAPHICS_STATE_RESET_BODY, UINT32_C(0x000098cc));\n'''
          new = '''    if (cpu->local_frame_depth != 0u && cpu->local_frame_depth != 3u) {\n        return VF2_ERROR_UNSUPPORTED;\n    }\n\n    status = vf2_i960_cpu_enter_procedure(\n        cpu, VF2_NATIVE_POST_BOOT_GRAPHICS_STATE_RESET_BODY, UINT32_C(0x000098cc));\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''        const uint32_t frame_wait_entry = cpu->ip;\n        vf2_hybrid_bridge_report bridge_report;\n        memset(&bridge_report, 0, sizeof(bridge_report));\n        status = vf2_hybrid_frame_wait_execute(machine, cpu, &state->frame_wait,\n                                               &bridge_report);\n'''
          new = '''        const uint32_t frame_wait_entry = cpu->ip;\n        vf2_hybrid_bridge_report bridge_report;\n        int injected_post_boot_pending_vblank = 0;\n        memset(&bridge_report, 0, sizeof(bridge_report));\n\n        if (frame_wait_entry == UINT32_C(0x00000f7c) &&\n            (cpu->local_frame_depth == 4u || cpu->local_frame_depth == 5u)) {\n            const uint32_t caller_return =\n                cpu->local_frames[cpu->local_frame_depth - 1u].registers[2];\n            uint8_t frame_byte = 0u;\n            const int post_boot_wait =\n                caller_return == VF2_NATIVE_POST_BOOT_LUMA_WAIT_EXIT ||\n                caller_return == VF2_NATIVE_POST_BOOT_PATTERN_WAIT_EXIT ||\n                caller_return == VF2_NATIVE_POST_BOOT_FINAL_WAIT_EXIT ||\n                caller_return == VF2_NATIVE_POST_BOOT_GEOMETRY_TABLE_WAIT_EXIT;\n\n            if (post_boot_wait) {\n                status = vf2_model2a_read(machine, UINT32_C(0x00500000),\n                                          &frame_byte, sizeof(frame_byte));\n                if (status == VF2_OK && frame_byte == 0u) {\n                    vf2_hybrid_frame_wait_report wait_report;\n                    memset(&wait_report, 0, sizeof(wait_report));\n                    state->frame_wait.visits =\n                        state->frame_wait.visits_before_interrupt - 1u;\n                    status = vf2_hybrid_frame_wait_observe(\n                        machine, cpu, &state->frame_wait, &wait_report);\n                    if (status == VF2_OK && !wait_report.interrupt_injected) {\n                        status = VF2_ERROR_UNSUPPORTED;\n                    }\n                    if (status == VF2_OK) {\n                        injected_post_boot_pending_vblank = 1;\n                        bridge_report.kind = VF2_HYBRID_BRIDGE_FRAME_WAIT_POLL;\n                        bridge_report.entry_address = frame_wait_entry;\n                        bridge_report.exit_address = cpu->ip;\n                        bridge_report.recovered_instruction_count = 0u;\n                        bridge_report.recovered_procedure_calls = 1u;\n                        bridge_report.recovered_procedure_returns = 0u;\n                        bridge_report.cpu_poststate_applied = 1;\n                    }\n                }\n            }\n        }\n        if (status == VF2_OK && !injected_post_boot_pending_vblank) {\n            status = vf2_hybrid_frame_wait_execute(machine, cpu, &state->frame_wait,\n                                                   &bridge_report);\n        }\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)

          note = Path('decomp/i960/notes/warm_post_boot_waits_geometry_v0138.md')
          note.write_text('''# Warm post-boot waits and geometry table (v0138)\n\nFresh ROM-backed validation now follows the natural TEST MODE exit into the warm boot rather than the historical selector-17 diagnostic fixture. The warm post-boot call chain carries additional local frames, so the already recovered geometry-pattern and geometry-table helpers are admitted only at the measured warm depths in addition to their existing cold/test depths.\n\nThe post-boot `0x00000f7c` waits also expose a timing detail hidden by the earlier compact runtime: when the luma, pattern, final and geometry-table waits reach the poll with frame byte zero, the reference receives a pending VBlank before evaluating the loop condition. The runtime now injects that pending VBlank only for the measured caller return addresses and only at warm depths 4 or 5. The existing recovered vector-12 handler then supplies the actual CPU, stack, RAM and interrupt side effects.\n\nThe reference interrupt frame preserves arithmetic-control condition `GREATER` in its saved AC slot. That slot is derived from the PRCB interrupt-stack pointer rather than hard-coded. After the measured warm wait returns, the live condition state is `NONE`. Measured instruction accounting is four additional instructions for the initial texture wait and seven for each subsequent warm post-boot wait.\n\nUsing the supplied supported ROM, the following boundaries match exactly, including CPU state, local frames, instruction/call/return/interrupt counters and mutable memory: `warm-b0 -> 0x000098c0`, `0x000098c0 -> 0x000098c4`, `0x000098c4 -> 0x00011864`, and `0x00011864 -> 0x000098cc`. The geometry-table body itself matches `0x000098c4 -> 0x00002edc` in 281 instructions, and the table plus frame-commit/wait path matches `0x000098c4 -> 0x00011864` in 385 instructions.\n\nNo ROM data or snapshots are committed.\n''')
          PY
      - name: Configure GCC
        run: cmake -S . -B build-gcc -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build GCC
        run: cmake --build build-gcc --parallel
      - name: Test GCC
        run: ctest --test-dir build-gcc --output-on-failure
      - name: Configure Clang
        env: { CC: clang }
        run: cmake -S . -B build-clang -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build Clang
        run: cmake --build build-clang --parallel
      - name: Test Clang
        run: ctest --test-dir build-clang --output-on-failure
      - name: Configure sanitizers
        env: { CC: clang }
        run: cmake -S . -B build-san -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-san --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-san --output-on-failure
      - name: Commit v0138
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0138-warm-postboot.yml
          git add src/recovered/native_runtime.c decomp/i960/notes/warm_post_boot_waits_geometry_v0138.md
          git commit -m "Recover warm post-boot waits and geometry table"
          git push origin HEAD:master
