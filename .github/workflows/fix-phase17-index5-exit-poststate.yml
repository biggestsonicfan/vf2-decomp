name: Fix selector17 index5 exit poststate
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_phase17_index5_exit_poststate.py
      - run: rm scripts/fix_phase17_index5_exit_poststate.py .github/workflows/fix-phase17-index5-exit-poststate.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match selector17 index5 exit poststate"
          git push
