name: Apply selector17 bit7 index0 recovery

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_phase17_bit7_index0.py
      - run: rm .github/workflows/apply-phase17-bit7-index0.yml scripts/apply_phase17_bit7_index0.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover selector17 bit7 index0 diagnostic path"
          git push
