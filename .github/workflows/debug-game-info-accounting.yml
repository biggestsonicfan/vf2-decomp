name: Debug game-info accounting
on:
  push:
    paths:
      - .github/workflows/debug-game-info-accounting.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instrument
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c'); s=p.read_text()
          s=s.replace('#include <math.h>\n','#include <math.h>\n#include <stdio.h>\n',1)
          old='''        cpu->executed_instructions += body_instructions + tail_instruction_delta;\n        status = vf2_i960_cpu_return_procedure(cpu, machine);\n'''
          new='''        fprintf(stderr, "GI18644 ret=%08x body=%u tail=%u count=%u r10=%08x\\n", (unsigned)return_address, (unsigned)body_instructions, (unsigned)tail_instruction_delta, (unsigned)countdown_path, (unsigned)r10);\n        cpu->executed_instructions += body_instructions + tail_instruction_delta;\n        status = vf2_i960_cpu_return_procedure(cpu, machine);\n'''
          if old not in s: raise SystemExit('anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=OFF -DVF2_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - run: |
          exe=$(find build -type f -name vf2i960 | head -n1)
          cp "$exe" vf2i960 && chmod +x vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-accounting-debug
          path: vf2i960
