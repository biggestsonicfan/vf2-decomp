name: v0188 recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0188-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0188 recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/recovered/hybrid.c')
          text = path.read_text()
          marker = '        const uint32_t bit6_bit14 = bit14 | (UINT32_C(1) << 6u);\n'
          if marker not in text:
              raise SystemExit('v0188 declaration marker not found')
          text = text.replace(marker,
              '        const uint32_t bit15 = UINT32_C(1) << 15u;\n' + marker, 1)
          marker2 = '''            cpu->ip = UINT32_C(0x00010dd0);
          }
          '''
          branch = '''            cpu->ip = UINT32_C(0x00010dd0);
          } else if (clean && high_count == 2u && low == bit15) {
              const bool bilateral =
                  fighter0_state_flags == combined_matrix_flags &&
                  fighter1_state_flags == combined_matrix_flags;
              cpu->executed_instructions += bilateral ? UINT64_C(2) : UINT64_C(1);
              hybrid_set_compare_result(cpu, VF2_I960_COMPARE_LESS);
              if (cpu->local_frame_depth + 2u < VF2_I960_MAX_LOCAL_FRAMES) {
                  vf2_i960_local_frame *stale =
                      &cpu->local_frames[cpu->local_frame_depth + 2u];
                  stale->registers[3] = UINT32_C(0x41000000);
                  stale->registers[4] = UINT32_C(0x07800f0f);
                  stale->registers[7] = UINT32_C(0x41000000);
                  if (fighter1_state_flags == combined_matrix_flags) {
                      stale->registers[15] = UINT32_C(0x80004400);
                  }
              }
          }
          '''
          pos = text.find(marker2, text.find('const uint32_t bit15'))
          if pos < 0:
              raise SystemExit('v0188 branch marker not found')
          text = text[:pos] + branch + text[pos + len(marker2):]
          path.write_text(text)
          PY
          echo '' | base64 -d > decomp/i960/notes/game_info_1645c_state4_bit15_pair_high_v0188.md
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          git diff --check
      - name: Commit recovery
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm -f .github/workflows/v0188-source-export.yml .github/workflows/v0188-recovery.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_state4_bit15_pair_high_v0188.md
          git commit -m 'Recover state-4 bit15 pair-high poststate'
          git push origin HEAD:master
