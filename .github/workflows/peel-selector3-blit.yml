name: Temporary selector3 blit peel

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/peel-selector3-blit.yml

permissions:
  contents: write

jobs:
  peel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply selector3 blit peel
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/peel.py
          python3 /tmp/peel.py
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit peel
        shell: bash
        run: |
          rm .github/workflows/peel-selector3-blit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recovered/texture_bridge_condition.c .github/workflows/peel-selector3-blit.yml
          git commit -m "Peel selector3 descriptor blit"
          git push origin HEAD:master
