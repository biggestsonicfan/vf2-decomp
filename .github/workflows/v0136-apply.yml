name: v0136 apply

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0136-apply.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clean v0136 patches
        run: |
          patch -p1 < .github/v0136-hybrid.patch
          patch -p1 < .github/v0136-runtime.patch
          patch -p1 < .github/v0136-small.patch
      - name: Configure GCC
        run: cmake -S . -B build-gcc -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build GCC
        run: cmake --build build-gcc --parallel
      - name: Test GCC
        run: ctest --test-dir build-gcc --output-on-failure
      - name: Configure Clang
        env:
          CC: clang
        run: cmake -S . -B build-clang -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build Clang
        run: cmake --build build-clang --parallel
      - name: Test Clang
        run: ctest --test-dir build-clang --output-on-failure
      - name: Configure sanitizers
        env:
          CC: clang
        run: cmake -S . -B build-san -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-san --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-san --output-on-failure
      - name: Commit v0136
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0136-apply.yml .github/v0136-hybrid.patch .github/v0136-runtime.patch .github/v0136-small.patch
          git add src/recovered/hybrid.c src/recovered/native_runtime.c src/recovered/native_runtime_condition_impl.c tests/recovered/test_native_runtime.c decomp/i960/notes/natural_cold_scheduler_frame_v0136.md
          git commit -m "Recover natural cold scheduler frame"
          git push origin HEAD:master
