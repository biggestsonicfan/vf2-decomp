name: Fix type22 compare preserve
on:
  push:
    paths:
      - tools/fix_type22_compare_preserve.py
      - .github/workflows/fix-type22-compare-preserve.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_type22_compare_preserve.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: |
          exe=$(find build -type f -name vf2i960 | head -n1)
          test -n "$exe"
          cp "$exe" vf2i960
          chmod +x vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-type22-compare-preserve
          path: vf2i960
          if-no-files-found: error
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c
          git rm -f tools/fix_type22_compare_preserve.py .github/workflows/fix-type22-compare-preserve.yml
          git commit -m 'Preserve type-22 helper condition state'
          git push
