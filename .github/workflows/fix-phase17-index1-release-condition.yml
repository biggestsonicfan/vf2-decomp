name: Fix selector17 index1 release condition

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/fix-phase17-index1-release-condition.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_phase17_index1_release_condition.py
      - run: rm .github/workflows/fix-phase17-index1-release-condition.yml scripts/fix_phase17_index1_release_condition.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match selector17 index1 release condition code"
          git push
