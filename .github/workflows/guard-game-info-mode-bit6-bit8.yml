name: Bound game-info mode bit6 bit8 frontier
on: [push]
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Guard only unrecovered mode-bit6 bit8 interaction
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/guard-game-info-mode-bit6-bit8.yml
          git add src/recovered/hybrid.c
          git commit -m 'Bound fa_game_info mode bit6 bit8 frontier'
          git push
