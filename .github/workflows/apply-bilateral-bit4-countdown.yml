name: Recover bilateral bit4 countdown
on:
  push:
    branches: [master]
    paths: [.github/workflows/apply-bilateral-bit4-countdown.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrow recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          old = '''        if ((!bilateral_bit1 && !bilateral_bit4) ||\n            (countdown_path && !bilateral_bit1)) {\n            /* Countdown composes only with the measured bilateral bit1\n             * pair. Bilateral bit4 countdown and other mixtures remain\n             * explicit ROM boundaries. */\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          new = '''        if (!bilateral_bit1 && !bilateral_bit4) {\n            /* Only the measured one-extra-bit bilateral compositions are\n             * admitted. With a nonzero countdown, bit 4 rejoins through\n             * the same earlier 0x18890 tail as pure bilateral state bit 8;\n             * both-fighter bit 4 and other mixtures remain fail-closed. */\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          if old not in s:
              raise SystemExit('bilateral bit4 countdown guard anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Commit recovered source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recovered/hybrid.c
          git commit -m "Recover fa_game_info bilateral state8 bit4 countdown corridor"
          git push
