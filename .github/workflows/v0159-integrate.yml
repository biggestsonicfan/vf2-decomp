name: v0159 integrate

on:
  push:
    branches: [master]
    paths:
      - '.github/v0159.patch'
      - '.github/workflows/v0159-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovery patch
        run: |
          git apply --recount --index .github/v0159.patch
          git diff --cached --check
      - name: Configure
        run: cmake -S . -B build -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/v0159.patch .github/workflows/v0159-integrate.yml
          git add include/vf2/native_runtime.h src/recovered/native_runtime.c decomp/i960/notes/scheduler_epilogue_boundaries_v0159.md
          git commit -m 'Recover scheduler epilogue boundaries'
          git push origin master
