name: Apply verified CI fixes

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'celsowm/vf2-decomp' &&
      github.event.issue.number == 21 &&
      github.event.comment.user.login == 'celsowm' &&
      github.event.comment.body == '/apply-ci-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply exact test cleanup fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/analysis/test_orchestrator_bridge.c')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """    CHECK(value == UINT32_C(639));

    vf2_model2a_shutdown(&machine);
}


static void test_frame_interrupt_support_batch(void)
""",
                  """    CHECK(value == UINT32_C(639));

    vf2_model2a_shutdown(&machine);
    free(rom);
}


static void test_frame_interrupt_support_batch(void)
""",
              ),
              (
                  """    CHECK(report.recovered_instruction_count == UINT64_C(4));

    vf2_model2a_shutdown(&machine);
}


static void test_frame_geometry_gate_busy_paths(void)
""",
                  """    CHECK(report.recovered_instruction_count == UINT64_C(4));

    vf2_model2a_shutdown(&machine);
    free(rom);
}


static void test_frame_geometry_gate_busy_paths(void)
""",
              ),
              (
                  """static void test_frame_geometry_gate_busy_paths(void)
{
    vf2_model2a machine;
    vf2_i960_cpu cpu;
    vf2_hybrid_bridge_report report = {0};
    uint8_t byte = 0u;
""",
                  """static void test_frame_geometry_gate_busy_paths(void)
{
    vf2_model2a machine;
    vf2_i960_cpu cpu;
    vf2_hybrid_bridge_report report = {0};
    uint8_t *rom = NULL;
    uint8_t byte = 0u;
""",
              ),
              (
                  """    {
        uint8_t *const rom = (uint8_t *)calloc(rom_size, 1u);
        CHECK(rom != NULL);
        if (rom == NULL) {
            vf2_model2a_shutdown(&machine);
            return;
        }
        CHECK(vf2_model2a_attach_main_rom(&machine, rom, rom_size) == VF2_OK);
    }
""",
                  """    rom = (uint8_t *)calloc(rom_size, 1u);
    CHECK(rom != NULL);
    if (rom == NULL) {
        vf2_model2a_shutdown(&machine);
        return;
    }
    CHECK(vf2_model2a_attach_main_rom(&machine, rom, rom_size) == VF2_OK);
""",
              ),
              (
                  """    CHECK(report.kind == VF2_HYBRID_BRIDGE_NONE);

    vf2_model2a_shutdown(&machine);
}


static void test_game_meter_update(void)
""",
                  """    CHECK(report.kind == VF2_HYBRID_BRIDGE_NONE);

    vf2_model2a_shutdown(&machine);
    free(rom);
}


static void test_game_meter_update(void)
""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit directly to master
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/analysis/test_orchestrator_bridge.c
          git commit -m "tests: release synthetic ROM fixtures"
          git push origin HEAD:master
