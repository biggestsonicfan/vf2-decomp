name: Integrate v0.0.24 remaining bridge batch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply verified bridge batch
        run: |
          base64 -d tools/remaining_bridge_batch_v0024.patch.gz.b64 | gzip -d > /tmp/remaining_bridge_batch.patch
          git apply --check /tmp/remaining_bridge_batch.patch
          git apply /tmp/remaining_bridge_batch.patch
          rm tools/remaining_bridge_batch_v0024.patch.gz.b64
          rm .github/workflows/integrate-remaining-bridge-batch.yml

      - name: Configure warning-as-error build
        run: >-
          cmake -S . -B build
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run ROM-independent tests
        run: >-
          ctest --test-dir build --output-on-failure
          -R '^(vf2_tests|vf2_orchestrator_.*)$'

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "decomp(i960): recover remaining bridge batch"
          git push origin master
