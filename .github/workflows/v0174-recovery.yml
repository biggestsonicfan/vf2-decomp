name: v0174 recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0174-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply measured dispatcher accounting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          marker = '''    }\n    if (mixed_negative_state4_zero_flags) {'''
          block = r'''    }
    /* ROM-backed v0174 state-8/positive-threshold compositions.  The
     * surrounding recovered/ROM child path already leaves architectural
     * state exact for these pair/triple/quad masks; only task instruction
     * accounting differs from the sequential i960 reference. */
    if (fighter0_state == 8u && fighter1_state == 8u &&
        measured_matrix_distribution &&
        (int32_t)shared_fighter_threshold >= 0) {
        const bool bilateral_positive_bit6 =
            fighter0_state_flags == combined_positive_bit6_flags &&
            fighter1_state_flags == combined_positive_bit6_flags;
        const bool positive_8140_composite =
            combined_positive_bit6_flags == UINT32_C(0x24008140) ||
            combined_positive_bit6_flags == UINT32_C(0x44008140) ||
            combined_positive_bit6_flags == UINT32_C(0x84008140) ||
            combined_positive_bit6_flags == UINT32_C(0x60008140) ||
            combined_positive_bit6_flags == UINT32_C(0xa0008140) ||
            combined_positive_bit6_flags == UINT32_C(0xc0008140) ||
            combined_positive_bit6_flags == UINT32_C(0x64008140) ||
            combined_positive_bit6_flags == UINT32_C(0xa4008140) ||
            combined_positive_bit6_flags == UINT32_C(0xc4008140) ||
            combined_positive_bit6_flags == UINT32_C(0xe0008140) ||
            combined_positive_bit6_flags == UINT32_C(0xe4008140);
        const bool positive_10140_plus3_composite =
            combined_positive_bit6_flags == UINT32_C(0x24010140) ||
            combined_positive_bit6_flags == UINT32_C(0x60010140) ||
            combined_positive_bit6_flags == UINT32_C(0x64010140);
        const bool positive_10140_plus4_composite =
            combined_positive_bit6_flags == UINT32_C(0x44010140) ||
            combined_positive_bit6_flags == UINT32_C(0x84010140);

        if (positive_8140_composite) {
            const uint64_t excess = bilateral_positive_bit6
                ? UINT64_C(5) : UINT64_C(3);
            if (native_instructions < excess) {
                return VF2_ERROR_UNSUPPORTED;
            }
            native_instructions -= excess;
        } else if (positive_10140_plus3_composite) {
            native_instructions += bilateral_positive_bit6
                ? UINT64_C(6) : UINT64_C(3);
        } else if (positive_10140_plus4_composite) {
            native_instructions += bilateral_positive_bit6
                ? UINT64_C(8) : UINT64_C(4);
        }
    }
    if (mixed_negative_state4_zero_flags) {'''
          if marker not in s:
              raise SystemExit('v0174 insertion marker not found')
          if 'positive_8140_composite' in s:
              raise SystemExit('v0174 block already present')
          p.write_text(s.replace(marker, block, 1))
          PY
          cat > decomp/i960/notes/game_info_1645c_positive_bit6_8140_10140_composites_v0174.md <<'EOF'
          # v0174: recover positive state-8 bit-6 8140/10140 composites

          Entry `0x0001645c`, both fighter state bytes 8, measured matrix
          distribution, nonnegative shared threshold.

          Fresh ROM-backed full-dispatch measurements covered all 22 remaining
          pair/triple/quad combinations of high bits 26/29/30/31 over the
          `0x8140` and `0x10140` low families (36 fixtures per mask).

          For every `0x8140` composite, architectural state already matched the
          sequential i960 reference and only instruction accounting was high by
          3 for unilateral distributions and 5 for bilateral.  v0174 subtracts
          exactly that measured excess for the eleven exact masks.

          Six `0x10140` composites were already 36/36 exact and remain untouched:
          `0xa00010140`, `0xc00010140`, `0xa40010140`, `0xc40010140`,
          `0xe00010140`, `0xe40010140`.

          The five remaining `0x10140` composites also had exact architectural
          state, calls, returns and interrupt counters.  Their instruction-only
          deficits were:

          - `0x24010140`, `0x60010140`, `0x64010140`: +3 unilateral / +6 bilateral
          - `0x44010140`, `0x84010140`: +4 unilateral / +8 bilateral

          The implementation adjusts only `native_instructions`; it deliberately
          does not rewrite memory, registers, condition codes or stale frames.
          All other masks remain outside this exact admission set.
          EOF
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit recovered corridor
        shell: bash
        run: |
          git config user.name 'celsowm'
          git config user.email 'celsowm@users.noreply.github.com'
          git rm .github/workflows/v0174-recovery.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_positive_bit6_8140_10140_composites_v0174.md
          git commit -m 'Recover positive state-8 bit-6 8140/10140 composites' -m 'Close all 22 remaining high-26/29/30/31 pair/triple/quad combinations across the 8140 and 10140 low families using fresh ROM-backed full-dispatch measurements. Architectural state already matched; apply only the exact measured instruction-accounting corrections while leaving six already-exact 10140 composites untouched.'
          git push origin HEAD:master
