name: v0174 recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0174-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply measured dispatcher accounting
        env:
          V0174_BLOCK: ''
          V0174_NOTE: ''
        run: |
          python3 -c "import base64,os,pathlib; p=pathlib.Path('src/recovered/hybrid.c'); s=p.read_text(); marker='    }\\n    if (mixed_negative_state4_zero_flags) {'; block=base64.b64decode(os.environ['V0174_BLOCK']).decode(); assert marker in s and 'positive_8140_composite' not in s; p.write_text(s.replace(marker,block,1))"
          printf '%s' "$V0174_NOTE" | base64 -d > decomp/i960/notes/game_info_1645c_positive_bit6_8140_10140_composites_v0174.md
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit recovered corridor
        run: |
          git config user.name 'celsowm'
          git config user.email 'celsowm@users.noreply.github.com'
          git rm .github/workflows/v0174-recovery.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_positive_bit6_8140_10140_composites_v0174.md
          git commit -m 'Recover positive state-8 bit-6 8140/10140 composites' -m 'Close all 22 remaining high-26/29/30/31 pair/triple/quad combinations across the 8140 and 10140 low families using fresh ROM-backed measurements. Architectural state already matched; apply only exact instruction-accounting corrections and leave six already-exact 10140 composites untouched.'
          git push origin HEAD:master
