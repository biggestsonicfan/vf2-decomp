name: Fix selector3 phase4 display
on:
  push:
    branches: [master]
    paths: [.github/workflows/fix-selector3-phase4-display.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch phase4 display destinations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c'); s=p.read_text(); a=s.index('static vf2_status execute_selector3_phase4('); b=s.index('static vf2_status execute_selector3_phase5(',a); x=s[a:b]
          old='''    if (status == VF2_OK && (profile_flags & UINT32_C(1)) == 0u) {\n        status = execute_selector3_display_text(\n            machine, UINT32_C(0x02a6d8aa)\n        );\n    }\n'''
          new='''    if (status == VF2_OK && (profile_flags & UINT32_C(1)) == 0u) {\n        status = execute_selector3_display_text_at(\n            machine, UINT32_C(0x02a6d8aa), UINT32_C(0x010016da)\n        );\n        if (status == VF2_OK) {\n            status = write_u16(machine, UINT32_C(0x01000ef4), UINT16_C(32));\n        }\n        if (status == VF2_OK) {\n            status = write_u16(machine, UINT32_C(0x01000ef6), UINT16_C(32));\n        }\n    }\n'''
          assert old in x; x=x.replace(old,new,1); p.write_text(s[:a]+x+s[b:])
          PY
      - name: Configure build test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        run: rm .github/workflows/fix-selector3-phase4-display.yml && git config user.name celsowm && git config user.email celsowm@gmail.com && git add src/recovered/texture_bridge_match.c .github/workflows && git commit -m 'Fix selector3 phase4 display targets' && git push origin HEAD:master
