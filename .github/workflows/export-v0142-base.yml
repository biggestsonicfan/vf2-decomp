name: Export v0142 base

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/export-v0142-base.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: vf2-v0142-base
          path: .
          include-hidden-files: true
