name: Fix selector17 index5 manual navigation scope
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix scoped condition blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/texture_bridge_match.c')
          s = p.read_text()
          wrong = '''        if (manual_navigation_delta == 0) {
                      cpu->arithmetic_control =
                          (cpu->arithmetic_control & ~UINT32_C(7)) | UINT32_C(2);
                      cpu->compare_result = VF2_I960_COMPARE_EQUAL;
                  } else {
                      static const uint32_t nav_cc_forward[5] = {1u, 1u, 1u, 2u, 4u};
                      static const uint32_t nav_cc_back[5] = {2u, 1u, 1u, 1u, 1u};
                      const uint32_t cc = manual_navigation_delta > 0
                          ? nav_cc_forward[phase_a7] : nav_cc_back[phase_a7];
                      cpu->arithmetic_control =
                          (cpu->arithmetic_control & ~UINT32_C(7)) | cc;
                      cpu->compare_result = cc == UINT32_C(1)
                          ? VF2_I960_COMPARE_GREATER
                          : (cc == UINT32_C(2)
                              ? VF2_I960_COMPARE_EQUAL : VF2_I960_COMPARE_LESS);
                  }'''
          simple = '''        cpu->arithmetic_control =
                      (cpu->arithmetic_control & ~UINT32_C(7)) | UINT32_C(2);
                  cpu->compare_result = VF2_I960_COMPARE_EQUAL;'''
          if s.count(wrong) != 1:
              raise SystemExit('unexpected accidental navigation block count')
          s = s.replace(wrong, simple, 1)
          marker = 'cpu->registers[25] = manual_navigation_delta == 0'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('manual marker not found')
          start = s.find(simple, pos)
          if start < 0 or start - pos > 1600:
              raise SystemExit('manual condition not found')
          manual = wrong
          s = s[:start] + manual + s[start + len(simple):]
          p.write_text(s)
          PY
      - run: rm .github/workflows/fix-phase17-index5-manual-navigation-scope.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix selector17 index5 manual navigation scope"
          git push
