name: Recover final texture record scan

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/recover-v0024-record-scan.yml
      - tools/apply_v0024_record_scan.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply recovery patch
        run: python3 tools/apply_v0024_record_scan.py

      - name: Build with warnings as errors
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2

      - name: Run ROM-independent tests
        run: ctest --test-dir build --output-on-failure

      - name: Commit recovered scan
        run: |
          git config user.name "vf2-decomp automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/recover-v0024-record-scan.yml
          git rm tools/apply_v0024_record_scan.py
          git add include/vf2/hybrid.h \
                  src/recovered/texture_bridge.c \
                  tools/vf2i960/main.c \
                  tests/analysis/test_orchestrator_limits.c \
                  decomp/i960/functions.csv \
                  decomp/i960/notes/texture_default_limits_v0024.md
          git commit -m "decomp(i960): recover final inactive texture-record scan"
          git push origin HEAD:master
