name: Export current source

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/export-current-source.yml

permissions:
  contents: write

actions:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack current source
        run: |
          tar --exclude=.git --exclude=.github/workflows/export-current-source.yml -czf /tmp/vf2-decomp-current.tar.gz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: vf2-decomp-current-source
          path: /tmp/vf2-decomp-current.tar.gz
          if-no-files-found: error
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/export-current-source.yml
          git commit -m "Remove temporary source export workflow"
          git push origin HEAD:master
