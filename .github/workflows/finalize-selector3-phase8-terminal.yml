name: Finalize selector3 phase8 terminal
on:
  push:
    branches: [master]
    paths: [.github/workflows/finalize-selector3-phase8-terminal.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix terminal handoff compare state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()
          i=s.index('cpu->ip = VF2_INLINE_TEXT_THUNK_ENTRY;')
          a=max(0,i-1000); b=min(len(s),i+1000)
          x=s[a:b]
          old='''    set_equal_condition(cpu);\n    cpu->executed_instructions += UINT64_C(26);'''
          new='''    set_signed_condition(cpu, INT32_C(0), INT32_C(-1));\n    cpu->executed_instructions += UINT64_C(26);'''
          assert old in x
          x=x.replace(old,new,1)
          p.write_text(s[:a]+x+s[b:])
          PY
      - name: Test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/finalize-selector3-phase8-terminal.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c .github/workflows
          git commit -m 'Match selector3 phase8 terminal poststate'
          git push origin HEAD:master
