name: Fix selector3 phase1 stack state

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-selector3-phase1-sp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix phase1 caller frame state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()
          old='''        cpu->registers[0] = x;\n        cpu->registers[1] = y;\n'''
          assert old in s
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/fix-selector3-phase1-sp.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c .github/workflows/fix-selector3-phase1-sp.yml
          git commit -m 'Preserve selector3 phase1 caller frame state'
          git push origin HEAD:master
