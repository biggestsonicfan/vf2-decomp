name: Fix game-info 18144 bit8 accounting
on: [push]
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix bit8 suffix accounting
        run: python -c "from pathlib import Path; import base64; p=Path('src/recovered/hybrid.c'); s=p.read_text(); old=base64.b64decode('ICAgIGlmIChzdGF0dXMgPT0gVkYyX09LKSB7CiAgICAgICAgc3RhdHVzID0gaHlicmlkX3JlYWRfdTgoCiAgICAgICAgICAgIG1hY2hpbmUsIGZpZ2h0ZXIgKyBVSU5UMzJfQygweDAwMDAwODIxKSwgJmJ5dGVfdmFsdWUKICAgICAgICApOwogICAgICAgIHI5ID0gYnl0ZV92YWx1ZTsKICAgIH0K').decode(); new=base64.b64decode('').decode(); assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: cp build/vf2i960 vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-18144-bit8
          path: vf2i960
      - name: Commit and cleanup
        run: |
          rm .github/workflows/fix-game-info-18144-bit8-accounting.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c .github/workflows/fix-game-info-18144-bit8-accounting.yml
          git commit -m 'Fix fa_game_info 18144 bit8 accounting'
          git push
