name: Build type22 validator
on:
  push:
    paths:
      - .github/workflows/build-type22-validator.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instrument CPU-state comparator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/i960/snapshot.c')
          s=p.read_text()
          needle='''        diff->equal = false;\n        (void)snprintf(diff->component, sizeof(diff->component), "cpu-state");\n        diff->expected_value = expected_cpu->ip;\n        diff->actual_value = actual_cpu->ip;\n        ++diff->differing_bytes;\n'''
          repl='''        fprintf(stderr, "CPUDBG sat=%08x/%08x prcb=%08x/%08x ip=%08x/%08x pc=%08x/%08x ac=%08x/%08x ic=%08x/%08x cmp=%u/%u reinit=%u/%u depth=%u/%u\\n",\n            (unsigned)expected_cpu->sat,(unsigned)actual_cpu->sat,\n            (unsigned)expected_cpu->prcb,(unsigned)actual_cpu->prcb,\n            (unsigned)expected_cpu->ip,(unsigned)actual_cpu->ip,\n            (unsigned)expected_cpu->process_control,(unsigned)actual_cpu->process_control,\n            (unsigned)expected_cpu->arithmetic_control,(unsigned)actual_cpu->arithmetic_control,\n            (unsigned)expected_cpu->interrupt_control,(unsigned)actual_cpu->interrupt_control,\n            (unsigned)expected_cpu->compare_result,(unsigned)actual_cpu->compare_result,\n            (unsigned)expected_cpu->reinitialized,(unsigned)actual_cpu->reinitialized,\n            (unsigned)expected_cpu->local_frame_depth,(unsigned)actual_cpu->local_frame_depth);\n        diff->equal = false;\n        (void)snprintf(diff->component, sizeof(diff->component), "cpu-state");\n        diff->expected_value = expected_cpu->ip;\n        diff->actual_value = actual_cpu->ip;\n        ++diff->differing_bytes;\n'''
          if needle not in s: raise SystemExit('cpu-state anchor missing')
          p.write_text(s.replace(needle,repl,1))
          PY
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - run: |
          exe=$(find build -type f -name vf2i960 | head -n1)
          test -n "$exe"
          cp "$exe" vf2i960
          chmod +x vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-type22-validator-debug
          path: vf2i960
          if-no-files-found: error
