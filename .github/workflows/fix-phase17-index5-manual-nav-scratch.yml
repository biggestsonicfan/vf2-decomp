name: Fix selector17 index5 manual nav scratch
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror manual navigation delta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()
          old='''            status = vf2_model2a_write(
                          machine, UINT32_C(0x005000a7),
                          &next_selection, sizeof(next_selection)
                      );
                      instructions = manual_navigation_delta > 0'''
          new='''            status = vf2_model2a_write(
                          machine, UINT32_C(0x005000a7),
                          &next_selection, sizeof(next_selection)
                      );
                      if (status == VF2_OK) {
                          status = vf2_model2a_write_u32(
                              machine, UINT32_C(0x005ff680),
                              manual_navigation_delta < 0
                                  ? UINT32_MAX : UINT32_C(1)
                          );
                      }
                      instructions = manual_navigation_delta > 0'''
          if old not in s:
              raise SystemExit('manual navigation write block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: rm .github/workflows/fix-phase17-index5-manual-nav-scratch.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match selector17 index5 manual navigation scratch"
          git push
