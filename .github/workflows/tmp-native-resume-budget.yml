name: native-resume budget diagnostic fix
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-native-resume-budget.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact telemetry fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/vf2i960/commands.c')
          s = p.read_text()
          old = '''    uint32_t start_address = 0u;
              int forced_one_block = 0;
              vf2_status status = VF2_OK;
          '''
          new = '''    uint32_t start_address = 0u;
              int forced_one_block = 0;
              int budget_exhausted = 0;
              vf2_status status = VF2_OK;
          '''
          if s.count(old) != 1:
              raise SystemExit('native-resume declaration anchor missing or ambiguous')
          s = s.replace(old, new, 1)
          old = '''    if (status == VF2_OK && !report.reached_stop) {
                  status = VF2_ERROR_UNSUPPORTED;
              }
              /* Preserve the post-failure state too: a rejected native bridge is often
          '''
          new = '''    if (status == VF2_OK && !report.reached_stop) {
                  status = VF2_ERROR_UNSUPPORTED;
              }
              if (status == VF2_ERROR_UNSUPPORTED && !report.reached_stop &&
                  report.blocks_executed == max_blocks) {
                  budget_exhausted = 1;
              }
              /* Preserve the post-failure state too: a rejected native bridge is often
          '''
          if s.count(old) != 1:
              raise SystemExit('native-resume budget anchor missing or ambiguous')
          s = s.replace(old, new, 1)
          old = '''    } else {
                  fprintf(
                      stderr,
                      "Native resume failed: %s at 0x%08x after %zu blocks "
                      "entry=0x%08x "
                      "step=%s bridge=%s task=%s\\n",
                      vf2_status_string(status),
                      (unsigned)report.final_address,
                      report.blocks_executed,
                      (unsigned)report.last_entry_address,
                      vf2_native_runtime_step_kind_name(report.last_step_kind),
                      vf2_hybrid_bridge_kind_name(report.last_bridge_kind),
                      vf2_hybrid_task_kind_name(report.last_task_kind)
                  );
              }
          '''
          new = '''    } else if (budget_exhausted) {
                  fprintf(
                      stderr,
                      "Native resume budget exhausted at 0x%08x after %zu blocks "
                      "entry=0x%08x "
                      "step=%s bridge=%s task=%s\\n",
                      (unsigned)report.final_address,
                      report.blocks_executed,
                      (unsigned)report.last_entry_address,
                      vf2_native_runtime_step_kind_name(report.last_step_kind),
                      vf2_hybrid_bridge_kind_name(report.last_bridge_kind),
                      vf2_hybrid_task_kind_name(report.last_task_kind)
                  );
              } else {
                  fprintf(
                      stderr,
                      "Native resume failed: %s at 0x%08x after %zu blocks "
                      "entry=0x%08x "
                      "step=%s bridge=%s task=%s\\n",
                      vf2_status_string(status),
                      (unsigned)report.final_address,
                      report.blocks_executed,
                      (unsigned)report.last_entry_address,
                      vf2_native_runtime_step_kind_name(report.last_step_kind),
                      vf2_hybrid_bridge_kind_name(report.last_bridge_kind),
                      vf2_hybrid_task_kind_name(report.last_task_kind)
                  );
              }
          '''
          if s.count(old) != 1:
              raise SystemExit('native-resume diagnostic anchor missing or ambiguous')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Build vf2i960
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2 --target vf2i960
      - name: Commit fix
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm .github/workflows/tmp-native-resume-budget.yml
          git add tools/vf2i960/commands.c
          git commit -m 'Distinguish native-resume budget exhaustion'
          git push origin HEAD:master
