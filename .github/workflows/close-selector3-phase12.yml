name: Close selector3 phase12
on:
  push:
    branches: [master]
    paths: [.github/workflows/close-selector3-phase12.yml]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive phase12 poststate from proven phase6 descriptor logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()
          a=s.index('if (status == VF2_OK && entry_phase == UINT8_C(6))')
          b=s.index('if (status == VF2_OK && entry_phase == UINT8_C(7))',a)
          block=s[a:b]
          block=block.replace('entry_phase == UINT8_C(6)','entry_phase == UINT8_C(12)',1)
          spill='''            if (status == VF2_OK) {\n                status = vf2_model2a_write_u32(\n                    machine, cpu->registers[1] + UINT32_C(0x000000c0),\n                    destination\n                );\n            }\n'''
          assert spill in block
          block=block.replace(spill,'',1)
          marker='''        if (status == VF2_OK && phase8_handoff) {\n'''
          assert marker in s
          s=s.replace(marker,'        '+block+marker,1)
          p.write_text(s)
          PY
      - name: Test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/close-selector3-phase12.yml .github/workflows/dump-phase6-poststate-block.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c .github/workflows
          git commit -m 'Close selector3 phase12 observed path'
          git push origin HEAD:master
