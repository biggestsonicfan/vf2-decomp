name: Recover game-info bit21 predicate
on:
  push:
    paths:
      - .github/workflows/recover-game-info-bit21.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply measured bit21 path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          old = '''        if ((r12 & (UINT32_C(1) << 21u)) != 0u) {\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          new = '''        if ((r12 & (UINT32_C(1) << 21u)) != 0u) {\n            /* 0x18a1c..0x18a20: BBC 21 falls through to SETBIT 4.\n             * Controlled forward/reverse fighter probes show exactly one\n             * extra instruction per affected 0x18644 invocation. */\n            r10 |= UINT32_C(1) << 4u;\n            ++body_instructions;\n        }\n'''
          if old not in s:
              raise SystemExit('bit21 guard anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: |
          exe=$(find build -type f -name vf2i960 | head -n1)
          test -n "$exe"
          cp "$exe" vf2i960
          chmod +x vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-bit21
          path: vf2i960
          if-no-files-found: error
      - name: Document and commit
        run: |
          cat > decomp/i960/notes/game_info_18644_bit21.md <<'EOF'
          # fa_game_info `0x18644` bit-21 predicate

          The shared tail at `0x18a04..0x18a24` computes `r12 = ((fighter0.flags ^ fighter1.flags) << 15) ^ fighter0.state_flags ^ fighter1.state_flags`. `bbc 21,r12,0x18a24` skips a single `setbit 4,r10,r10`; when bit 21 is set the resulting `r10` bit 4 is stored to `fighter0+0x5b8`.

          Controlled forward and reversed fighter probes both execute the path in each of the two swapped `0x18644` calls. Relative to the predicate-clear probe, the full task grows by exactly two instructions, one per helper invocation. The observed post-state changes from `+0x5b8 = 0x2/0x6` to `0x1a/0x16` (forward) and `0x12/0x1e` (reversed), consistent with setting bit 4 while preserving the other accumulated bits.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_18644_bit21.md
          git rm -f .github/workflows/recover-game-info-bit21.yml
          git commit -m 'Recover fa_game_info bit21 predicate'
          git push
