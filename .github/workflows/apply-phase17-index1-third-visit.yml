name: Apply selector17 index1 third visit

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/apply-phase17-index1-third-visit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_phase17_index1_third_visit.py
      - run: rm .github/workflows/apply-phase17-index1-third-visit.yml scripts/apply_phase17_index1_third_visit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover selector17 index1 third visit and exit"
          git push
