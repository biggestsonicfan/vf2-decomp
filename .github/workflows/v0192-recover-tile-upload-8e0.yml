name: v0192 recover tile upload 8e0
'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0192-recover-tile-upload-8e0.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovered tile uploader
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          patch = base64.b64decode('')
          Path('/tmp/v0192.patch').write_bytes(patch)
          PY
          git apply --check /tmp/v0192.patch
          git apply /tmp/v0192.patch
          git diff --check
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm .github/workflows/v0192-recover-tile-upload-8e0.yml
          git add src/recovered/texture_bridge_texture.c
          git commit -m 'Recover texture tile upload helper at 0x8e0'
          git push origin HEAD:master
