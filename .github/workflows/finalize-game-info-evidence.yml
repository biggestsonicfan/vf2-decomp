name: Finalize game-info evidence
on:
  push:
    branches: [master]
    paths: [.github/workflows/finalize-game-info-evidence.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct game-info notes and changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('decomp/i960/notes/game_info_18644_mode_bit6.md')
          s = p.read_text()
          old = '''The bilateral bit4 composition is now also recovered with a nonzero countdown. The decisive differential starts from the real caller boundary at `0x000164ac`, immediately before the `0x00018644` call, and edits architectural `r7/r8` directly rather than fighter registry flags. For `0x00000100/0x00000110` and the reversed orientation, the candidate recovered child followed by the unchanged ROM tail to `0x00010dcc` matches the pure-ROM reference snapshot exactly in all four countdown probes: 188 instructions with mode bit 6 clear and 193 with it set. The zero-countdown controls also match at 212/217. Thus countdown takes the shared `0x18890` rejoin before the directional zero-countdown bit4 accounting matters.\n'''
          new = '''The bilateral bit4 composition with exactly one fighter carrying bit 4 was revalidated from the real state source rather than synthetic caller registers. The `0x18644` prologue loads `r7/r8` from `fighter+0x1a4`, so controlled probes write `0x00000100/0x00000110` (and the reversed physical orientation) to those two state fields at the caller boundary `0x000164ac`. Both `0x18644` call sites were then validated independently. Across both orientations, the first-call-to-task totals are 197/202 instructions with zero countdown and mode bit 6 clear/set, and 194/199 with nonzero countdown. Complete CPU/memory snapshots and instruction/call/return counters match in all 16 first/second-call probes after correcting the call-site-specific accounting. These measurements supersede the earlier synthetic `r7/r8` counts.\n'''
          if old not in s:
              raise SystemExit('old asymmetric bit4 paragraph missing')
          s = s.replace(old, new, 1)

          old_scope = '''The mixed bilateral recoveries remain deliberately narrow. Exactly one fighter may carry bit 4 or bit 1; both bit1 and bit4 are ROM-backed with zero or nonzero countdown in either physical orientation. Bit1 on both fighters, bit4 on both fighters and other unmeasured extra-bit combinations remain fail-closed.'''
          new_scope = '''The bilateral recoveries remain deliberately exact-state. One-extra-bit bit1 and bit4 compositions are ROM-backed in either physical orientation; both-bit4 (`0x00000110/0x00000110`) is ROM-backed at 202/207 caller-to-task instructions for mode bit 6 clear/set with either zero or nonzero countdown; and both-bit1 (`0x00000102/0x00000102`) is ROM-backed at 232/237 with zero countdown and 208/213 with nonzero countdown. Other unmeasured mixed-extra-state combinations remain fail-closed.'''
          if old_scope not in s:
              raise SystemExit('old scope paragraph missing')
          p.write_text(s.replace(old_scope, new_scope, 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          start = s.index('- expanded `fa_game_info` state-bit-8 recovery at `0x00018644`:')
          end = s.index('- completed selector 3\'s phase table:', start)
          bullet = '''- expanded `fa_game_info` state-bit-8 recovery at `0x00018644`: isolated\n  bit8+bit1 and bit8+bit4 remain recovered; bilateral bit8 matches the existing\n  zero/nonzero-countdown matrices; the asymmetric bilateral bit8+bit4 state\n  (`0x100/0x110` in either physical orientation) was revalidated from the real\n  `fighter+0x1a4` state source at both `0x18644` call sites, with exact CPU,\n  mutable-memory, instruction, call and return equality; bilateral both-bit4\n  (`0x110/0x110`) matches 202/207 caller-to-task instructions with mode bit 6\n  clear/set for either countdown state, while bilateral both-bit1\n  (`0x102/0x102`) matches 232/237 with zero countdown and 208/213 with nonzero\n  countdown; unrelated unmeasured mixed-extra-state combinations remain\n  explicitly fail-closed;\n'''
          p.write_text(s[:start] + bullet + s[end:])
          PY
      - name: Commit corrected evidence and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-game-info-evidence.yml
          git add decomp/i960/notes/game_info_18644_mode_bit6.md CHANGELOG.md
          git commit -m "docs: correct game-info bilateral evidence"
          git push
