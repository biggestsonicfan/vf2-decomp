name: Integrate zero-interpreted second dispatch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply verified zero-interpreted recovery
        run: |
          git fetch origin automation/zero-interpreted-integration
          git checkout origin/automation/zero-interpreted-integration -- tools/zero-stage/patch.part??
          cat tools/zero-stage/patch.part?? > /tmp/vf2-zero-final.patch.b64
          base64 -d /tmp/vf2-zero-final.patch.b64 > /tmp/vf2-zero-final.patch.gz
          test "$(sha256sum /tmp/vf2-zero-final.patch.gz | cut -d' ' -f1)" = "36b33829b1dcd9dbe63987e05a57458187def95d20781f2c7526078edd2ad06a"
          gzip -t /tmp/vf2-zero-final.patch.gz
          gzip -dc /tmp/vf2-zero-final.patch.gz > /tmp/vf2-zero-final.patch
          test "$(sha256sum /tmp/vf2-zero-final.patch | cut -d' ' -f1)" = "6ae00b4d0e4f9d7685dde330580d91df9844df399efb89606821cb879781e089"
          git apply --check /tmp/vf2-zero-final.patch
          git apply /tmp/vf2-zero-final.patch
          rm -rf tools/zero-stage
          rm .github/workflows/integrate-zero-interpreted.yml

      - name: Configure warning-as-error build
        run: >-
          cmake -S . -B build
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run ROM-independent tests
        run: >-
          ctest --test-dir build --output-on-failure
          -R '^(vf2_tests|vf2_orchestrator_.*)$'

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "decomp(i960): complete native second-dispatch bridge"
          git push origin master
