name: One-shot player 19ef8 selector integration

on:
  push:
    paths:
      - .github/workflows/one-shot-player-19ef8-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate semantic selector setup into 0x19ef8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          selector_path = Path('src/recovered/player_selector_setup.inc')
          selector_text = selector_path.read_text()
          guard = 'VF2_PLAYER_SELECTOR_INTERNAL_ONLY'
          wrapper_marker = '\nstatic vf2_status player_selector_execute_setup_with_ac(\n'
          if guard not in selector_text:
              start = selector_text.rfind(wrapper_marker)
              if start < 0:
                  raise SystemExit('selector wrapper marker not found')
              selector_text = (
                  selector_text[:start]
                  + f'\n#ifndef {guard}\n'
                  + selector_text[start + 1:]
              )
              if not selector_text.endswith('\n'):
                  selector_text += '\n'
              selector_text += f'#endif /* {guard} */\n'
              selector_path.write_text(selector_text)

          hybrid_path = Path('src/recovered/hybrid.c')
          text = hybrid_path.read_text()

          include_marker = '\nstatic vf2_status hybrid_read_u32_triple(\n'
          include_block = (
              '\n#define VF2_PLAYER_SELECTOR_INTERNAL_ONLY\n'
              '#include "player_selector_setup.inc"\n'
              '#undef VF2_PLAYER_SELECTOR_INTERNAL_ONLY\n\n'
              'static vf2_status hybrid_read_u32_triple(\n'
          )
          if '#include "player_selector_setup.inc"' not in text:
              if include_marker not in text:
                  raise SystemExit('hybrid include insertion marker not found')
              text = text.replace(include_marker, include_block, 1)

          old_vars = '''    uint8_t source_bytes[8] = {0u};
              uint8_t record_byte_9 = 0u;
              uint8_t record_byte_10 = 0u;
              uint16_t table_value = 0u;
              size_t index = 0u;
              vf2_status status = VF2_OK;
          '''
          old_vars = '\n'.join(line[14:] if line.startswith('              ') else line for line in old_vars.splitlines()) + '\n'
          new_vars = '''    uint8_t source_bytes[8] = {0u};
    vf2_player_selector_setup_plan selector_plan;
    size_t index = 0u;
    vf2_status status = VF2_OK;
'''
          if 'vf2_player_selector_setup_plan selector_plan;' not in text:
              if old_vars not in text:
                  raise SystemExit('19ef8 variable block not found')
              text = text.replace(old_vars, new_vars, 1)

          read_start_marker = '''    if (status == VF2_OK) {
        status = vf2_model2a_read_u32(
            machine,
            UINT32_C(0x0200d34c) + selector * UINT32_C(4),
            &data_pointer
        );
    }
'''
          packed_marker = '    packed_value = (uint32_t)source_bytes[0] |\n'
          start = text.find(read_start_marker)
          if start < 0:
              raise SystemExit('19ef8 selector table-read block not found')
          end = text.find(packed_marker, start)
          if end < 0:
              raise SystemExit('19ef8 packed-value marker not found')
          replacement = '''    if (status == VF2_OK) {
        status = player_selector_prepare_setup(
            machine,
            player,
            selector & UINT32_C(0x1fff),
            &selector_plan
        );
    }
    if (status == VF2_OK) {
        data_pointer = selector_plan.data_pointer;
        table_pointer = selector_plan.table_pointer;
    }
    for (index = 0u; status == VF2_OK && index < sizeof(source_bytes); ++index) {
        status = hybrid_read_u8(
            machine, data_pointer + (uint32_t)index, &source_bytes[index]
        );
    }
'''
          text = text[:start] + replacement + text[end:]

          guard_needle = '''        (source_bytes[4] | source_bytes[5] | source_bytes[6] |
         source_bytes[7]) != 0u ||
'''
          guard_replacement = '''        (source_bytes[4] | source_bytes[5] | source_bytes[6] |
         source_bytes[7]) != 0u ||
        selector_plan.terminator != UINT8_C(8) ||
        selector_plan.opcode_count != 2u ||
        selector_plan.final_cursor != data_pointer + UINT32_C(12) ||
'''
          if 'selector_plan.opcode_count != 2u' not in text:
              if guard_needle not in text:
                  raise SystemExit('19ef8 selector guard marker not found')
              text = text.replace(guard_needle, guard_replacement, 1)

          manual_start = text.find(
              '    /* Observed 0x1a1e4 setup before its indirect record walk. */\n'
          )
          manual_end = text.find(
              '    /* 0x26ef0: expand the 20 x 3 selector stream into the scratch RAM. */\n',
              manual_start,
          )
          if manual_start < 0 or manual_end < 0:
              raise SystemExit('manual 0x1a1e4 block not found')
          semantic_call = '''    /* 0x19ef8 latches the masked selector before calling 0x1a1e4. */
    if (status == VF2_OK) {
        status = hybrid_write_u16(
            machine,
            player + UINT32_C(0x1a8),
            (uint16_t)(selector & UINT32_C(0x1fff))
        );
    }
    if (status == VF2_OK) {
        status = hybrid_write_u16(machine, player + UINT32_C(0x1aa), 1u);
    }
    if (status == VF2_OK) {
        status = player_selector_apply_setup(
            machine, &selector_plan, cpu->arithmetic_control
        );
    }

'''
          text = text[:manual_start] + semantic_call + text[manual_end:]

          old_comment = '''/* Recover the accepted 0x14288 -> 0x19ef8 corridor.  The observed profile
 * selector is 0x505.  Its nested 0x1a1e4 setup consumes ROM data, 0x26ef0
 * expands the corresponding 60-byte scratch stream, and 0x27130 takes the
 * early clear/return path.  Other selectors and branch combinations remain
 * explicit ROM continuations. */
'''
          new_comment = '''/* Recover the accepted 0x14288 -> 0x19ef8 corridor.  The caller still
 * retains the observed selector-0x505 state guard, but its nested 0x1a1e4
 * work is delegated to the generic selector-bytecode interpreter.  0x26ef0
 * and the accepted 0x27130 early path remain independent recovery bounds. */
'''
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)

          hybrid_path.write_text(text)
          PY

          rm .github/workflows/one-shot-player-19ef8-integration.yml
          git config user.name "vf2-decomp recovery bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/recovered/hybrid.c src/recovered/player_selector_setup.inc .github/workflows/one-shot-player-19ef8-integration.yml
          git diff --cached --check
          git commit -m "Integrate semantic selector setup into player 19ef8"
          git push origin HEAD:master
