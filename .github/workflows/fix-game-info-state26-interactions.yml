name: Fix game-info state26 interactions
on: [push]
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix state26 interaction accounting
        run: echo '' | base64 -d | python
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: cp build/vf2i960 vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-state26-interactions
          path: vf2i960
      - name: Commit and cleanup
        run: |
          rm .github/workflows/fix-game-info-state26-interactions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c .github/workflows/fix-game-info-state26-interactions.yml
          git commit -m 'Fix fa_game_info state26 interactions'
          git push
