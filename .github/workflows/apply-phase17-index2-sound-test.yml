name: Apply selector17 index2 sound test

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/apply-phase17-index2-sound-test.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_phase17_index2_sound_test.py
      - run: rm .github/workflows/apply-phase17-index2-sound-test.yml scripts/apply_phase17_index2_sound_test.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover selector17 index2 sound test entry"
          git push
