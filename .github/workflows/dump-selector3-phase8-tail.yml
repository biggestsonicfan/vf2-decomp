name: Dump selector3 phase8 tail
on:
  push:
    branches: [master]
    paths: [.github/workflows/dump-selector3-phase8-tail.yml]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/recovered/texture_bridge_match.c').read_text()
          i=s.index('if (status == VF2_OK && phase8_handoff)')
          print(s[i-2500:i+5000])
          PY
