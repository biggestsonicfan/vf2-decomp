name: Dump selector3 phase1 candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/dump-selector3-phase1-candidate.yml

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate and dump phase1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/finish-selector3-phase1-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("          PY\n", start)
          script = wf[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, 'phase1_v2_patch.py', 'exec'))
          s = Path('src/recovered/texture_bridge_match.c').read_text()
          a = s.index('static vf2_status execute_selector3_phase1(')
          b = s.index('static vf2_status execute_selector3_phase3(', a)
          print('=== PHASE1 CANDIDATE ===')
          print(s[a:b])
          c = s.index('    if (selector == UINT8_C(3)) {')
          d = s.index('    if (selector == UINT8_C(4)) {', c)
          print('=== SELECTOR3 DISPATCH CANDIDATE ===')
          print(s[c:d])
          PY
