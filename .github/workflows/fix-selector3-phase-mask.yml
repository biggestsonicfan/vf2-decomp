name: Fix selector3 phase mask

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-selector3-phase-mask.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix acf8 phase mask semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()
          old='''                (uint32_t)entry_phase << 1u\n'''
          new='''                UINT32_C(1) << (uint32_t)entry_phase\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/fix-selector3-phase-mask.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c .github/workflows/fix-selector3-phase-mask.yml
          git commit -m 'Fix selector3 phase mask semantics'
          git push origin HEAD:master
