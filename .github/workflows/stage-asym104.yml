name: Stage asymmetric 0x100-0x104 candidate
on:
  push:
    branches: [master]
    paths: [.github/workflows/stage-asym104.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact asymmetric bit2 candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c'); s=p.read_text()
          old='''        const bool bilateral_both_bit2 =\n            r7 == state8_bit2 && r8 == state8_bit2;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4 &&\n            !bilateral_both_bit1_bit4 && !bilateral_both_bit2_bit4 &&\n            !bilateral_both_bit2) {\n'''
          new='''        const bool bilateral_both_bit2 =\n            r7 == state8_bit2 && r8 == state8_bit2;\n        const bool bilateral_asym_bit2 =\n            (r7 == state8 && r8 == state8_bit2) ||\n            (r8 == state8 && r7 == state8_bit2);\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4 &&\n            !bilateral_both_bit1_bit4 && !bilateral_both_bit2_bit4 &&\n            !bilateral_both_bit2 && !bilateral_asym_bit2) {\n'''
          if old not in s: raise SystemExit('initial asym104 anchor missing')
          s=s.replace(old,new,1)
          old2='''            const bool both_bit2 =\n                r7 == state8_bit2 && r8 == state8_bit2;\n            if (!both_bit4 && !cross_bit1_bit4 && !both_bit1_bit4 &&\n                !both_bit2_bit4 && !both_bit2) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n'''
          new2='''            const bool both_bit2 =\n                r7 == state8_bit2 && r8 == state8_bit2;\n            const bool asym_bit2 =\n                (r7 == (UINT32_C(1) << 8u) && r8 == state8_bit2) ||\n                (r8 == (UINT32_C(1) << 8u) && r7 == state8_bit2);\n            if (!both_bit4 && !cross_bit1_bit4 && !both_bit1_bit4 &&\n                !both_bit2_bit4 && !both_bit2 && !asym_bit2) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n'''
          if old2 not in s: raise SystemExit('threshold asym104 anchor missing')
          s=s.replace(old2,new2,1)
          old3='''    if (status == VF2_OK) {\n        const uint32_t state8_bit2 =\n            (UINT32_C(1) << 8u) | (UINT32_C(1) << 2u);\n        if (r7 == state8_bit2 && r8 == state8_bit2) {\n            if (return_address == UINT32_C(0x000164b0)) {\n                if (!countdown_path) {\n                    body_instructions -= UINT32_C(2);\n                }\n            } else if (return_address == UINT32_C(0x000164c4)) {\n                if (countdown_path) {\n                    --body_instructions;\n                } else {\n                    body_instructions -= mode_bit6\n                        ? UINT32_C(5) : UINT32_C(6);\n                }\n            }\n        }\n    }\n'''
          new3='''    if (status == VF2_OK) {\n        const uint32_t state8 = UINT32_C(1) << 8u;\n        const uint32_t state8_bit2 =\n            state8 | (UINT32_C(1) << 2u);\n        const bool bilateral_bit2_accounting =\n            (r7 == state8_bit2 && r8 == state8_bit2) ||\n            (r7 == state8 && r8 == state8_bit2) ||\n            (r8 == state8 && r7 == state8_bit2);\n        if (bilateral_bit2_accounting) {\n            if (return_address == UINT32_C(0x000164b0)) {\n                if (!countdown_path) {\n                    body_instructions -= UINT32_C(2);\n                }\n            } else if (return_address == UINT32_C(0x000164c4)) {\n                if (countdown_path) {\n                    --body_instructions;\n                } else {\n                    body_instructions -= mode_bit6\n                        ? UINT32_C(5) : UINT32_C(6);\n                }\n            }\n        }\n    }\n'''
          if old3 not in s: raise SystemExit('accounting asym104 anchor missing')
          p.write_text(s.replace(old3,new3,1))
          PY
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish candidate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C probe-asym104-accounting
          git add src/recovered/hybrid.c
          git commit -m "candidate: account asymmetric state8 bit2 state"
          git push --force origin probe-asym104-accounting
