name: Fix game-info bit15 fallback accounting
on: [push]
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix bit15 fallback accounting
        run: python -c "from pathlib import Path; p=Path('src/recovered/hybrid.c'); s=p.read_text(); old='    if (native_state4_bit15_fighter_path) {\n        native_instructions += UINT64_C(1);\n    }\n'; new=old+'    if (!native_bit15_fighter_path &&\n        !native_state4_bit15_fighter_path &&\n        ((fighter0_state_flags | fighter1_state_flags) &\n         (UINT32_C(1) << 15u)) != 0u) {\n        /* When bit 15 is combined with bit 6, 14 or 16, the isolated native\n         * bit-15 corridor is not selected and the ROM-backed dispatcher path\n         * executes one additional branch before the common RET. */\n        native_instructions += UINT64_C(1);\n    }\n'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: cp build/vf2i960 vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-bit15-fallback
          path: vf2i960
      - name: Commit and cleanup
        run: |
          rm .github/workflows/fix-game-info-bit15-rom-fallback-accounting.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c .github/workflows/fix-game-info-bit15-rom-fallback-accounting.yml
          git commit -m 'Fix fa_game_info bit15 fallback accounting'
          git push
