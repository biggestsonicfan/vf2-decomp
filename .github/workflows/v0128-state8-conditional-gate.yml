name: v0128 state8 conditional gate hardening

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0128-state8-conditional-gate.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict isolated conditional gates to measured state 8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/recovered/hybrid.c')
          text = path.read_text()
          old = '        fighter0_state != 4u && fighter1_state != 4u &&\n'
          new = '        fighter0_state == 8u && fighter1_state == 8u &&\n'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 isolated conditional state gates, found {count}')
          text = text.replace(old, new)
          anchor = '    native_bit14_fighter_path =\n'
          comment = '''    /* The positive isolated bit-14/15/16 dispatcher admissions are\n     * state-8 recoveries.  The caller is selected by fighter flag bit 31\n     * and does not constrain +0xa00, so the former !=4 test silently\n     * admitted unmeasured state bytes. Keep non-state-8 values fail-closed. */\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'conditional gate comment anchor count={text.count(anchor)}')
          text = text.replace(anchor, comment + anchor, 1)
          path.write_text(text)

          note = Path('decomp/i960/notes/game_info_1645c_state8_conditional_gate_v0128.md')
          note.write_text('''# `fa_game_info` `0x1645c`: state-8 conditional gate hardening\n\n## Result\n\nThe three generic positive dispatcher predicates for isolated conditional bits\n14, 15 and 16 used `fighter_state != 4`. That was broader than the evidence:\nthe full-dispatch measurements and the later family audit are explicitly state 8,\nwhile the bit-31 task caller itself is selected from fighter flags and does not\nconstrain the byte at `fighter + 0xa00`. Consequently values other than 4 or 8\ncould silently enter the recovered `0x18644` corridor.\n\nv0128 changes only that state gate. `native_bit14_fighter_path`,\n`native_bit15_fighter_path` and `native_bit16_fighter_path` now require both\nfighter state bytes to equal 8. Their existing state-8 flag-mask and threshold\nbehavior is unchanged. State-4 paths continue through their separately measured\npredicates, and every other state value fails closed.\n\nThis is a boundary correction, not a claim of new game semantics. It aligns the\nimplementation with the committed full-task evidence, including the isolated\nbit-14 dispatcher measurement and the v0124 audit of remaining state-8\nadmissions.\n\n## Validation\n\nThe one-shot application gate builds and tests the modified tree with GCC,\nClang, and Clang ASan/UBSan before committing it. No ROM-derived artifact is\ncreated or committed. ROM-backed full-dispatch matrices remain the authority for\nany future widening of these gates.\n''')
          PY

      - name: Configure GCC
        run: cmake -S . -B build-gcc -G Ninja -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build GCC
        run: cmake --build build-gcc --parallel
      - name: Test GCC
        run: ctest --test-dir build-gcc --output-on-failure

      - name: Configure Clang
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build-clang -G Ninja -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build Clang
        run: cmake --build build-clang --parallel
      - name: Test Clang
        run: ctest --test-dir build-clang --output-on-failure

      - name: Configure Clang sanitizers
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build-san -G Ninja -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build Clang sanitizers
        run: cmake --build build-san --parallel
      - name: Test Clang sanitizers
        run: ctest --test-dir build-san --output-on-failure

      - name: Commit hardened state gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0128-state8-conditional-gate.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_state8_conditional_gate_v0128.md
          git commit -m "Fail closed non-state8 conditional dispatcher paths"
          git push origin HEAD:master
