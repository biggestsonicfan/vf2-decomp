name: v0126 recover bit16 compounds

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0126-recover-bit16-compounds.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply measured v0126 recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/recovered/hybrid.c')
          text = path.read_text()

          old = '''    if (status == VF2_OK) {\n        r10 = 0u;\n        r15 = UINT32_C(0x15802b2b);\n        status = vf2_model2a_write_u32(machine, port, r15);\n    }\n'''
          new = '''    if (status == VF2_OK &&\n        (r7 == UINT32_C(0x00210000) ||\n         r7 == UINT32_C(0x00218000))) {\n        uint16_t field_b24 = 0u;\n        status = hybrid_read_u16(\n            machine, fighter0 + UINT32_C(0x00000b24), &field_b24\n        );\n        if (status == VF2_OK) {\n            status = hybrid_write_u16(\n                machine, fighter0 + UINT32_C(0x00000b24),\n                (uint16_t)(field_b24 | UINT16_C(0x8000))\n            );\n        }\n    }\n    if (status == VF2_OK) {\n        r10 = 0u;\n        r15 = UINT32_C(0x15802b2b);\n        status = vf2_model2a_write_u32(machine, port, r15);\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'child insertion anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        /* The bit-16 compounds 0x00210000 and 0x00218000 still show one\n         * unrecovered work-RAM flag byte in the child corridor and remain\n         * retired until that store is recovered. */\n        const bool measured_compound21_mask =\n            combined_state8_flags == UINT32_C(0x00204000) ||\n            combined_state8_flags == UINT32_C(0x00208000);\n'''
          new = '''        /* The four two-bit/three-bit bit-21 compounds now have complete\n         * measured state and accounting, including the recovered bit-16\n         * child-side flag store at fighter+0xb24. */\n        const bool measured_compound21_mask =\n            combined_state8_flags == UINT32_C(0x00204000) ||\n            combined_state8_flags == UINT32_C(0x00208000) ||\n            combined_state8_flags == UINT32_C(0x00210000) ||\n            combined_state8_flags == UINT32_C(0x00218000);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'compound mask anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        case UINT32_C(0x00208000):\n            if (bilateral) {\n                native_instructions +=\n                    countdown_was_nonzero ? (uint64_t)-(int64_t)5\n                                          : UINT64_C(3);\n            } else {\n                native_instructions +=\n                    countdown_was_nonzero ? (uint64_t)-(int64_t)2\n                                          : UINT64_C(2);\n            }\n            break;\n        }\n'''
          new = '''        case UINT32_C(0x00208000):\n            if (bilateral) {\n                native_instructions +=\n                    countdown_was_nonzero ? (uint64_t)-(int64_t)5\n                                          : UINT64_C(3);\n            } else {\n                native_instructions +=\n                    countdown_was_nonzero ? (uint64_t)-(int64_t)2\n                                          : UINT64_C(2);\n            }\n            break;\n        case UINT32_C(0x00210000):\n            /* Measured flat deficit: +4 for either unilateral orientation,\n             * +7 when both fighter records carry the mask. */\n            native_instructions += bilateral ? UINT64_C(7) : UINT64_C(4);\n            break;\n        case UINT32_C(0x00218000):\n            /* Measured flat deficit: +4 for either unilateral orientation,\n             * +8 when both fighter records carry the mask. */\n            native_instructions += bilateral ? UINT64_C(8) : UINT64_C(4);\n            break;\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'accounting switch anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)

          note = Path('decomp/i960/notes/game_info_1645c_full_state8_bit16_compounds_v0126.md')
          note.write_text('''# `fa_game_info` `0x1645c`: recover the bit-16 + bit-21 compounds\n\n## Result\n\nThe two masks left retired by v0125 are now recovered:\n\n- `0x00210000` ({16,21})\n- `0x00218000` ({15,16,21})\n\nThe v0125 differential isolated a single architectural memory gap in the\nrecovered `0x18644` child corridor: when the active fighter record carries\neither exact mask, the reference sets bit 15 of the 16-bit field at\n`fighter + 0xb24` (the high byte is at `+0xb25`). The native child now\nperforms the same read/modify/write, preserving all other bits.\n\nThe already measured full-dispatch instruction deficits are admitted unchanged:\n\n- `0x00210000`: unilateral `+4`, bilateral `+7`;\n- `0x00218000`: unilateral `+4`, bilateral `+8`.\n\nThe admission remains exact-mask-only, state-8-only and threshold `0..2`;\nneighboring/unmeasured compositions remain fail-closed. Stale-frame handling\ncontinues through the shared compound-21 clause.\n\n## Validation\n\nThe repository CI build, CTest suite and sanitizer suite are required to pass.\nThe ROM-backed 36-case matrices remain the authoritative differential gate when\na supported local ROM set is available; no ROM-derived artifact is committed.\n''')
          PY

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit recovered corridor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_full_state8_bit16_compounds_v0126.md
          git commit -m "Recover bit-16 bit-21 child store and admit final compounds [v0126 applied]"
          git push origin HEAD:master
