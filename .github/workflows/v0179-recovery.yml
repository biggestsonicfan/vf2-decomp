name: v0179 recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0179-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0179 recovery
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v0179.patch
          git apply /tmp/v0179.patch
          echo '' | base64 -d > decomp/i960/notes/game_info_1645c_state4_bit15_isolated_high_v0179.md
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          git diff --check
      - name: Commit recovery
        shell: bash
        run: |
          git config user.name 'celsowm'
          git config user.email 'celsowm@gmail.com'
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_state4_bit15_isolated_high_v0179.md
          git commit -m 'Recover state-4 bit15 high extensions'
          git rm .github/workflows/v0179-recovery.yml
          git commit -m 'Remove v0179 recovery workflow'
          git push origin HEAD:master
