name: Recover game-info state26
on:
  push:
    paths:
      - '.github/workflows/recover-game-info-state26.yml'
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Recover state26 fast path
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          needle = '''        if (mode_bit6) {
            /* Raw ROM measurements at the 0x18644 entry/return boundaries
             * give 102->105 instructions for the ordinary first invocation
             * and 97->99 for the prior +0x5b8 bit-1 invocation. */
            body_instructions +=
                (r3 & (UINT32_C(1) << 1u)) != 0u ? 2u : 3u;
        }
'''
          repl = needle + '''        if ((r8 & (UINT32_C(1) << 26u)) != 0u) {
            /* 0x18778..0x18784 masks state bits 4/14/15/16/26.  With the
             * isolated bit-26 state observed in either fighter, the BNE at
             * 0x18784 jumps directly to 0x18890.  Entry/return probes of both
             * dispatcher invocations show this removes exactly nine
             * instructions and has no additional visible memory/register
             * side effects on the measured neutral corridor. */
            body_instructions -= UINT32_C(9);
        }
'''
          if needle not in s:
              raise SystemExit('state26 insertion anchor not found')
          p.write_text(s.replace(needle, repl, 1))
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: cp build/vf2i960 vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-state26
          path: vf2i960
      - name: Commit and cleanup
        shell: bash
        run: |
          rm .github/workflows/recover-game-info-state26.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/recovered/hybrid.c .github/workflows/recover-game-info-state26.yml
          git commit -m 'Recover fa_game_info state26 fast path'
          git push
