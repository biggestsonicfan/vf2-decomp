name: v0166 source export

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0166-source-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: zip -qr vf2-current-source.zip . -x '.git/*' 'build/*'
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: vf2-current-source-v0166
          path: vf2-current-source.zip
          retention-days: 1
