name: v0156 complete mixed state4 domain integration

on:
  push:
    branches: [master]
    paths:
      - '.github/v0156.patch'
      - '.github/workflows/v0156-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0156 recovery
        run: |
          git apply --index .github/v0156.patch
          git diff --cached --check

      - name: Configure
        run: cmake -S . -B build -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit recovery
        run: |
          rm .github/v0156.patch .github/workflows/v0156-integrate.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete mixed negative state4 flag domain'
          git push origin master
