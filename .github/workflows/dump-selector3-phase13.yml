name: Update bilateral bit4 changelog
on:
  push:
    branches: [master]
    paths: [.github/workflows/dump-selector3-phase13.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md'); s=p.read_text()
          old='''- expanded `fa_game_info` state-bit-8 recovery at `0x00018644`: the\n  controlled mode-bit-6 matrix remains exact, isolated bit8+bit1 and\n  zero-countdown bit8+bit4 are recovered, and isolated bilateral bit8 now\n  matches both zero-countdown (690/695 instructions with mode bit 6 clear/set)\n  and nonzero-countdown (666/671); bilateral mixed states and other unmeasured\n  combinations remain explicitly fail-closed;\n'''
          new='''- expanded `fa_game_info` state-bit-8 recovery at `0x00018644`: isolated\n  bit8+bit1 and bit8+bit4 are recovered, bilateral bit8 matches zero-countdown\n  (690/695 instructions with mode bit 6 clear/set) and nonzero-countdown\n  (666/671), and zero-countdown bilateral bit8+bit4 on exactly one fighter\n  matches 677/682 in either physical orientation; countdown/both-fighter bit4\n  mixtures and other unmeasured combinations remain explicitly fail-closed;\n'''
          if old not in s: raise SystemExit('changelog anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: record bilateral state8 bit4 totals"
          git push
