name: Apply validated bilateral bit4 candidate
on:
  push:
    branches: [master]
    paths: [.github/workflows/dump-selector3-phase13.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply validated parent candidate
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          y=subprocess.check_output(['git','show','HEAD^:.github/workflows/dump-selector3-phase13.yml'],text=True)
          block=y.split("python3 - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          exec(textwrap.dedent(block),{'__name__':'__main__'})
          PY
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recovered/hybrid.c
          git commit -m "Recover fa_game_info bilateral state8 bit4 corridor"
          git push
