name: Dump selector3 phase13
on:
  push:
    branches: [master]
    paths: [.github/workflows/dump-selector3-phase13.yml]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/recovered/texture_bridge_match.c').read_text()
          for n in ['phase == UINT8_C(13)', 'entry_phase == UINT8_C(13)', 'UINT8_C(13)']:
              if n in s:
                  i=s.index(n)
                  Path('decomp/i960/notes/selector3_phase13_dump.tmp').write_text(
                      f'OFFSET {i}\n' + s[max(0,i-12000):min(len(s),i+22000)]
                  )
                  break
          else:
              raise SystemExit('phase13 anchor not found')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decomp/i960/notes/selector3_phase13_dump.tmp
          git commit -m "ci: capture selector3 phase13 recovery boundary"
          git push
