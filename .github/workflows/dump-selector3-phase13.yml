name: Validate bilateral state8 bit1 countdown
on:
  push:
    branches: [master]
    paths: [.github/workflows/dump-selector3-phase13.yml]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c')
          s=p.read_text()
          old='''    if (status == VF2_OK &&\n        (r7 & (UINT32_C(1) << 8u)) != 0u &&\n        (r8 & (UINT32_C(1) << 8u)) != 0u &&\n        (r7 != (UINT32_C(1) << 8u) ||\n         r8 != (UINT32_C(1) << 8u)) &&\n        (countdown_path ||\n         !((r7 == (UINT32_C(1) << 8u) &&\n            (r8 == ((UINT32_C(1) << 8u) | (UINT32_C(1) << 4u)) ||\n             r8 == ((UINT32_C(1) << 8u) | (UINT32_C(1) << 1u)))) ||\n           (r8 == (UINT32_C(1) << 8u) &&\n            (r7 == ((UINT32_C(1) << 8u) | (UINT32_C(1) << 4u)) ||\n             r7 == ((UINT32_C(1) << 8u) | (UINT32_C(1) << 1u))))))) {\n        /* Only the isolated bilateral state-bit-8 corridor is ROM-backed.\n         * Mixed bilateral states remain fail-closed. */\n        status = VF2_ERROR_UNSUPPORTED;\n    }\n'''
          new='''    if (status == VF2_OK &&\n        (r7 & (UINT32_C(1) << 8u)) != 0u &&\n        (r8 & (UINT32_C(1) << 8u)) != 0u &&\n        (r7 != (UINT32_C(1) << 8u) ||\n         r8 != (UINT32_C(1) << 8u))) {\n        const uint32_t state8 = UINT32_C(1) << 8u;\n        const uint32_t state8_bit1 = state8 | (UINT32_C(1) << 1u);\n        const uint32_t state8_bit4 = state8 | (UINT32_C(1) << 4u);\n        const bool bilateral_bit1 =\n            (r7 == state8 && r8 == state8_bit1) ||\n            (r8 == state8 && r7 == state8_bit1);\n        const bool bilateral_bit4 =\n            (r7 == state8 && r8 == state8_bit4) ||\n            (r8 == state8 && r7 == state8_bit4);\n        if ((!bilateral_bit1 && !bilateral_bit4) ||\n            (countdown_path && !bilateral_bit1)) {\n            /* Countdown composes only with the measured bilateral bit1\n             * pair. Bilateral bit4 countdown and other mixtures remain\n             * explicit ROM boundaries. */\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n    }\n'''
          if old not in s: raise SystemExit('bilateral mixed guard anchor missing')
          s=s.replace(old,new,1)
          old='''            if (countdown_path &&\n                return_address == UINT32_C(0x000164b0) &&\n                r7 == (UINT32_C(1) << 8u) &&\n                r8 == (UINT32_C(1) << 8u)) {\n                --body_instructions;\n            }\n'''
          new='''            if (countdown_path &&\n                return_address == UINT32_C(0x000164b0) &&\n                (r7 & (UINT32_C(1) << 8u)) != 0u &&\n                (r8 & (UINT32_C(1) << 8u)) != 0u) {\n                /* The measured bilateral countdown corridors rejoin one\n                 * instruction earlier in the first fighter order. */\n                --body_instructions;\n            }\n'''
          if old not in s: raise SystemExit('countdown bilateral adjustment anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-bilateral-bit1-countdown-candidate
          path: build/vf2i960
