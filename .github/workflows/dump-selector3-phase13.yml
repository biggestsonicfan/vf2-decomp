name: Dump selector3 phase13
on:
  push:
    branches: [master]
    paths: [.github/workflows/dump-selector3-phase13.yml]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/recovered/texture_bridge_match.c').read_text()
          anchor='vf2_status execute_selector3_phase13('
          i=s.index(anchor)
          j=s.find('\nvf2_status ', i+len(anchor))
          if j < 0: j=min(len(s), i+30000)
          out=s[i:j]
          Path('decomp/i960/notes/selector3_phase13_dump.tmp').write_text(out)
          print(out)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decomp/i960/notes/selector3_phase13_dump.tmp
          git commit -m "ci: isolate selector3 phase13 handler"
          git push
