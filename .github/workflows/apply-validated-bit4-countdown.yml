name: Apply validated bilateral bit4 countdown recovery
on:
  push:
    branches: [master]
    paths: [.github/workflows/apply-validated-bit4-countdown.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source and evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/recovered/hybrid.c'); s=p.read_text()
          old='''        if ((!bilateral_bit1 && !bilateral_bit4) ||\n            (countdown_path && !bilateral_bit1)) {\n            /* Countdown composes only with the measured bilateral bit1\n             * pair. Bilateral bit4 countdown and other mixtures remain\n             * explicit ROM boundaries. */\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          new='''        if (!bilateral_bit1 && !bilateral_bit4) {\n            /* The one-extra-bit bilateral bit1 and bit4 compositions are\n             * ROM-backed for both zero and nonzero countdown. Other mixed\n             * states remain explicit unsupported boundaries. */\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          if old not in s: raise SystemExit('hybrid guard anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('decomp/i960/notes/game_info_18644_mode_bit6.md'); s=p.read_text()
          marker='''The bilateral bit1 composition is also recovered with a nonzero countdown. The same directional +11 applies only while `0x00000102` is in `r8`: with bit 1 on fighter1 the calls measure 100/84 in mode-clear and 103/86 with mode bit 6 set, while bit 1 on fighter0 yields 89/95 and 92/97. Both physical orientations therefore match the ROM exactly at 677 instructions with mode bit 6 clear and 682 with it set. Complete native-resume snapshots match all four countdown references.\n'''
          para='''\nThe bilateral bit4 composition is now also recovered with a nonzero countdown. The decisive differential starts from the real caller boundary at `0x000164ac`, immediately before the `0x00018644` call, and edits architectural `r7/r8` directly rather than fighter registry flags. For `0x00000100/0x00000110` and the reversed orientation, the candidate recovered child followed by the unchanged ROM tail to `0x00010dcc` matches the pure-ROM reference snapshot exactly in all four countdown probes: 188 instructions with mode bit 6 clear and 193 with it set. The zero-countdown controls also match at 212/217. Thus countdown takes the shared `0x18890` rejoin before the directional zero-countdown bit4 accounting matters.\n'''
          if marker not in s: raise SystemExit('notes marker missing')
          s=s.replace(marker,marker+para,1)
          s=s.replace('Exactly one fighter may carry bit 4 or bit 1; bit1 is ROM-backed with zero or nonzero countdown, while bit4 remains zero-countdown only. Bit1 on both fighters, countdown plus bilateral bit4 and bit4 on both fighters remain fail-closed, as do other unmeasured extra-bit combinations.', 'Exactly one fighter may carry bit 4 or bit 1; both bit1 and bit4 are ROM-backed with zero or nonzero countdown in either physical orientation. Bit1 on both fighters, bit4 on both fighters and other unmeasured extra-bit combinations remain fail-closed.',1)
          p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text()
          old='''  (666/671), zero-countdown bilateral bit8+bit4 on exactly one fighter matches\n  677/682, and bilateral bit8+bit1 on exactly one fighter matches 701/706 with\n  zero countdown and 677/682 with nonzero countdown in either orientation;\n  both-fighter bit1, bit4 countdown/mirrors and other unmeasured combinations\n  remain explicitly fail-closed;\n'''
          new='''  (666/671), bilateral bit8+bit4 on exactly one fighter is ROM-backed with\n  zero and nonzero countdown in either orientation (the latter matches the\n  calibrated caller-to-task boundary at 188/193 instructions with mode bit 6\n  clear/set), and bilateral bit8+bit1 matches 701/706 with zero countdown and\n  677/682 with nonzero countdown; both-fighter bit1/bit4 and other unmeasured\n  combinations remain explicitly fail-closed;\n'''
          if old not in s: raise SystemExit('changelog anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_18644_mode_bit6.md CHANGELOG.md
          git commit -m "Recover bilateral state8 bit4 countdown corridor"
          git push
