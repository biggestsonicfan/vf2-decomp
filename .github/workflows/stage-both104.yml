name: Stage bilateral 0x104 candidate
on:
  push:
    branches: [master]
    paths: [.github/workflows/stage-both104.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact 0x104/0x104 candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c'); s=p.read_text()
          old='''        const bool bilateral_both_bit2_bit4 =\n            r7 == state8_bit2_bit4 && r8 == state8_bit2_bit4;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4 &&\n            !bilateral_both_bit1_bit4 && !bilateral_both_bit2_bit4) {\n'''
          new='''        const bool bilateral_both_bit2_bit4 =\n            r7 == state8_bit2_bit4 && r8 == state8_bit2_bit4;\n        const uint32_t state8_bit2 =\n            state8 | (UINT32_C(1) << 2u);\n        const bool bilateral_both_bit2 =\n            r7 == state8_bit2 && r8 == state8_bit2;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4 &&\n            !bilateral_both_bit1_bit4 && !bilateral_both_bit2_bit4 &&\n            !bilateral_both_bit2) {\n'''
          if old not in s: raise SystemExit('initial 0x104 anchor missing')
          s=s.replace(old,new,1)
          old2='''            const bool both_bit2_bit4 =\n                r7 == state8_bit2_bit4 && r8 == state8_bit2_bit4;\n            if (!both_bit4 && !cross_bit1_bit4 && !both_bit1_bit4 &&\n                !both_bit2_bit4) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n'''
          new2='''            const bool both_bit2_bit4 =\n                r7 == state8_bit2_bit4 && r8 == state8_bit2_bit4;\n            const uint32_t state8_bit2 =\n                (UINT32_C(1) << 8u) | (UINT32_C(1) << 2u);\n            const bool both_bit2 =\n                r7 == state8_bit2 && r8 == state8_bit2;\n            if (!both_bit4 && !cross_bit1_bit4 && !both_bit1_bit4 &&\n                !both_bit2_bit4 && !both_bit2) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n'''
          if old2 not in s: raise SystemExit('threshold 0x104 anchor missing')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish candidate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C probe-both104
          git add src/recovered/hybrid.c
          git commit -m "candidate: admit bilateral state8 bit2 state"
          git push --force origin probe-both104
