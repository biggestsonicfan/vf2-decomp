name: v0154 mixed state4 bit14 bit16 integration

on:
  push:
    branches: [master]
    paths:
      - '.github/v0154.patch'
      - '.github/workflows/v0154-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0154 recovery
        run: |
          git apply --index .github/v0154.patch
          git diff --cached --check
      - name: Configure
        run: cmake -S . -B build -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/v0154.patch .github/workflows/v0154-integrate.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_mixed_negative_state4_bit14_bit16_v0154.md
          git commit -m 'Recover mixed negative state4 bit14 bit16 path'
          git push origin HEAD:master
