name: Close phase13 random16
on:
  push:
    paths:
      - '.github/workflows/close-phase13-random16.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch random16 and fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()
          a=s.index('static vf2_status execute_selector3_random16(')
          b=s.index('\n}\n',a)+3
          x=s[a:b]
          x=x.replace('    uint32_t table = 0u;\n','',1)
          old='''    if (status == VF2_OK) {\n        table = state << 20u;\n        status = vf2_model2a_read_u32(machine, table, &word);\n    }\n'''
          new='''    if (status == VF2_OK) {\n        status = vf2_model2a_read_u32(machine, VF2_TIMER_BASE, &word);\n    }\n'''
          assert old in x
          x=x.replace(old,new,1)
          x=x.replace('table + UINT32_C(4)', 'VF2_TIMER_BASE + UINT32_C(4)')
          x=x.replace('table + UINT32_C(8)', 'VF2_TIMER_BASE + UINT32_C(8)')
          x=x.replace('table + UINT32_C(0xc)', 'VF2_TIMER_BASE + UINT32_C(0xc)')
          p.write_text(s[:a]+x+s[b:])

          p=Path('tests/analysis/test_orchestrator_bridge.c')
          s=p.read_text()
          old='''    write_rom_u32(main_data, UINT32_C(0x00800000), UINT32_C(0));\n    write_rom_u32(main_data, UINT32_C(0x00800004), UINT32_C(0));\n    write_rom_u32(main_data, UINT32_C(0x00800008), UINT32_C(0));\n    write_rom_u32(main_data, UINT32_C(0x0080000c), UINT32_C(0));\n'''
          assert old in s
          s=s.replace(old,'',1)
          s=s.replace('''    /* Phase thirteen uses the ROM PRNG table and reuses the gameplay task\n     * handoff with its two generated modes. */''','''    /* Phase thirteen samples the four Model 2A timer words and reuses the\n     * gameplay task handoff with its two generated modes. */''',1)
          needle='''    CHECK(vf2_model2a_read_u32(&machine, UINT32_C(0x00500098), &value) == VF2_OK);\n    CHECK(value == UINT32_C(0x28));\n'''
          assert needle in s
          s=s.replace(needle,'''    CHECK(vf2_model2a_read_u32(&machine, UINT32_C(0x00500098), &value) == VF2_OK);\n    CHECK(value == UINT32_C(0x32fcccf8));\n''',1)
          p.write_text(s)
          PY
      - name: Test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/close-phase13-random16.yml .github/workflows/fix-selector3-random16.yml .github/workflows/dump-selector3-random16.yml .github/workflows/dump-selector3-phase13-body.yml .github/workflows/dump-model2a-read.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c tests/analysis/test_orchestrator_bridge.c .github/workflows
          git commit -m 'Fix selector3 random16 timer source'
          git push origin HEAD:master
