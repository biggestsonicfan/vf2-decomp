name: Fix selector17 index10 border table
on:
  push:
    paths:
      - tools/fix_phase17_index10_border.py
      - .github/workflows/fix-phase17-index10-border.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact border table
        run: python3 tools/fix_phase17_index10_border.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/texture_bridge_match.c decomp/i960/notes/selector17_index10_vs_diagram.md
          git rm -f tools/fix_phase17_index10_border.py .github/workflows/fix-phase17-index10-border.yml
          git commit -m 'Fix selector17 index10 border table'
          git push
