name: Recover v0.0.24 orchestrator prefix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/recover-v0024-orchestrator-prefix.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Integrate prefix blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "include/vf2/hybrid.h",
              "    VF2_HYBRID_BRIDGE_GAME_COLOR_LOOKUP,\n"
              "    VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS,\n",
              "    VF2_HYBRID_BRIDGE_GAME_COLOR_LOOKUP,\n"
              "    VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_SAVE_CALL,\n"
              "    VF2_HYBRID_BRIDGE_TEXTURE_FRAME_GATE_CALL,\n"
              "    VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS,\n",
              "bridge enum",
          )

          replace_once(
              "src/recovered/texture_bridge.c",
              "#define VF2_GAME_COLOR_LOOKUP_ENTRY UINT32_C(0x000026ec)\n"
              "#define VF2_TEXTURE_DEFAULT_LIMITS_ENTRY UINT32_C(0x0004bfe0)\n",
              "#define VF2_GAME_COLOR_LOOKUP_ENTRY UINT32_C(0x000026ec)\n"
              "#define VF2_TEXTURE_ORCHESTRATOR_SAVE_ENTRY UINT32_C(0x0004bb18)\n"
              "#define VF2_TEXTURE_ORCHESTRATOR_BODY_ENTRY UINT32_C(0x0004bcd4)\n"
              "#define VF2_TEXTURE_ORCHESTRATOR_BODY_RETURN UINT32_C(0x0004bb94)\n"
              "#define VF2_TEXTURE_FRAME_GATE_ENTRY UINT32_C(0x0004bcd4)\n"
              "#define VF2_TEXTURE_FRAME_GATE_LATCH UINT32_C(0x0050006d)\n"
              "#define VF2_TEXTURE_DEFAULT_LIMITS_ENTRY UINT32_C(0x0004bfe0)\n"
              "#define VF2_TEXTURE_DEFAULT_LIMITS_RETURN UINT32_C(0x0004bd00)\n",
              "entry constants",
          )

          helpers = r'''static vf2_status execute_texture_orchestrator_save_call(
              vf2_model2a *machine,
              vf2_i960_cpu *cpu,
              vf2_hybrid_bridge_report *report
          )
          {
              const uint32_t stack_start = cpu->registers[1];
              uint32_t register_index = 0u;
              vf2_status status = VF2_OK;

              if (cpu->local_frame_depth == 0u) {
                  return VF2_ERROR_UNSUPPORTED;
              }
              for (register_index = 3u; register_index <= 30u;
                   ++register_index) {
                  status = vf2_model2a_write_u32(
                      machine,
                      stack_start + (register_index - 3u) * UINT32_C(4),
                      cpu->registers[register_index]
                  );
                  if (status != VF2_OK) {
                      return status;
                  }
              }

              cpu->registers[1] = stack_start + UINT32_C(112);
              status = vf2_i960_cpu_enter_procedure(
                  cpu,
                  VF2_TEXTURE_ORCHESTRATOR_BODY_ENTRY,
                  VF2_TEXTURE_ORCHESTRATOR_BODY_RETURN
              );
              if (status != VF2_OK) {
                  return status;
              }
              cpu->executed_instructions += UINT64_C(21);

              report->kind =
                  VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_SAVE_CALL;
              report->entry_address = VF2_TEXTURE_ORCHESTRATOR_SAVE_ENTRY;
              report->exit_address = cpu->ip;
              report->iterations = UINT64_C(28);
              report->bytes_written = 112u;
              report->recovered_instruction_count = UINT64_C(21);
              report->recovered_procedure_calls = UINT64_C(1);
              report->cpu_poststate_applied = 1;
              return VF2_OK;
          }

          static vf2_status execute_texture_frame_gate_call(
              vf2_model2a *machine,
              vf2_i960_cpu *cpu,
              vf2_hybrid_bridge_report *report
          )
          {
              uint8_t frame_state = 0u;
              const uint8_t latch_value = 0u;
              vf2_status status = VF2_OK;

              if (cpu->local_frame_depth == 0u) {
                  return VF2_ERROR_UNSUPPORTED;
              }
              status = vf2_model2a_read(
                  machine,
                  VF2_FRAME_STATE,
                  &frame_state,
                  sizeof(frame_state)
              );
              if (status != VF2_OK) {
                  return status;
              }
              if (frame_state != 0u) {
                  return VF2_ERROR_UNSUPPORTED;
              }

              cpu->registers[16] = 0u;
              status = vf2_model2a_write(
                  machine,
                  VF2_TEXTURE_FRAME_GATE_LATCH,
                  &latch_value,
                  sizeof(latch_value)
              );
              if (status != VF2_OK) {
                  return status;
              }
              status = vf2_i960_cpu_enter_procedure(
                  cpu,
                  VF2_TEXTURE_DEFAULT_LIMITS_ENTRY,
                  VF2_TEXTURE_DEFAULT_LIMITS_RETURN
              );
              if (status != VF2_OK) {
                  return status;
              }
              cpu->executed_instructions += UINT64_C(5);

              report->kind = VF2_HYBRID_BRIDGE_TEXTURE_FRAME_GATE_CALL;
              report->entry_address = VF2_TEXTURE_FRAME_GATE_ENTRY;
              report->exit_address = cpu->ip;
              report->iterations = UINT64_C(1);
              report->changed_values = UINT64_C(1);
              report->bytes_written = 1u;
              report->recovered_instruction_count = UINT64_C(5);
              report->recovered_procedure_calls = UINT64_C(1);
              report->cpu_poststate_applied = 1;
              return VF2_OK;
          }

          '''
          replace_once(
              "src/recovered/texture_bridge.c",
              "static vf2_status execute_texture_default_limits(\n",
              helpers + "static vf2_status execute_texture_default_limits(\n",
              "helper insertion",
          )
          replace_once(
              "src/recovered/texture_bridge.c",
              "    case VF2_TEXTURE_DEFAULT_LIMITS_ENTRY:\n"
              "        status = execute_texture_default_limits(\n",
              "    case VF2_TEXTURE_ORCHESTRATOR_SAVE_ENTRY:\n"
              "        status = execute_texture_orchestrator_save_call(\n"
              "            machine, cpu, &local_report\n"
              "        );\n"
              "        break;\n"
              "    case VF2_TEXTURE_FRAME_GATE_ENTRY:\n"
              "        status = execute_texture_frame_gate_call(\n"
              "            machine, cpu, &local_report\n"
              "        );\n"
              "        break;\n"
              "    case VF2_TEXTURE_DEFAULT_LIMITS_ENTRY:\n"
              "        status = execute_texture_default_limits(\n",
              "dispatcher cases",
          )
          replace_once(
              "src/recovered/texture_bridge.c",
              "    case VF2_HYBRID_BRIDGE_GAME_COLOR_LOOKUP:\n"
              "        return \"game-color-lookup\";\n"
              "    case VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS:\n",
              "    case VF2_HYBRID_BRIDGE_GAME_COLOR_LOOKUP:\n"
              "        return \"game-color-lookup\";\n"
              "    case VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_SAVE_CALL:\n"
              "        return \"texture-orchestrator-save-call\";\n"
              "    case VF2_HYBRID_BRIDGE_TEXTURE_FRAME_GATE_CALL:\n"
              "        return \"texture-frame-gate-call\";\n"
              "    case VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS:\n",
              "kind names",
          )

          replace_once(
              "tools/vf2i960/main.c",
              "                native_ip_before == UINT32_C(0x0004ce88) ||\n"
              "                native_ip_before == UINT32_C(0x0004bfe0) ||\n",
              "                native_ip_before == UINT32_C(0x0004ce88) ||\n"
              "                native_ip_before == UINT32_C(0x0004bb18) ||\n"
              "                native_ip_before == UINT32_C(0x0004bcd4) ||\n"
              "                native_ip_before == UINT32_C(0x0004bfe0) ||\n",
              "candidate addresses",
          )
          replace_once(
              "tools/vf2i960/main.c",
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS ||\n"
              "                        (bridge_validated_blocks % 128u) == 0u;\n",
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_SAVE_CALL ||\n"
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_FRAME_GATE_CALL ||\n"
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS ||\n"
              "                        (bridge_validated_blocks % 128u) == 0u;\n",
              "memory checkpoints",
          )
          replace_once(
              "tools/vf2i960/main.c",
              "             bridge_recovered_instructions != UINT64_C(1268774) ||\n"
              "             bridge_interpreted_instructions != UINT64_C(2048) ||\n"
              "             bridge_validated_blocks != 144u ||\n"
              "             bridge_memory_checkpoints != 144u ||\n"
              "             bridge_recovered_calls != UINT64_C(250) ||\n"
              "             bridge_recovered_returns != UINT64_C(298) ||\n",
              "             bridge_recovered_instructions != UINT64_C(1268800) ||\n"
              "             bridge_interpreted_instructions != UINT64_C(2022) ||\n"
              "             bridge_validated_blocks != 146u ||\n"
              "             bridge_memory_checkpoints != 146u ||\n"
              "             bridge_recovered_calls != UINT64_C(252) ||\n"
              "             bridge_recovered_returns != UINT64_C(298) ||\n",
              "strict totals",
          )
          replace_once(
              "tools/vf2i960/main.c",
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_GAME_COLOR_LOOKUP] != 8u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS] != 1u ||\n",
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_GAME_COLOR_LOOKUP] != 8u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_SAVE_CALL] != 1u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_FRAME_GATE_CALL] != 1u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS] != 1u ||\n",
              "strict block counts",
          )
          replace_once(
              "tools/vf2i960/main.c",
              "        printf(\"  texture default limits:           %zu\\n\",\n"
              "               bridge_block_counts[\n"
              "                   VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS\n"
              "               ]);\n",
              "        printf(\"  orchestrator save/calls:          %zu\\n\",\n"
              "               bridge_block_counts[\n"
              "                   VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_SAVE_CALL\n"
              "               ]);\n"
              "        printf(\"  frame gate/calls:                 %zu\\n\",\n"
              "               bridge_block_counts[\n"
              "                   VF2_HYBRID_BRIDGE_TEXTURE_FRAME_GATE_CALL\n"
              "               ]);\n"
              "        printf(\"  texture default limits:           %zu\\n\",\n"
              "               bridge_block_counts[\n"
              "                   VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS\n"
              "               ]);\n",
              "summary counts",
          )

          tests = Path("tests/analysis/test_orchestrator_limits.c")
          text = tests.read_text(encoding="utf-8")
          test_block = r'''static void test_orchestrator_prefix_bridges(void)
          {
              vf2_model2a machine;
              vf2_i960_cpu cpu;
              vf2_hybrid_bridge_report report = {0};
              const uint32_t stack_start = VF2_WORK_RAM_BASE + UINT32_C(0x2000);
              uint32_t expected[28];
              uint32_t value = 0u;
              uint32_t index = 0u;
              uint8_t frame_state = 0u;
              uint8_t latch = UINT8_C(0xff);

              CHECK(vf2_model2a_initialize(&machine) != 0);
              if (machine.work_ram == NULL) {
                  return;
              }

              vf2_i960_cpu_reset(&cpu, 0u, 0u, UINT32_C(0x00001000));
              cpu.registers[1] = VF2_WORK_RAM_BASE + UINT32_C(0x1000);
              CHECK(
                  vf2_i960_cpu_enter_procedure(
                      &cpu,
                      UINT32_C(0x0004bb18),
                      UINT32_C(0x00001004)
                  ) == VF2_OK
              );
              cpu.registers[1] = stack_start;
              for (index = 3u; index <= 30u; ++index) {
                  expected[index - 3u] = UINT32_C(0x31000000) + index;
                  cpu.registers[index] = expected[index - 3u];
              }

              CHECK(
                  vf2_hybrid_post_frame_bridge_execute(
                      &machine, &cpu, &report
                  ) == VF2_OK
              );
              CHECK(
                  report.kind ==
                  VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_SAVE_CALL
              );
              CHECK(report.entry_address == UINT32_C(0x0004bb18));
              CHECK(report.exit_address == UINT32_C(0x0004bcd4));
              CHECK(report.iterations == UINT64_C(28));
              CHECK(report.bytes_written == 112u);
              CHECK(report.recovered_instruction_count == UINT64_C(21));
              CHECK(report.recovered_procedure_calls == UINT64_C(1));
              CHECK(cpu.ip == UINT32_C(0x0004bcd4));
              CHECK(cpu.local_frame_depth == 2u);
              CHECK(cpu.maximum_local_frame_depth == 2u);
              CHECK(cpu.executed_instructions == UINT64_C(21));
              CHECK(cpu.procedure_calls == UINT64_C(2));
              for (index = 0u; index < 28u; ++index) {
                  CHECK(
                      vf2_model2a_read_u32(
                          &machine,
                          stack_start + index * UINT32_C(4),
                          &value
                      ) == VF2_OK
                  );
                  CHECK(value == expected[index]);
              }

              CHECK(
                  vf2_model2a_write(
                      &machine,
                      VF2_ORCHESTRATOR_DISPLAY_MODE - UINT32_C(0x2b),
                      &frame_state,
                      sizeof(frame_state)
                  ) == VF2_OK
              );
              CHECK(
                  vf2_model2a_write(
                      &machine,
                      UINT32_C(0x0050006d),
                      &latch,
                      sizeof(latch)
                  ) == VF2_OK
              );
              report = (vf2_hybrid_bridge_report){0};
              CHECK(
                  vf2_hybrid_post_frame_bridge_execute(
                      &machine, &cpu, &report
                  ) == VF2_OK
              );
              CHECK(
                  report.kind == VF2_HYBRID_BRIDGE_TEXTURE_FRAME_GATE_CALL
              );
              CHECK(report.entry_address == UINT32_C(0x0004bcd4));
              CHECK(report.exit_address == UINT32_C(0x0004bfe0));
              CHECK(report.bytes_written == 1u);
              CHECK(report.recovered_instruction_count == UINT64_C(5));
              CHECK(report.recovered_procedure_calls == UINT64_C(1));
              CHECK(cpu.ip == UINT32_C(0x0004bfe0));
              CHECK(cpu.local_frame_depth == 3u);
              CHECK(cpu.maximum_local_frame_depth == 3u);
              CHECK(cpu.executed_instructions == UINT64_C(26));
              CHECK(cpu.procedure_calls == UINT64_C(3));
              CHECK(cpu.registers[16] == 0u);
              CHECK(
                  vf2_model2a_read(
                      &machine,
                      UINT32_C(0x0050006d),
                      &latch,
                      sizeof(latch)
                  ) == VF2_OK
              );
              CHECK(latch == 0u);

              vf2_model2a_shutdown(&machine);
          }

          '''
          marker = "static void test_hybrid_bridge_poststate(void)\n"
          if text.count(marker) != 1:
              raise SystemExit("prefix test insertion marker not unique")
          text = text.replace(marker, test_block + marker, 1)
          old_calls = (
              "    test_default_branch_class();\n"
              "    test_machine_application();\n"
              "    test_hybrid_bridge_poststate();\n"
          )
          new_calls = (
              "    test_default_branch_class();\n"
              "    test_machine_application();\n"
              "    test_orchestrator_prefix_bridges();\n"
              "    test_hybrid_bridge_poststate();\n"
          )
          if text.count(old_calls) != 1:
              raise SystemExit("prefix test invocation marker not unique")
          tests.write_text(text.replace(old_calls, new_calls, 1), encoding="utf-8")

          functions = Path("decomp/i960/functions.csv")
          catalog = functions.read_text(encoding="utf-8")
          anchor = (
              "0x0004bfe0,0x0004c120,texture_default_limits_select,"
              "recovered-observed-branch,pending-rom-differential+unit,"
              "Default observed branch integrated into the hybrid bridge; "
              "ROM-backed validation pending\n"
          )
          additions = (
              "0x0004bb18,0x0004bcd4,texture_orchestrator_save_call,"
              "recovered-control-block,dynamic-trace+unit,"
              "Twenty register-save instructions plus the call into 0x0004bcd4\n"
              "0x0004bcd4,0x0004bfe0,texture_frame_gate_call,"
              "recovered-observed-branch,dynamic-trace+unit,"
              "Zero-frame-state path clears 0x0050006d and calls 0x0004bfe0\n"
          )
          if catalog.count(anchor) != 1:
              raise SystemExit("function catalog anchor not unique")
          functions.write_text(
              catalog.replace(anchor, additions + anchor, 1),
              encoding="utf-8",
          )

          note = Path("decomp/i960/notes/texture_default_limits_v0024.md")
          note_text = note.read_text(encoding="utf-8")
          note_text = note_text.replace(
              "The observed default branch at `0x0004bfe0` is now connected to the\n"
              "post-frame hybrid dispatcher. It replaces 22 interpreted i960\n"
              "instructions with C, performs the two observed work-RAM writes and\n"
              "models the architectural procedure return.\n",
              "Three consecutive observed blocks are now connected to the post-frame\n"
              "hybrid dispatcher: the `0x0004bb18` register-save/call prefix (21\n"
              "instructions), the `0x0004bcd4` zero-frame gate/call (5 instructions),\n"
              "and the `0x0004bfe0` default-limit helper (22 instructions). Together\n"
              "they replace 48 interpreted i960 instructions with C.\n",
          )
          note_text = note_text.replace(
              "The strict ROM-backed expected totals are updated to 1,268,774 recovered\n"
              "instructions and 2,048 interpreted instructions across 144 recovered\n"
              "blocks/checkpoints.",
              "The strict ROM-backed expected totals are updated to 1,268,800 recovered\n"
              "instructions and 2,022 interpreted instructions across 146 recovered\n"
              "blocks/checkpoints.",
          )
          note.write_text(note_text, encoding="utf-8")
          PY

      - name: Build and run ROM-independent tests
        shell: bash
        run: |
          cmake -S . -B build \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/vf2-roms-not-present
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure \
            -R '^(vf2_tests|vf2_orchestrator_limits)$'

      - name: Commit prefix recovery
        shell: bash
        run: |
          rm .github/workflows/recover-v0024-orchestrator-prefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "decomp(i960): recover orchestrator prefix blocks"
          git push origin master
