name: v0176 recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0176-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovery patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v0176.patch
          git apply --check /tmp/v0176.patch
          git apply /tmp/v0176.patch
      - name: Build and test
        shell: bash
        run: |
          cmake -S . -B build-v0176 -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build-v0176 --parallel
          ctest --test-dir build-v0176 --output-on-failure
          git diff --check
      - name: Commit recovery
        shell: bash
        run: |
          git config user.name 'celsowm'
          git config user.email 'celsowm@gmail.com'
          rm .github/workflows/v0176-recovery.yml
          git add -A
          git commit -m 'Close positive bit6 high-extension matrix' -m 'Recover the final 51 state-8 positive bit-6 high-extension masks across 4140/8140/10140 and correct the previously malformed 10140 composite constants.'
          git push origin HEAD:master
