name: v0196 recover texture diagnostic
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0196-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0196 recovery
        run: |
          echo '' | base64 -d > /tmp/v0196.patch
          git apply /tmp/v0196.patch
          echo '' | base64 -d > decomp/i960/notes/texture_number_diagnostic_v0196.md
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure -I 1,23
          git diff --check
      - name: Commit recovery
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm -f .github/workflows/v0196-recovery.yml .github/workflows/v0196-source-export.yml
          git add src/recovered/texture_bridge_texture.c decomp/i960/notes/texture_number_diagnostic_v0196.md
          git commit -m 'Recover texture number diagnostic path'
          git push origin HEAD:master
