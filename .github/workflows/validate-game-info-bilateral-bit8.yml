name: Apply game-info bilateral bit8
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recovery
        run: python .github/scripts/validate_game_info_bilateral_bit8.py
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit recovered corridor and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/validate_game_info_bilateral_bit8.py
          git rm .github/workflows/validate-game-info-bilateral-bit8.yml
          git add src/recovered/hybrid.c
          git commit -m "Recover fa_game_info bilateral state8 corridor"
          git push
