name: Fix game-info mode threshold
on:
  push:
    paths:
      - .github/workflows/fix-game-info-mode-threshold.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Model 0x189d0 threshold structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          s = s.replace(
              '    bool countdown_path = false;\n    bool mode_bit6 = false;\n',
              '    bool countdown_path = false;\n    bool mode_bit6 = false;\n    bool shared_bit1_path = false;\n',
              1
          )
          old = '''        r3 = r13 | r14;\n        if ((r3 & (UINT32_C(1) << 1u)) != 0u) {\n            r10 |= UINT32_C(4);\n            body_instructions = 96u;\n        }\n'''
          new = '''        r3 = r13 | r14;\n        shared_bit1_path = (r3 & (UINT32_C(1) << 1u)) != 0u;\n        if (shared_bit1_path) {\n            r10 |= UINT32_C(4);\n            body_instructions = 96u;\n        }\n'''
          if old not in s:
              raise SystemExit('shared bit1 anchor missing')
          s = s.replace(old, new, 1)
          old2 = '''    if (status == VF2_OK) {\n        status = vf2_model2a_read_u32(\n            machine, UINT32_C(0x0001b7ec), &r3\n        );\n    }\n    if (status == VF2_OK) {\n        status = vf2_model2a_read_u32(\n            machine, UINT32_C(0x0050016c), &r15\n        );\n    }\n    if (status == VF2_OK) {\n        status = hybrid_read_u8(\n            machine, r15 + UINT32_C(0x00003351), &byte_value\n        );\n        if (status == VF2_OK && byte_value != 0u) {\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n    }\n    if (status == VF2_OK) {\n        status = vf2_model2a_read_u32(\n            machine, fighter0 + UINT32_C(0x000005f4), &r13\n        );\n        if (status == VF2_OK && (int32_t)r13 >= (int32_t)r3) {\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n    }\n'''
          new2 = '''    if (status == VF2_OK && !shared_bit1_path) {\n        /* 0x189d0 BBS 1 skips this entire threshold block.  Otherwise\n         * 0x189ec BBC 6 selects the normal 0x1b7ec threshold; bit 6 set\n         * loads the alternate 0x1b7f0 threshold before rejoining. */\n        status = vf2_model2a_read_u32(\n            machine,\n            mode_bit6 ? UINT32_C(0x0001b7f0) : UINT32_C(0x0001b7ec),\n            &r3\n        );\n        if (status == VF2_OK) {\n            status = vf2_model2a_read_u32(\n                machine, fighter0 + UINT32_C(0x000005f4), &r13\n            );\n        }\n        if (status == VF2_OK && (int32_t)r13 >= (int32_t)r3) {\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n    }\n'''
          if old2 not in s:
              raise SystemExit('threshold block anchor missing')
          p.write_text(s.replace(old2, new2, 1))
          PY
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: |
          exe=$(find build -type f -name vf2i960 | head -n1)
          test -n "$exe"
          cp "$exe" vf2i960
          chmod +x vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-mode-threshold
          path: vf2i960
          if-no-files-found: error
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c
          git rm -f .github/workflows/fix-game-info-mode-threshold.yml
          git commit -m 'Fix fa_game_info mode threshold tail'
          git push
