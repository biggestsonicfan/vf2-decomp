name: Fix selector17 index3 display2 auxiliary tile writes
on:
  push:
    branches: [master]
    paths:
      - scripts/fix_phase17_index3_display2_aux.py
      - .github/workflows/fix-phase17-index3-display2-aux.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_phase17_index3_display2_aux.py
      - run: rm .github/workflows/fix-phase17-index3-display2-aux.yml scripts/fix_phase17_index3_display2_aux.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match selector17 index3 display test 2 tile writes"
          git push
