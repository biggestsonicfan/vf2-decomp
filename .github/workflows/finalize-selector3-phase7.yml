name: Finalize selector3 phase7
on:
  push:
    branches: [master]
    paths: [.github/workflows/finalize-selector3-phase7.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move post-profile handoff store
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c'); s=p.read_text()
          a=s.index('static vf2_status execute_selector3_phase7_post_profile(')
          b=s.index('static vf2_status execute_selector3_phase7(',a)
          x=s[a:b]
          old='''    vf2_status status = VF2_OK;\n\n    for (index = 0u;'''
          new='''    vf2_status status = vf2_model2a_write_u32(\n        machine, UINT32_C(0x0050a160), UINT32_C(0x3727c5ac)\n    );\n\n    for (index = 0u;'''
          assert old in x
          x=x.replace(old,new,1)
          p.write_text(s[:a]+x+s[b:])
          PY
      - name: Test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        run: |
          rm .github/workflows/finalize-selector3-phase7.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c .github/workflows
          git commit -m 'Fix selector3 phase7 post-profile ordering'
          git push origin HEAD:master
