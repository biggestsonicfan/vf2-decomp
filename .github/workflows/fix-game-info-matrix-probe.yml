name: Fix game-info matrix probe
on: [push]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix encoded probe patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          path = Path('.github/workflows/probe-game-info-mode-bit6-bit8-matrix.yml')
          text = path.read_text()
          match = re.search(r"b64decode\('([^']+)'\)", text)
          if match is None:
              raise SystemExit('encoded probe payload not found')
          payload = base64.b64decode(match.group(1)).decode()
          if '~f(' not in payload:
              raise SystemExit('expected probe typo not found')
          payload = payload.replace('~f(', '~(', 1)
          encoded = base64.b64encode(payload.encode()).decode()
          text = text[:match.start(1)] + encoded + text[match.end(1):]
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/probe-game-info-mode-bit6-bit8-matrix.yml
          git rm .github/workflows/fix-game-info-matrix-probe.yml
          git commit -m 'ci: fix mode bit6 bit8 matrix probe'
          git push
