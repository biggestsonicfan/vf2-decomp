name: Export v0136 base

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/export-v0136-base.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: tar --exclude=.git --exclude=.github/workflows/export-v0136-base.yml -czf /tmp/vf2-v0136-base.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: vf2-v0136-base
          path: /tmp/vf2-v0136-base.tar.gz
          if-no-files-found: error
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/export-v0136-base.yml
          git commit -m "Remove temporary v0136 source export workflow"
          git push origin HEAD:master
