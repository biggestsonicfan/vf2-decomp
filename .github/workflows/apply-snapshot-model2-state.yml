name: Apply Model 2 snapshot state hardening

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_snapshot_model2_state.py
      - run: rm .github/workflows/apply-snapshot-model2-state.yml scripts/apply_snapshot_model2_state.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Model 2 FIFO state in snapshots"
          git push
