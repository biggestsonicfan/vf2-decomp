name: v0141 coprocessor self-test

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0141-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact v0141 patch
        run: |
          cat .github/v0141-part0 .github/v0141-part1 .github/v0141-part2 .github/v0141-part3 > /tmp/v0141.patch
          git apply /tmp/v0141.patch
          git diff --check
      - name: Add ROM-backed note
        run: |
          cat > decomp/i960/notes/post_boot_copro_self_test_v0141.md <<'EOF'
          # Post-boot coprocessor self-test recovery (v0141)

          The warm initialization corridor now recovers the complete `0x0000a178` coprocessor/self-test block through its return at `0x00009f74`.

          The implementation composes the existing recovered inline-text thunk at `0x00009444`, the two ROM-observed calls to helper `0x0000a3d4`, the two work buffers at `0x0050e000` and `0x0050e800`, their comparison, and the final diagnostic text sequence. The `0x0000a3d4` helper reproduces its command writes and reads through the Model 2A coprocessor port at `(g11)[g12]`, including the byte cursor at `0x005001e4` and buffer output at `0x0090e000`.

          ROM-backed validation against the supplied supported VF2 Version 2.1 image measures `0x0000a178 -> 0x00009f74` at exactly 13,324 instructions, 10 procedure calls, and 11 procedure returns. The recovered snapshot matches the ROM reference byte for byte, including CPU/local-frame state, Work RAM, buffer RAM, tile RAM, and coprocessor-port backing.

          The successful path remains fail-closed if the two generated result buffers differ or if the expected warm call depth / coprocessor port address is not present.

          No ROM bytes or snapshots are committed.
          EOF
      - name: Configure GCC
        run: cmake -S . -B build-gcc -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build GCC
        run: cmake --build build-gcc --parallel
      - name: Test GCC
        run: ctest --test-dir build-gcc --output-on-failure
      - name: Configure Clang
        env: { CC: clang }
        run: cmake -S . -B build-clang -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build Clang
        run: cmake --build build-clang --parallel
      - name: Test Clang
        run: ctest --test-dir build-clang --output-on-failure
      - name: Configure sanitizers
        env: { CC: clang }
        run: cmake -S . -B build-san -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-san --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-san --output-on-failure
      - name: Commit v0141
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0141-integrate.yml
          git rm .github/v0141-part0 .github/v0141-part1 .github/v0141-part2 .github/v0141-part3
          git add include/vf2/native_runtime.h src/recovered/native_runtime.c decomp/i960/notes/post_boot_copro_self_test_v0141.md
          git commit -m "Recover post-boot coprocessor self-test"
          git push origin HEAD:master
