name: Integrate v0.0.24 frame tail functions via PR trigger

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply verified frame-tail recovery
        run: |
          cat tools/frame_tail_v0024.part?? > /tmp/frame-tail-v0024.b64
          test "$(sha256sum /tmp/frame-tail-v0024.b64 | cut -d' ' -f1)" = "f9a21a40d9e8838a94972ecf8ad361689ab35b453031a5ec48dc8a8b8629d7e6"
          base64 -d /tmp/frame-tail-v0024.b64 > /tmp/frame-tail-v0024.patch.gz
          gzip -t /tmp/frame-tail-v0024.patch.gz
          gzip -dc /tmp/frame-tail-v0024.patch.gz > /tmp/frame-tail-v0024.patch
          git apply --check /tmp/frame-tail-v0024.patch
          git apply /tmp/frame-tail-v0024.patch
          rm -f tools/frame_tail_v0024.patch.gz.b64 tools/frame_tail_v0024.part??
          rm .github/workflows/integrate-frame-tail.yml
          rm .github/workflows/integrate-frame-tail-pr.yml

      - name: Configure warning-as-error build
        run: >-
          cmake -S . -B build
          -DVF2_BUILD_TESTS=ON
          -DVF2_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run ROM-independent tests
        run: >-
          ctest --test-dir build --output-on-failure
          -R '^(vf2_tests|vf2_orchestrator_.*)$'

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "decomp(i960): recover frame tail functions"
          git push origin master
