name: v0163 source export

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0163-source-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: |
          tar --exclude=.git --exclude=build -czf /tmp/vf2-current.tar.gz .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: vf2-current-source
          path: /tmp/vf2-current.tar.gz
          if-no-files-found: error
          retention-days: 1
