name: Fix selector3 phase12 spill
on:
  push:
    branches: [master]
    paths: [.github/workflows/fix-selector3-phase12-spill.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore observed saved-g9 spill
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()
          a=s.index('entry_phase == UINT8_C(12)')
          b=s.index('phase8_handoff',a)
          x=s[a:b]
          needle='''            if (status != VF2_OK) return status;\n\n            cpu->registers[VF2_I960_G0_REGISTER] = UINT32_MAX;'''
          repl='''            if (status == VF2_OK) {\n                status = vf2_model2a_write_u32(\n                    machine, cpu->registers[1] + UINT32_C(0x000000c0),\n                    destination\n                );\n            }\n            if (status != VF2_OK) return status;\n\n            cpu->registers[VF2_I960_G0_REGISTER] = UINT32_MAX;'''
          assert needle in x
          x=x.replace(needle,repl,1)
          p.write_text(s[:a]+x+s[b:])
          PY
      - name: Test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-selector3-phase12-spill.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c .github/workflows
          git commit -m 'Match selector3 phase12 saved g9 spill'
          git push origin HEAD:master
