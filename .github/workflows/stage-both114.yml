name: Stage bilateral 0x114 candidate
on:
  push:
    branches: [master]
    paths: [.github/workflows/stage-both114.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact 0x114/0x114 candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c')
          s=p.read_text()
          old='''        const bool bilateral_both_bit1_bit4 =\n            r7 == state8_bit1_bit4 && r8 == state8_bit1_bit4;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4 &&\n            !bilateral_both_bit1_bit4) {\n'''
          new='''        const bool bilateral_both_bit1_bit4 =\n            r7 == state8_bit1_bit4 && r8 == state8_bit1_bit4;\n        const uint32_t state8_bit2_bit4 =\n            state8 | (UINT32_C(1) << 2u) | (UINT32_C(1) << 4u);\n        const bool bilateral_both_bit2_bit4 =\n            r7 == state8_bit2_bit4 && r8 == state8_bit2_bit4;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4 &&\n            !bilateral_both_bit1_bit4 && !bilateral_both_bit2_bit4) {\n'''
          if old not in s: raise SystemExit('initial 0x114 guard anchor missing')
          s=s.replace(old,new,1)
          old2='''            const bool both_bit1_bit4 =\n                r7 == state8_bit1_bit4 && r8 == state8_bit1_bit4;\n            if (!both_bit4 && !cross_bit1_bit4 && !both_bit1_bit4) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n'''
          new2='''            const bool both_bit1_bit4 =\n                r7 == state8_bit1_bit4 && r8 == state8_bit1_bit4;\n            const uint32_t state8_bit2_bit4 =\n                (UINT32_C(1) << 8u) | (UINT32_C(1) << 2u) |\n                (UINT32_C(1) << 4u);\n            const bool both_bit2_bit4 =\n                r7 == state8_bit2_bit4 && r8 == state8_bit2_bit4;\n            if (!both_bit4 && !cross_bit1_bit4 && !both_bit1_bit4 &&\n                !both_bit2_bit4) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n'''
          if old2 not in s: raise SystemExit('threshold 0x114 anchor missing')
          s=s.replace(old2,new2,1)
          old3='''    if (status == VF2_OK && !shared_bit1_path) {\n'''
          new3='''    if (status == VF2_OK) {\n        const uint32_t state8_bit2_bit4 =\n            (UINT32_C(1) << 8u) | (UINT32_C(1) << 2u) |\n            (UINT32_C(1) << 4u);\n        if (r7 == state8_bit2_bit4 && r8 == state8_bit2_bit4) {\n            if (return_address == UINT32_C(0x000164b0)) {\n                body_instructions = countdown_path\n                    ? body_instructions + UINT32_C(8)\n                    : body_instructions - UINT32_C(6);\n            } else if (return_address == UINT32_C(0x000164c4)) {\n                if (countdown_path) {\n                    body_instructions += UINT32_C(7);\n                } else {\n                    body_instructions -= mode_bit6\n                        ? UINT32_C(9) : UINT32_C(10);\n                }\n            }\n        }\n    }\n    if (status == VF2_OK && !shared_bit1_path) {\n'''
          if old3 not in s: raise SystemExit('0x114 accounting anchor missing')
          p.write_text(s.replace(old3,new3,1))
          PY
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish candidate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C probe-both114-accounting
          git add src/recovered/hybrid.c
          git commit -m "candidate: account bilateral state8 bit2 bit4 state"
          git push --force origin probe-both114-accounting
