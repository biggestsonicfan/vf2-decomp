name: Close selector3 phase5 observed path
on:
  push:
    branches: [master]
    paths: [.github/workflows/close-selector3-phase5.yml]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch phase5
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c'); s=p.read_text()
          a=s.index('static vf2_status execute_selector3_phase5(')
          helper=r'''static vf2_status execute_selector3_phase5_timeline_observed(
              vf2_model2a *machine, int *recovered
          )
          {
              static const uint32_t slots[4] = {
                  UINT32_C(0x005001c8), UINT32_C(0x005001d0),
                  UINT32_C(0x005001cc), UINT32_C(0x005001d4)
              };
              static const uint32_t trigger_offsets[4] = {
                  UINT32_C(10), UINT32_C(4), UINT32_C(10), UINT32_C(4)
              };
              uint32_t total = 0u, timer = 0u, elapsed = 0u;
              uint32_t pointers[4] = {0u,0u,0u,0u};
              uint32_t event_pointer = 0u, fighter0 = 0u, fighter1 = 0u;
              uint32_t value = 0u, flags = 0u;
              uint16_t trigger = 0u;
              uint8_t control = 0u;
              uint32_t i = 0u;
              vf2_status status = VF2_OK;

              if (recovered == NULL) return VF2_ERROR_INVALID_ARGUMENT;
              *recovered = 0;
              status = vf2_model2a_read_u32(machine, UINT32_C(0x0201f388), &total);
              if (status == VF2_OK) status = vf2_model2a_read_u32(machine, UINT32_C(0x00500024), &timer);
              elapsed = total - timer;
              for (i = 0u; status == VF2_OK && i < UINT32_C(4); ++i) {
                  status = vf2_model2a_read_u32(machine, slots[i], &pointers[i]);
                  if (status == VF2_OK) status = read_u16(machine, pointers[i] + trigger_offsets[i], &trigger);
                  if (status == VF2_OK && i == UINT32_C(1) && (uint32_t)trigger != elapsed) return VF2_OK;
                  if (status == VF2_OK && i != UINT32_C(1) && (uint32_t)trigger == elapsed) return VF2_OK;
              }
              if (status == VF2_OK) status = vf2_model2a_read_u32(machine, UINT32_C(0x005001e0), &event_pointer);
              if (status == VF2_OK) status = read_u16(machine, event_pointer, &trigger);
              if (status == VF2_OK && (uint32_t)trigger == elapsed) return VF2_OK;
              if (status != VF2_OK) return status;

              status = vf2_model2a_read_u32(machine, UINT32_C(0x00500804), &fighter0);
              if (status == VF2_OK) status = vf2_model2a_read_u32(machine, pointers[1], &value);
              if (status == VF2_OK && value != 0u) status = vf2_model2a_write_u32(machine, fighter0 + UINT32_C(0x194), value);
              if (status == VF2_OK && value != 0u) status = vf2_model2a_read(machine, pointers[1] + UINT32_C(6), &control, sizeof(control));
              if (status == VF2_OK && value != 0u) status = vf2_model2a_read_u32(machine, fighter0, &flags);
              if (status == VF2_OK && value != 0u) {
                  flags |= UINT32_C(1) << 26u;
                  if (control != 0u) flags &= ~(UINT32_C(1) << 26u);
                  status = vf2_model2a_write_u32(machine, fighter0, flags);
              }
              if (status == VF2_OK) status = vf2_model2a_write_u32(machine, UINT32_C(0x005001d0), pointers[1] + UINT32_C(8));
              if (status == VF2_OK) status = vf2_model2a_read_u32(machine, UINT32_C(0x00500808), &fighter1);
              if (status == VF2_OK) status = vf2_model2a_read_u32(machine, fighter0 + UINT32_C(0x18), &value);
              if (status == VF2_OK && value == UINT32_C(0x447a0000)) {
                  status = vf2_model2a_read_u32(machine, fighter1, &flags);
                  if (status == VF2_OK) status = vf2_model2a_write_u32(machine, fighter1, flags | (UINT32_C(1) << 23u));
              }
              if (status == VF2_OK) status = vf2_model2a_read_u32(machine, fighter1 + UINT32_C(0x18), &value);
              if (status == VF2_OK && value == UINT32_C(0x447a0000)) {
                  status = vf2_model2a_read_u32(machine, fighter0, &flags);
                  if (status == VF2_OK) status = vf2_model2a_write_u32(machine, fighter0, flags | (UINT32_C(1) << 23u));
              }
              if (status == VF2_OK) *recovered = 1;
              return status;
          }

          '''
          helper='\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())
          s=s[:a]+helper+s[a:]
          a=s.index('static vf2_status execute_selector3_phase5('); b=s.index('static vf2_status execute_selector3_phase6(',a); x=s[a:b]
          x=x.replace('''    uint8_t zero = 0u;\n    vf2_status status = VF2_OK;''','''    uint8_t zero = 0u;\n    int timeline_recovered = 0;\n    vf2_status status = VF2_OK;''',1)
          x=x.replace('''    *next_phase = previous_phase;\n    status = vf2_model2a_read_u32(''','''    *next_phase = previous_phase;\n    status = execute_selector3_phase5_timeline_observed(machine, &timeline_recovered);\n    if (status == VF2_OK) status = vf2_model2a_read_u32(''',1)
          s=s[:a]+x+s[b:]
          # expose whether the exact observed 548cc branch ran through next_phase metadata: phase stays 5;
          # dispatcher independently reprobes the advanced d0 pointer and timer relation.
          a=s.index('        if (status == VF2_OK && phase8_handoff) {')
          block='''        if (status == VF2_OK && entry_phase == UINT8_C(5)) {\n            uint32_t total = 0u, timer = 0u, p = 0u;\n            uint32_t player0 = 0u;\n            status = vf2_model2a_read_u32(machine, UINT32_C(0x0201f388), &total);\n            if (status == VF2_OK) status = vf2_model2a_read_u32(machine, UINT32_C(0x00500024), &timer);\n            if (status == VF2_OK) status = vf2_model2a_read_u32(machine, UINT32_C(0x005001d0), &p);\n            if (status != VF2_OK) return status;\n            if (total - timer == UINT32_C(2) && p == UINT32_C(0x0201f5cc)) {\n                status = vf2_model2a_read_u32(machine, UINT32_C(0x00500804), &player0);\n                if (status != VF2_OK) return status;\n                cpu->registers[VF2_I960_G0_REGISTER] = UINT32_MAX;\n                cpu->registers[VF2_I960_G0_REGISTER + 7u] = player0;\n                set_signed_condition(cpu, INT32_C(0), INT32_C(-1));\n                account_nested_procedure(cpu, UINT64_C(5), UINT64_C(5));\n                status = finish_recovered_procedure(machine, cpu, UINT64_C(81));\n                if (status != VF2_OK) return status;\n                report->kind = VF2_HYBRID_BRIDGE_FRAME_DISPATCH_TICK;\n                report->entry_address = VF2_FRAME_DISPATCH_TICK_ENTRY;\n                report->exit_address = cpu->ip;\n                report->iterations = UINT64_C(1);\n                report->recovered_instruction_count = UINT64_C(81);\n                report->recovered_procedure_calls = UINT64_C(5);\n                report->recovered_procedure_returns = UINT64_C(6);\n                report->cpu_poststate_applied = 1;\n                return VF2_OK;\n            }\n        }\n'''
          s=s[:a]+block+s[a:]
          p.write_text(s)
          PY
      - name: Configure build test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        run: rm -f .github/workflows/close-selector3-phase5.yml .github/workflows/dump-selector3-phase5.yml && git config user.name celsowm && git config user.email celsowm@gmail.com && git add src/recovered/texture_bridge_match.c .github/workflows && git commit -m 'Close selector3 phase5 observed path' && git push origin HEAD:master
