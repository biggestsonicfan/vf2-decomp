name: v0135 native runtime routing

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0135-runtime-wrapper-routing.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route run-until through public runtime wrappers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('CMakeLists.txt')
          s = p.read_text()
          block = '''set_source_files_properties(\n    src/recovered/native_runtime.c\n    PROPERTIES COMPILE_DEFINITIONS "vf2_native_runtime_step=vf2_native_runtime_step_impl"\n)\n\n'''
          assert s.count(block) == 1
          p.write_text(s.replace(block, '', 1))

          p = Path('src/recovered/native_runtime.c')
          s = p.read_text()
          old = '''vf2_status vf2_native_runtime_step(vf2_model2a *machine, vf2_i960_cpu *cpu,\n                                   vf2_native_runtime_state *state,\n                                   vf2_native_runtime_step_report *report) {'''
          new = '''vf2_status vf2_native_runtime_step_impl(vf2_model2a *machine, vf2_i960_cpu *cpu,\n                                        vf2_native_runtime_state *state,\n                                        vf2_native_runtime_step_report *report) {'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))

          note = Path('decomp/i960/notes/native_runtime_wrapper_routing_v0135.md')
          note.write_text('''# Native runtime wrapper routing (v0135)\n\nA fresh ROM-backed cold-boot checkpoint was reconstructed at the natural frame-dispatch entry `0x0000a6c0` without the historical active-input mutation used by the selector-17 diagnostic corridor. The natural checkpoint enters frame selector 0.\n\nBefore this fix, `vf2i960 native-resume` advanced the selector-0 frame with the legacy `execute_frame_dispatch_tick` shortcut: 392 recovered instructions, one call and two returns. The resulting snapshot diverged from the reference by 3,505 bytes, including the selector mask, countdown and diagnostic text RAM.\n\nThe reason was structural. `src/recovered/native_runtime.c` was compiled with a source-wide preprocessor rename `vf2_native_runtime_step=vf2_native_runtime_step_impl`. That correctly renamed the base step definition, but it also renamed the calls inside `vf2_native_runtime_run_until`, causing multi-block execution to bypass the public wrapper chain in `native_runtime_condition.c` / `native_runtime_condition_impl.c`. The already recovered exact selector-0 implementation was therefore unreachable from ordinary `run_until` execution.\n\nThis change removes the source-wide rename and explicitly names only the base definition `vf2_native_runtime_step_impl`. Calls made by `vf2_native_runtime_run_until` now resolve to the public wrapped API.\n\nWith the fix applied locally against the supplied supported ROM, the same natural selector-0 frame executes 15,853 recovered instructions with 12 calls and 13 returns and matches the reference snapshot exactly at `0x0000a010`. No ROM data or snapshots are committed.\n''')
          PY
      - name: Configure GCC
        run: cmake -S . -B build-gcc -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build GCC
        run: cmake --build build-gcc --parallel
      - name: Test GCC
        run: ctest --test-dir build-gcc --output-on-failure
      - name: Configure Clang
        env: { CC: clang }
        run: cmake -S . -B build-clang -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build Clang
        run: cmake --build build-clang --parallel
      - name: Test Clang
        run: ctest --test-dir build-clang --output-on-failure
      - name: Configure sanitizers
        env: { CC: clang }
        run: cmake -S . -B build-san -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-san --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-san --output-on-failure
      - name: Commit v0135
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0135-runtime-wrapper-routing.yml
          git add CMakeLists.txt src/recovered/native_runtime.c decomp/i960/notes/native_runtime_wrapper_routing_v0135.md
          git commit -m "Route native run-until through runtime wrappers"
          git push origin HEAD:master
