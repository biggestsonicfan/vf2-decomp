name: Apply selector17 index5 manual navigation
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_phase17_index5_manual_navigation.py
      - run: rm .github/workflows/apply-phase17-index5-manual-navigation.yml scripts/apply_phase17_index5_manual_navigation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover selector17 index5 manual navigation"
          git push
