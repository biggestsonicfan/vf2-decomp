name: v0157 integrate

on:
  push:
    branches: [master]
    paths:
      - '.github/v0157.patch'
      - '.github/workflows/v0157-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recovery patch
        run: |
          git apply --index .github/v0157.patch
          git diff --cached --check

      - name: Configure
        run: cmake -S . -B build -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/v0157.patch .github/workflows/v0157-integrate.yml
          git add -A
          git commit -m 'Recover bilateral negative state8 zero-flag condition'
          git push origin HEAD:master
