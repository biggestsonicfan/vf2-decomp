name: Fix selector17 index3 RGB scratch and LUT layout
on:
  push:
    branches: [master]
    paths:
      - scripts/fix_phase17_index3_rgb_layout.py
      - .github/workflows/fix-phase17-index3-rgb-layout.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_phase17_index3_rgb_layout.py
      - run: rm .github/workflows/fix-phase17-index3-rgb-layout.yml scripts/fix_phase17_index3_rgb_layout.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match selector17 index3 RGB LUT layout"
          git push
