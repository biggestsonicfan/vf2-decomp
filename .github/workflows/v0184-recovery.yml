name: v0184 recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0184-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0184 recovery
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v0184.patch
          git apply /tmp/v0184.patch
          echo '' | base64 -d > decomp/i960/notes/game_info_1645c_state4_bit6_bit14_bit16_high_v0184.md
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Commit recovery
        shell: bash
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_state4_bit6_bit14_bit16_high_v0184.md
          git commit -m 'Recover state-4 bit6 bit14/bit16 high extensions'
          git rm .github/workflows/v0184-recovery.yml
          git commit -m 'Remove v0184 recovery workflow'
          git push origin master
