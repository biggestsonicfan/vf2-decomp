name: Stage game-info 0x104-0x114
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact semantic edits
        run: python3 decomp/i960/tools/apply_exact_edits.py decomp/i960/patches/game_info_18644_104_114_semantic_edits.json
      - name: Apply measured accounting edits
        run: python3 decomp/i960/tools/apply_exact_edits.py decomp/i960/patches/game_info_18644_104_114_accounting_edits.json
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C probe-game-info-104-114-accounted
          git add src/recovered/hybrid.c
          git commit -m "candidate: recover exact 0x104-0x114 corridor"
          git push --force origin probe-game-info-104-114-accounted
