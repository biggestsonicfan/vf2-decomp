name: v0151 mixed state4 bit14 integration

on:
  push:
    branches: [master]
    paths:
      - '.github/v0151.patch'
      - '.github/workflows/v0151-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0151 recovery
        run: git apply .github/v0151.patch
      - name: Configure
        run: cmake -S . -B build -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          rm -f .github/v0151.patch .github/workflows/v0151-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover mixed negative state4 bit14 path'
          git push origin HEAD:master
