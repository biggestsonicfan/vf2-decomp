name: v0142 warm selector scheduler

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0142-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0142 patch
        run: |
          git apply .github/v0142.patch
          git diff --check
      - name: Add ROM-backed note
        run: |
          cat > decomp/i960/notes/warm_selector3_scheduler_v0142.md <<'EOF'
          # Warm selector transition and scheduler recovery (v0142)

          This recovery continues the ROM-backed warm boot from the completed coprocessor self-test into the normal selector/scheduler flow. No ROM bytes or snapshots are committed.

          Recovered exact boundaries:

          - `0x00009f74 -> 0x00009fb0`: post-boot delay, 2,100,198 instructions. The ROM executes a 700,000-iteration delay loop rather than a 700,000-instruction shortcut.
          - `0x00009fb0 -> 0x00009ff8`: main-loop entry, 10 instructions.
          - warm selector 0 signature path `0x0000a6c0 -> 0x0000a010`: 34 instructions, 2 calls, 3 returns. The ROM-observed signature path changes selector 0 to selector 2 without forcing the selector externally.
          - aggregate `0x00009ff8 -> 0x0000a010`: 266 instructions, 8 calls, 8 returns, exact snapshot match.
          - cold scheduler reused at warm depth: first runnable `fa_game_info` boundary is 1,467 instructions, 32 calls, 30 returns; complete `0x0000a010 -> 0x0000a014` is 6,090 instructions, 78 calls, 78 returns, exact snapshot match.
          - selector 2 full frame `0x0000a014 -> next 0x0000a010`: 1,270,802 instructions, 343 calls, 343 returns, exact snapshot match. The natural selector advances 2 -> 3 and runtime flags become `0x00008a00`.
          - hot initializer scheduler `0x0000a010 -> fa_game_info`: 254 instructions, 5 calls, 3 returns, exact snapshot match.
          - `fa_object` (`0x0006ca64`): generic object0/object1/object2 task, 4 instructions, 0 calls, 1 return. The instance byte selects the ROM table entry at `0x0006ca78`.
          - `fa_game_disp` (`0x0002b1bc`): interpreted fail-closed task, 92 instructions, 5 calls, 6 returns, exact snapshot match.
          - selector 3 scheduler `0x0000a010 -> 0x0000a014`: 959 instructions, 25 calls, 25 returns, exact snapshot match.

          The warm scheduler stack is three frames deeper than the historical synthetic/cold corridor. The implementation preserves both measured depths and writes scheduler/text stale frames at the correct warm frame indices instead of overwriting caller frames. Synthetic `r13` depth bookkeeping is now restricted to its original depth-zero instrumentation path so it cannot corrupt the real warm register state.
          EOF
      - name: Configure GCC
        run: cmake -S . -B build-gcc -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build GCC
        run: cmake --build build-gcc --parallel
      - name: Test GCC
        run: ctest --test-dir build-gcc --output-on-failure
      - name: Configure Clang
        env: { CC: clang }
        run: cmake -S . -B build-clang -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build Clang
        run: cmake --build build-clang --parallel
      - name: Test Clang
        run: ctest --test-dir build-clang --output-on-failure
      - name: Configure sanitizers
        env: { CC: clang }
        run: cmake -S . -B build-san -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-san --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-san --output-on-failure
      - name: Commit v0142
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/export-v0142-base.yml
          git rm .github/workflows/v0142-integrate.yml
          git rm .github/v0142.patch
          git add include/vf2/hybrid.h include/vf2/native_runtime.h src/recovered/hybrid.c src/recovered/native_runtime.c src/recovered/native_runtime_condition.c src/recovered/native_runtime_condition_impl.c src/recovered/scheduler.c decomp/i960/notes/warm_selector3_scheduler_v0142.md
          git commit -m "Recover warm selector transition and tasks"
          git push origin HEAD:master
