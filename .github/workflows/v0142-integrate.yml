name: v0142 warm selector handoff

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0142-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0142 fix
        run: |
          perl -0pi -e 's/cpu->registers\[13\]=\(start_depth<<8u\)\|cpu->local_frame_depth;/if (start_depth == 0u) {\n        cpu->registers[13] = (start_depth << 8u) | cpu->local_frame_depth;\n    }/' src/recovered/texture_bridge_match.c
          grep -q 'if (start_depth == 0u)' src/recovered/texture_bridge_match.c
          git diff --check
      - name: Configure GCC
        run: cmake -S . -B build-gcc -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build GCC
        run: cmake --build build-gcc --parallel
      - name: Test GCC
        run: ctest --test-dir build-gcc --output-on-failure
      - name: Configure Clang
        env: { CC: clang }
        run: cmake -S . -B build-clang -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build Clang
        run: cmake --build build-clang --parallel
      - name: Test Clang
        run: ctest --test-dir build-clang --output-on-failure
      - name: Configure sanitizers
        env: { CC: clang }
        run: cmake -S . -B build-san -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-san --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-san --output-on-failure
      - name: Commit v0142
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > decomp/i960/notes/warm_selector_handoff_v0142.md <<'EOF'
          # Warm selector handoff fidelity (v0142)

          The warm post-boot final cluster reaches the frame dispatcher with a non-zero local-frame depth. The generic bridge used to overwrite `r13` with synthetic `(start_depth << 8) | final_depth` bookkeeping, producing `0x303` at the measured warm boundary while the ROM preserves the architectural value `0x003`.

          The condition-specific selector wrappers already limited this bookkeeping to synthetic depth-zero runs. This change applies the same rule to the shared bridge: depth-zero diagnostics keep the marker, while warm execution preserves the ROM register value.

          The warm selector-0 signature fast path has already been ROM-validated to advance selector 0 to selector 2 with 34 instructions, two procedure calls, and three returns. No ROM bytes or snapshots are committed.
          EOF
          git rm .github/v0142-r13.patch .github/workflows/v0142-integrate.yml .github/workflows/export-v0142-base.yml
          git add src/recovered/texture_bridge_match.c decomp/i960/notes/warm_selector_handoff_v0142.md
          git commit -m "Preserve warm selector handoff state"
          git push origin HEAD:master
