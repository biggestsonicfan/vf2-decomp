name: v0194 recover texture counter countdown
'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0194-recover-texture-counter-countdown.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover non-expiring counter paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/recovered/texture_bridge_texture.c')
          s = p.read_text()
          s = s.replace(
'''    uint32_t counter2 = 0u;\n    vf2_status status = VF2_OK;\n''',
'''    uint32_t counter2 = 0u;\n    uint64_t instructions = 0u;\n    uint64_t changed_values = 0u;\n    size_t bytes_written = 0u;\n    vf2_status status = VF2_OK;\n''', 1)
          s = s.replace(
'''    cpu->registers[4] = counter0 - UINT32_C(1);\n    if (counter0 != 0u) {\n        return VF2_ERROR_UNSUPPORTED;\n    }\n''',
'''    cpu->registers[4] = counter0 - UINT32_C(1);\n    instructions += UINT64_C(4);\n    if (counter0 == UINT32_C(1)) {\n        return VF2_ERROR_UNSUPPORTED;\n    }\n    if (counter0 > UINT32_C(1)) {\n        status = vf2_model2a_write_u32(\n            machine, VF2_TEXTURE_COUNTER0, cpu->registers[4]\n        );\n        if (status != VF2_OK) {\n            return status;\n        }\n        instructions += UINT64_C(2);\n        ++changed_values;\n        bytes_written += 4u;\n    }\n''', 1)
          s = s.replace(
'''    cpu->registers[4] = counter1 - UINT32_C(1);\n    if (counter1 != 0u) {\n        return VF2_ERROR_UNSUPPORTED;\n    }\n''',
'''    cpu->registers[4] = counter1 - UINT32_C(1);\n    instructions += UINT64_C(4);\n    if (counter1 == UINT32_C(1)) {\n        return VF2_ERROR_UNSUPPORTED;\n    }\n    if (counter1 > UINT32_C(1)) {\n        status = vf2_model2a_write_u32(\n            machine, VF2_TEXTURE_COUNTER1, cpu->registers[4]\n        );\n        if (status != VF2_OK) {\n            return status;\n        }\n        instructions += UINT64_C(2);\n        ++changed_values;\n        bytes_written += 4u;\n    }\n''', 1)
          s = s.replace(
'''    if (counter2 == 0u) {\n        cpu->registers[4] = UINT32_MAX;\n''',
'''    instructions += UINT64_C(4);\n    if (counter2 == 0u) {\n        cpu->registers[4] = UINT32_MAX;\n''', 1)
          s = s.replace(
'''        cpu->executed_instructions += UINT64_C(12);\n\n        report->kind = VF2_HYBRID_BRIDGE_TEXTURE_COUNTER_UPDATE;\n''',
'''        cpu->executed_instructions += instructions;\n\n        report->kind = VF2_HYBRID_BRIDGE_TEXTURE_COUNTER_UPDATE;\n''', 1)
          s = s.replace(
'''        report->iterations = UINT64_C(3);\n        report->recovered_instruction_count = UINT64_C(12);\n        report->cpu_poststate_applied = 1;\n''',
'''        report->iterations = UINT64_C(3);\n        report->changed_values = changed_values;\n        report->bytes_written = bytes_written;\n        report->recovered_instruction_count = instructions;\n        report->cpu_poststate_applied = 1;\n''', 1)
          s = s.replace(
'''        cpu->executed_instructions += UINT64_C(55);\n\n        report->kind = VF2_HYBRID_BRIDGE_TEXTURE_COUNTER_UPDATE;\n''',
'''        cpu->executed_instructions +=\n            UINT64_C(55) + (instructions - UINT64_C(12));\n\n        report->kind = VF2_HYBRID_BRIDGE_TEXTURE_COUNTER_UPDATE;\n''', 1)
          s = s.replace(
'''        report->iterations = UINT64_C(3);\n        report->changed_values = UINT64_C(12);\n        report->bytes_written = 38u;\n        report->recovered_instruction_count = UINT64_C(55);\n''',
'''        report->iterations = UINT64_C(3);\n        report->changed_values = UINT64_C(12) + changed_values;\n        report->bytes_written = 38u + bytes_written;\n        report->recovered_instruction_count =\n            UINT64_C(55) + (instructions - UINT64_C(12));\n''', 1)
          s = s.replace(
'''    status = vf2_model2a_write_u32(\n        machine, VF2_TEXTURE_COUNTER2, cpu->registers[4]\n    );\n''',
'''    status = vf2_model2a_write_u32(\n        machine, VF2_TEXTURE_COUNTER2, cpu->registers[4]\n    );\n    instructions += UINT64_C(2);\n''', 1)
          s = s.replace(
'''    cpu->ip = VF2_TEXTURE_COUNTER_UPDATE_EXIT;\n    cpu->executed_instructions += UINT64_C(14);\n''',
'''    cpu->ip = VF2_TEXTURE_COUNTER_UPDATE_EXIT;\n    cpu->executed_instructions += instructions;\n''', 1)
          s = s.replace(
'''    report->iterations = UINT64_C(3);\n    report->changed_values = UINT64_C(1);\n    report->bytes_written = 4u;\n    report->recovered_instruction_count = UINT64_C(14);\n''',
'''    report->iterations = UINT64_C(3);\n    report->changed_values = changed_values + UINT64_C(1);\n    report->bytes_written = bytes_written + 4u;\n    report->recovered_instruction_count = instructions;\n''', 1)
          p.write_text(s)

          p = Path('src/recovered/native_runtime.c')
          s = p.read_text()
          old = '''        if (status == VF2_OK && (counter0 != 0u || counter1 != 0u)) {\n            status = execute_texture_counter_interpreter(\n                machine, cpu, &local_report\n            );\n        } else if (status == VF2_OK) {\n'''
          new = '''        if (status == VF2_OK &&\n            (counter0 == UINT32_C(1) || counter1 == UINT32_C(1))) {\n            status = execute_texture_counter_interpreter(\n                machine, cpu, &local_report\n            );\n        } else if (status == VF2_OK) {\n'''
          if old not in s:
              raise SystemExit('native routing anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Add countdown coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/analysis/test_orchestrator_bridge.c')
          s = p.read_text()
          anchor = '''static void test_counter_update_zero_dispatch(void)\n'''
          test = '''static void test_counter_update_active_countdowns(void)\n{\n    vf2_model2a machine;\n    vf2_i960_cpu cpu;\n    vf2_hybrid_bridge_report report = {0};\n    uint32_t value = 0u;\n\n    CHECK(vf2_model2a_initialize(&machine) != 0);\n    if (machine.work_ram == NULL) {\n        return;\n    }\n    CHECK(vf2_model2a_write_u32(&machine, UINT32_C(0x005502c0), UINT32_C(3)) == VF2_OK);\n    CHECK(vf2_model2a_write_u32(&machine, UINT32_C(0x005502d0), UINT32_C(2)) == VF2_OK);\n    CHECK(vf2_model2a_write_u32(&machine, UINT32_C(0x005502e0), 0u) == VF2_OK);\n    enter_parent(&cpu, UINT32_C(0x0004bb98));\n\n    CHECK(vf2_hybrid_post_frame_bridge_execute(&machine, &cpu, &report) == VF2_OK);\n    CHECK(report.kind == VF2_HYBRID_BRIDGE_TEXTURE_COUNTER_UPDATE);\n    CHECK(report.recovered_instruction_count == UINT64_C(16));\n    CHECK(report.changed_values == UINT64_C(2));\n    CHECK(report.bytes_written == 8u);\n    CHECK(cpu.ip == UINT32_C(0x0004bc58));\n    CHECK(vf2_model2a_read_u32(&machine, UINT32_C(0x005502c0), &value) == VF2_OK);\n    CHECK(value == UINT32_C(2));\n    CHECK(vf2_model2a_read_u32(&machine, UINT32_C(0x005502d0), &value) == VF2_OK);\n    CHECK(value == UINT32_C(1));\n\n    vf2_model2a_shutdown(&machine);\n}\n\n'''
          if anchor not in s:
              raise SystemExit('test anchor missing')
          s = s.replace(anchor, test + anchor, 1)
          call_anchor = '''    test_counter_update_dispatch();\n'''
          if call_anchor not in s:
              raise SystemExit('test call anchor missing')
          s = s.replace(call_anchor, '    test_counter_update_active_countdowns();\n' + call_anchor, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm .github/workflows/v0194-recover-texture-counter-countdown.yml
          git add src/recovered/texture_bridge_texture.c src/recovered/native_runtime.c tests/analysis/test_orchestrator_bridge.c
          git commit -m 'Recover active texture counter countdown paths'
          git push origin HEAD:master
