name: v0194 recover texture counter countdown
'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0194-recover-texture-counter-countdown.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovered counter countdowns
        run: |
          echo ',' | base64 -d > /tmp/v0194.patch
          git apply --check /tmp/v0194.patch
          git apply /tmp/v0194.patch
          git diff --check
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm .github/workflows/v0194-recover-texture-counter-countdown.yml
          git add src/recovered/texture_bridge_texture.c src/recovered/native_runtime.c tests/analysis/test_orchestrator_bridge.c
          git commit -m 'Recover active texture counter countdown paths'
          git push origin HEAD:master
