name: v0126 documentation sync

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0126-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize recovery frontier documentation
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('docs/UNCOVERED_BRANCHES.md')
          text = path.read_text()
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          if text.count(old) != 1:
              raise SystemExit(f'documentation anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0126-doc-sync.yml
          git add docs/UNCOVERED_BRANCHES.md
          git commit -m "Sync v0126 bit-16 compound recovery frontier"
          git push origin HEAD:master
