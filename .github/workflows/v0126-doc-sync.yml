name: v0126 documentation sync

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/v0126-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize recovery frontier documentation
        shell: bash
        env:
          NEW_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('docs/UNCOVERED_BRANCHES.md')
          text = path.read_text()
          start_marker = 'Nine of those eleven masks have since been re-measured'
          end_marker = '`decomp/i960/notes/game_info_1645c_full_state8_bit14_15_16_recalibration_v0125.md`).\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          path.write_text(text[:start] + new + text[end:])
          PY
      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0126-doc-sync.yml
          git add docs/UNCOVERED_BRANCHES.md
          git commit -m "Sync v0126 bit-16 compound recovery frontier"
          git push origin HEAD:master
