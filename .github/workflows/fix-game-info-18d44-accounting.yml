name: Fix game-info 18d44 accounting
on:
  push:
    paths:
      - .github/workflows/fix-game-info-18d44-accounting.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply measured BL accounting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c'); s=p.read_text()
          old='body_instructions += 10u;'
          if s.count(old) < 2: raise SystemExit('expected two 18d44 branch increments')
          new='''body_instructions +=\n                (int32_t)cpu->registers[VF2_I960_G0_REGISTER] < 0\n                    ? 9u : 10u;'''
          s=s.replace(old,new,2)
          p.write_text(s)
          PY
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: |
          exe=$(find build -type f -name vf2i960 | head -n1)
          cp "$exe" vf2i960 && chmod +x vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-18d44-accounting
          path: vf2i960
      - name: Commit fix and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/recovered/hybrid.c
          git rm -f .github/workflows/fix-game-info-18d44-accounting.yml
          git commit -m 'Fix fa_game_info 18d44 branch accounting'
          git push origin HEAD:master
