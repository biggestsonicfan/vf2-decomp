name: Fix index10 Werror
on:
  push:
    paths:
      - tools/fix_index10_werror.py
      - .github/workflows/fix-index10-werror.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply formatting fix
        run: python3 tools/fix_index10_werror.py
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/texture_bridge_match.c
          git rm -f tools/fix_index10_werror.py .github/workflows/fix-index10-werror.yml
          git commit -m 'Fix selector17 index10 strict build'
          git push
