name: Revert incomplete game-info bit8 priority
on: [push]
jobs:
  revert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore pre-bit8-priority source
        run: |
          git fetch origin b631d9f567b9a54cab13199b0f063e857c8652ed --depth=1
          git show FETCH_HEAD:src/recovered/hybrid.c > src/recovered/hybrid.c
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit and cleanup
        run: |
          rm .github/workflows/revert-game-info-bit8-priority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c .github/workflows/revert-game-info-bit8-priority.yml
          git commit -m 'Revert incomplete fa_game_info bit8 priority'
          git push
