name: Recover selector3 phase4 v2
on:
  push:
    branches: [master]
    paths: [.github/workflows/recover-selector3-phase4-v2.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and gate real phase4 path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/recover-selector3-phase4.yml').read_text(); m="          python3 - <<'PY'\n"; a=wf.index(m)+len(m); b=wf.index("          PY\n",a); q=wf[a:b]; q='\n'.join(x[10:] if x.startswith('          ') else x for x in q.splitlines()); exec(compile(q,'p4.py','exec'))
          p=Path('src/recovered/texture_bridge_match.c'); s=p.read_text(); a=s.index('static vf2_status execute_selector3_phase4('); b=s.index('static vf2_status execute_selector3_phase5(',a); x=s[a:b]
          x=x.replace('    uint32_t counter = 0u;\n    uint8_t fifteen', '    uint32_t counter = 0u;\n    uint32_t phase4_table = 0u;\n    uint8_t mode = 0u;\n    int recovered_initial_path = 0;\n    uint8_t fifteen',1)
          x=x.replace('    if (status == VF2_OK) {\n        status = execute_selector3_phase4_mode_init(machine);\n    }', '    if (status == VF2_OK) status = vf2_model2a_read(machine, UINT32_C(0x00500064), &mode, sizeof(mode));\n    if (status == VF2_OK) status = vf2_model2a_read_u32(machine, UINT32_C(0x00025034) + (uint32_t)mode * UINT32_C(32), &phase4_table);\n    if (status == VF2_OK && phase4_table != 0u) { recovered_initial_path = 1; status = execute_selector3_phase4_mode_init(machine); }',1)
          x=x.replace('    if (status == VF2_OK) {\n        status = execute_selector3_phase4_actor_init(machine);\n    }','    if (status == VF2_OK && recovered_initial_path) status = execute_selector3_phase4_actor_init(machine);',1)
          x=x.replace('    if (status == VF2_OK) status = execute_selector3_phase4_timeline(machine);\n    if (status == VF2_OK) status = vf2_model2a_read_u32(machine, UINT32_C(0x00500024), &counter);\n    if (status == VF2_OK) {\n        --counter;\n        status = vf2_model2a_write_u32(machine, UINT32_C(0x00500024), counter);\n    }\n    if (status == VF2_OK && counter == 0u) return VF2_ERROR_UNSUPPORTED;', '    if (status == VF2_OK && recovered_initial_path) status = execute_selector3_phase4_timeline(machine);\n    if (status == VF2_OK && recovered_initial_path) status = vf2_model2a_read_u32(machine, UINT32_C(0x00500024), &counter);\n    if (status == VF2_OK && recovered_initial_path) { --counter; status = vf2_model2a_write_u32(machine, UINT32_C(0x00500024), counter); }\n    if (status == VF2_OK && recovered_initial_path && counter == 0u) return VF2_ERROR_UNSUPPORTED;',1)
          s=s[:a]+x+s[b:]; p.write_text(s)
          PY
      - name: Configure build test
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        run: rm -f .github/workflows/recover-selector3-phase4*.yml .github/workflows/dump-selector3-phase4.yml && git config user.name celsowm && git config user.email celsowm@gmail.com && git add src/recovered/texture_bridge_match.c .github/workflows && git commit -m 'Recover selector3 phase4 initial path' && git push origin HEAD:master
