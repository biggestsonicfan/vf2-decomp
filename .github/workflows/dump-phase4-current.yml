name: Dump phase4 current
on:
  push:
    branches: [master]
    paths: [.github/workflows/dump-phase4-current.yml]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/recovered/texture_bridge_match.c').read_text()
          a=s.index('static vf2_status execute_selector3_phase4(')
          b=s.index('static vf2_status execute_selector3_phase5(',a)
          print(s[a:b])
          a=s.index('        if (status == VF2_OK && entry_phase == UINT8_C(4)) {')
          b=s.index('        if (status == VF2_OK && phase8_handoff) {',a)
          print('===ACCOUNT===')
          print(s[a:b])
          c=s.index('static vf2_status execute_selector3_phase3_sound_event')
          d=s.index('static vf2_status execute_selector3_phase3(',c)
          print('===SOUND===')
          print(s[c:d])
          PY
