name: Dump selector3 phase7
on:
  push:
    branches: [master]
    paths: [.github/workflows/dump-selector3-phase7.yml]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/recovered/texture_bridge_match.c').read_text()
          a=s.index('static vf2_status execute_selector3_phase7(')
          b=s.index('static vf2_status execute_selector3_phase8(',a)
          print(s[a:b])
          PY
