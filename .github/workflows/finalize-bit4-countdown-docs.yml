name: Finalize bilateral bit4 countdown evidence
on:
  push:
    branches: [master]
    paths: [.github/workflows/finalize-bit4-countdown-docs.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update evidence and changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          note = Path('decomp/i960/notes/game_info_18644_mode_bit6.md')
          s = note.read_text()
          old = '''The mixed bilateral recoveries remain deliberately narrow. Exactly one fighter may carry bit 4 or bit 1; bit1 is ROM-backed with zero or nonzero countdown, while bit4 remains zero-countdown only. Bit1 on both fighters, countdown plus bilateral bit4 and bit4 on both fighters remain fail-closed, as do other unmeasured extra-bit combinations.\n'''
          new = '''The bilateral bit4 composition is now also ROM-backed with a nonzero countdown. A fresh checkpoint captured exactly at `0x0001645c` was used with active fighter flags `0x84000100`/`0x84000110` and countdown byte `0x0050a0b6 = 1`. Both physical orientations match the reference i960 across the complete `fa_game_info` task: 654 instructions with `base+0x3351` bit 6 clear and 659 with bit 6 set. All four probes end at `0x00010dcc` with complete CPU and mutable-memory equality. The countdown therefore takes the already-recovered shared `0x18890` rejoin before the directional zero-countdown bit4 accounting matters.\n\nThe mixed bilateral recoveries remain deliberately narrow. Exactly one fighter may carry bit 4 or bit 1; both bit1 and bit4 are ROM-backed with zero or nonzero countdown in either physical orientation. Bit1 on both fighters, bit4 on both fighters and other unmeasured extra-bit combinations remain fail-closed.\n'''
          if old not in s:
              raise SystemExit('note scope anchor missing')
          note.write_text(s.replace(old, new, 1))

          changelog = Path('CHANGELOG.md')
          s = changelog.read_text()
          old = '''- expanded `fa_game_info` state-bit-8 recovery at `0x00018644`: isolated\n  bit8+bit1 and bit8+bit4 are recovered, bilateral bit8 matches zero-countdown\n  (690/695 instructions with mode bit 6 clear/set) and nonzero-countdown\n  (666/671), zero-countdown bilateral bit8+bit4 on exactly one fighter matches\n  677/682, and bilateral bit8+bit1 on exactly one fighter matches 701/706 with\n  zero countdown and 677/682 with nonzero countdown in either orientation;\n  both-fighter bit1, bit4 countdown/mirrors and other unmeasured combinations\n  remain explicitly fail-closed;\n'''
          new = '''- expanded `fa_game_info` state-bit-8 recovery at `0x00018644`: isolated\n  bit8+bit1 and bit8+bit4 are recovered, bilateral bit8 matches zero-countdown\n  (690/695 instructions with mode bit 6 clear/set) and nonzero-countdown\n  (666/671), bilateral bit8+bit4 on exactly one fighter matches 677/682 with\n  zero countdown and 654/659 with nonzero countdown, and bilateral bit8+bit1\n  on exactly one fighter matches 701/706 with zero countdown and 677/682 with\n  nonzero countdown in either orientation; both-fighter bit1/bit4 and other\n  unmeasured combinations remain explicitly fail-closed;\n'''
          if old not in s:
              raise SystemExit('changelog anchor missing')
          changelog.write_text(s.replace(old, new, 1))
          PY
      - name: Commit documentation and self-clean
        shell: bash
        run: |
          rm .github/workflows/finalize-bit4-countdown-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md decomp/i960/notes/game_info_18644_mode_bit6.md .github/workflows/finalize-bit4-countdown-docs.yml
          git commit -m "docs: record bilateral bit4 countdown differential"
          git push
