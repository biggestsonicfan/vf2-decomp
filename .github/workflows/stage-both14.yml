name: Stage bilateral both bit1-bit4 candidate
on:
  push:
    branches: [master]
    paths: [.github/workflows/stage-both14.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact both14 candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c')
          s=p.read_text()
          old='''        const bool bilateral_cross_bit1_bit4 =\n            (r7 == state8_bit1 && r8 == state8_bit4) ||\n            (r7 == state8_bit4 && r8 == state8_bit1);\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4) {\n'''
          new='''        const bool bilateral_cross_bit1_bit4 =\n            (r7 == state8_bit1 && r8 == state8_bit4) ||\n            (r7 == state8_bit4 && r8 == state8_bit1);\n        const uint32_t state8_bit1_bit4 =\n            state8 | (UINT32_C(1) << 1u) | (UINT32_C(1) << 4u);\n        const bool bilateral_both_bit1_bit4 =\n            r7 == state8_bit1_bit4 && r8 == state8_bit1_bit4;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4 &&\n            !bilateral_both_bit1_bit4) {\n'''
          if old not in s: raise SystemExit('initial guard anchor missing')
          s=s.replace(old,new,1)
          old2='''        const bool cross_bilateral =\n            (r7 == isolated_state8_bit1 && r8 == state8_bit4) ||\n            (r7 == state8_bit4 && r8 == isolated_state8_bit1);\n        if (!forward_isolated && !reverse_isolated &&\n            !forward_bilateral && !reverse_bilateral && !both_bilateral &&\n            !cross_bilateral) {\n'''
          new2='''        const bool cross_bilateral =\n            (r7 == isolated_state8_bit1 && r8 == state8_bit4) ||\n            (r7 == state8_bit4 && r8 == isolated_state8_bit1);\n        const uint32_t state8_bit1_bit4 =\n            isolated_state8_bit1 | (UINT32_C(1) << 4u);\n        const bool both_bit1_bit4 =\n            r7 == state8_bit1_bit4 && r8 == state8_bit1_bit4;\n        if (!forward_isolated && !reverse_isolated &&\n            !forward_bilateral && !reverse_bilateral && !both_bilateral &&\n            !cross_bilateral && !both_bit1_bit4) {\n'''
          if old2 not in s: raise SystemExit('bit1 guard anchor missing')
          s=s.replace(old2,new2,1)
          old3='''            const bool cross_bit1_bit4 =\n                (r7 == state8_bit1 && r8 == state8_bit4) ||\n                (r7 == state8_bit4 && r8 == state8_bit1);\n            if (!both_bit4 && !cross_bit1_bit4) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n'''
          new3='''            const bool cross_bit1_bit4 =\n                (r7 == state8_bit1 && r8 == state8_bit4) ||\n                (r7 == state8_bit4 && r8 == state8_bit1);\n            const uint32_t state8_bit1_bit4 =\n                state8_bit1 | (UINT32_C(1) << 4u);\n            const bool both_bit1_bit4 =\n                r7 == state8_bit1_bit4 && r8 == state8_bit1_bit4;\n            if (!both_bit4 && !cross_bit1_bit4 && !both_bit1_bit4) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n'''
          if old3 not in s: raise SystemExit('threshold anchor missing')
          p.write_text(s.replace(old3,new3,1))
          PY
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish candidate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C probe-both14
          git add src/recovered/hybrid.c
          git commit -m "candidate: admit bilateral both bit1-bit4 state"
          git push --force origin probe-both14
