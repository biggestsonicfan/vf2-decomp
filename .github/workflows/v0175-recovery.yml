name: v0175 recovery
on:
  push:
    branches: [master]
    paths: ['.github/workflows/v0175-recovery.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete measured composite postconditions
        env:
          BLOCK: ''
          NOTE: ''
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          start_marker = '        /* ROM-backed v0174 state-8/positive-threshold composites:'
          end_marker = '    }\n    if (mixed_negative_state4_zero_flags) {'
          start = s.index(start_marker)
          end = s.index(end_marker, start) + len(end_marker)
          block = base64.b64decode(os.environ['BLOCK']).decode()
          p.write_text(s[:start] + block + s[end:])
          PY
          printf '%s' "$NOTE" | base64 -d > decomp/i960/notes/game_info_1645c_positive_bit6_8140_10140_composites_v0174.md
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit recovered corridor
        run: |
          git config user.name 'celsowm'
          git config user.email 'celsowm@users.noreply.github.com'
          git rm .github/workflows/v0175-recovery.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_1645c_positive_bit6_8140_10140_composites_v0174.md
          git commit -m 'Complete v0174 8140/10140 composite postconditions' -m 'Restore measured compare/stale-frame state for all 8140 composites and the five nontrivial 10140 composites. Also recover 10140 fighter bit11 and high-29 +0x6da side effects while preserving exact-mask fail-closed admission.'
          git push origin HEAD:master
