name: v0175 recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0175-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovery patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v0175.patch
          git apply --check /tmp/v0175.patch
          git apply /tmp/v0175.patch
      - name: Build and test
        shell: bash
        run: |
          cmake -S . -B build-v0175 -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
          cmake --build build-v0175 --parallel
          ctest --test-dir build-v0175 --output-on-failure
          git diff --check
      - name: Commit recovery
        shell: bash
        run: |
          git config user.name 'celsowm'
          git config user.email 'celsowm@gmail.com'
          rm .github/workflows/v0175-recovery.yml
          git add -A
          git commit -m 'Recover remaining positive bit6 cross-family highs' -m 'Close 120 state-8 positive bit-6 high-extension masks across c140/14140/18140/1c140 with ROM-measured counter, compare, stale-frame and fighter-memory postconditions.'
          git push origin HEAD:master
