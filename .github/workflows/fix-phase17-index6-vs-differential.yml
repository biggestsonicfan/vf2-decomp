name: Fix selector17 index6 VS differential
on:
  push:
    paths:
      - tools/fix_phase17_index6_vs_differential.py
      - .github/workflows/fix-phase17-index6-vs-differential.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply differential fix
        run: python3 tools/fix_phase17_index6_vs_differential.py
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish differential binary
        uses: actions/upload-artifact@v4
        with:
          name: vf2i960-index6-vs-differential
          path: build/vf2i960
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/texture_bridge_match.c
          git rm -f tools/fix_phase17_index6_vs_differential.py .github/workflows/fix-phase17-index6-vs-differential.yml
          git commit -m 'Match BOOKKEEPING VS diagram refresh'
          git push
