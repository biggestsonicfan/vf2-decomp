name: Recover v0.0.24 orchestrator shell

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/recover-v0024-orchestrator-shell.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Integrate shell blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "include/vf2/hybrid.h",
              "    VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS,\n"
              "    VF2_HYBRID_BRIDGE_SECOND_SCHEDULER_ENTRY\n",
              "    VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS,\n"
              "    VF2_HYBRID_BRIDGE_TEXTURE_STATUS_DISPATCH_CALL,\n"
              "    VF2_HYBRID_BRIDGE_TEXTURE_FINAL_STATUS_CALL,\n"
              "    VF2_HYBRID_BRIDGE_TEXTURE_BODY_RETURN,\n"
              "    VF2_HYBRID_BRIDGE_TEXTURE_POST_BODY_CALL,\n"
              "    VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_EPILOGUE,\n"
              "    VF2_HYBRID_BRIDGE_SECOND_SCHEDULER_ENTRY\n",
              "bridge enum",
          )

          replace_once(
              "src/recovered/texture_bridge.c",
              "#define VF2_TEXTURE_DEFAULT_LIMITS_RETURN UINT32_C(0x0004bd00)\n"
              "#define VF2_TEXTURE_TREE_TABLE UINT32_C(0x0004ad78)\n",
              "#define VF2_TEXTURE_DEFAULT_LIMITS_RETURN UINT32_C(0x0004bd00)\n"
              "#define VF2_TEXTURE_STATUS_DISPATCH_ENTRY UINT32_C(0x0004bd24)\n"
              "#define VF2_TEXTURE_STATUS_DISPATCH_TARGET UINT32_C(0x0004d2c0)\n"
              "#define VF2_TEXTURE_STATUS_DISPATCH_RETURN UINT32_C(0x0004bd5c)\n"
              "#define VF2_TEXTURE_RECORD_START UINT32_C(0x00550168)\n"
              "#define VF2_TEXTURE_RECORD_END UINT32_C(0x005502a8)\n"
              "#define VF2_TEXTURE_RUNTIME_FLAGS UINT32_C(0x00508000)\n"
              "#define VF2_TEXTURE_FINAL_STATUS_ENTRY UINT32_C(0x0004bf90)\n"
              "#define VF2_TEXTURE_STATUS_WORD UINT32_C(0x0055c2f0)\n"
              "#define VF2_TEXTURE_COUNTER0 UINT32_C(0x005502c0)\n"
              "#define VF2_TEXTURE_COUNTER1 UINT32_C(0x005502d0)\n"
              "#define VF2_TEXTURE_COUNTER2 UINT32_C(0x005502e0)\n"
              "#define VF2_TEXTURE_FINAL_STATUS_TARGET UINT32_C(0x0004d25c)\n"
              "#define VF2_TEXTURE_FINAL_STATUS_RETURN UINT32_C(0x0004bfdc)\n"
              "#define VF2_TEXTURE_BODY_RETURN_ENTRY UINT32_C(0x0004bfdc)\n"
              "#define VF2_TEXTURE_POST_BODY_CALL_ENTRY UINT32_C(0x0004bb94)\n"
              "#define VF2_TEXTURE_POST_BODY_CALL_TARGET UINT32_C(0x0004b8d8)\n"
              "#define VF2_TEXTURE_POST_BODY_CALL_RETURN UINT32_C(0x0004bb98)\n"
              "#define VF2_TEXTURE_ORCHESTRATOR_EPILOGUE_ENTRY UINT32_C(0x0004bc58)\n"
              "#define VF2_TEXTURE_TREE_TABLE UINT32_C(0x0004ad78)\n",
              "shell constants",
          )

          helpers = r'''static vf2_status execute_texture_status_dispatch_call(
              vf2_model2a *machine,
              vf2_i960_cpu *cpu,
              vf2_hybrid_bridge_report *report
          )
          {
              uint16_t active_count = 0u;
              uint16_t status_value = 0u;
              uint32_t runtime_flags = 0u;
              vf2_status status = VF2_OK;

              if (cpu->local_frame_depth == 0u) {
                  return VF2_ERROR_UNSUPPORTED;
              }
              cpu->registers[5] = VF2_TEXTURE_RECORD_START;
              cpu->registers[6] = VF2_TEXTURE_RECORD_END;
              status = read_u16(
                  machine,
                  VF2_TEXTURE_RECORD_START + UINT32_C(2),
                  &active_count
              );
              if (status == VF2_OK) {
                  cpu->registers[3] =
                      (uint32_t)(int32_t)(int16_t)active_count;
                  if (cpu->registers[3] == 0u) {
                      return VF2_ERROR_UNSUPPORTED;
                  }
                  status = read_u16(
                      machine, VF2_TEXTURE_RECORD_START, &status_value
                  );
              }
              if (status == VF2_OK) {
                  cpu->registers[16] = status_value;
                  status = vf2_model2a_read_u32(
                      machine, VF2_TEXTURE_RUNTIME_FLAGS, &runtime_flags
                  );
              }
              if (status != VF2_OK) {
                  return status;
              }
              cpu->registers[15] = runtime_flags;
              if ((runtime_flags & (UINT32_C(1) << 9u)) != 0u) {
                  return VF2_ERROR_UNSUPPORTED;
              }

              status = vf2_i960_cpu_enter_procedure(
                  cpu,
                  VF2_TEXTURE_STATUS_DISPATCH_TARGET,
                  VF2_TEXTURE_STATUS_DISPATCH_RETURN
              );
              if (status != VF2_OK) {
                  return status;
              }
              cpu->executed_instructions += UINT64_C(8);

              report->kind = VF2_HYBRID_BRIDGE_TEXTURE_STATUS_DISPATCH_CALL;
              report->entry_address = VF2_TEXTURE_STATUS_DISPATCH_ENTRY;
              report->exit_address = cpu->ip;
              report->iterations = UINT64_C(1);
              report->recovered_instruction_count = UINT64_C(8);
              report->recovered_procedure_calls = UINT64_C(1);
              report->cpu_poststate_applied = 1;
              return VF2_OK;
          }

          static vf2_status execute_texture_final_status_call(
              vf2_model2a *machine,
              vf2_i960_cpu *cpu,
              vf2_hybrid_bridge_report *report
          )
          {
              uint32_t counter0 = 0u;
              uint32_t counter1 = 0u;
              uint32_t counter2 = 0u;
              uint32_t runtime_flags = 0u;
              vf2_status status = VF2_OK;

              if (cpu->local_frame_depth == 0u) {
                  return VF2_ERROR_UNSUPPORTED;
              }
              cpu->registers[3] = 0u;
              status = write_u16(machine, VF2_TEXTURE_STATUS_WORD, 0u);
              if (status == VF2_OK) {
                  status = vf2_model2a_read_u32(
                      machine, VF2_TEXTURE_COUNTER0, &counter0
                  );
              }
              if (status == VF2_OK) {
                  cpu->registers[14] = counter0;
                  if (counter0 != 0u) {
                      return VF2_ERROR_UNSUPPORTED;
                  }
                  status = vf2_model2a_read_u32(
                      machine, VF2_TEXTURE_COUNTER1, &counter1
                  );
              }
              if (status == VF2_OK) {
                  cpu->registers[14] = counter1;
                  if (counter1 != 0u) {
                      return VF2_ERROR_UNSUPPORTED;
                  }
                  status = vf2_model2a_read_u32(
                      machine, VF2_TEXTURE_COUNTER2, &counter2
                  );
              }
              if (status == VF2_OK) {
                  cpu->registers[14] = counter2;
                  if (counter2 == 0u) {
                      return VF2_ERROR_UNSUPPORTED;
                  }
                  status = vf2_model2a_read_u32(
                      machine, VF2_TEXTURE_RUNTIME_FLAGS, &runtime_flags
                  );
              }
              if (status != VF2_OK) {
                  return status;
              }
              cpu->registers[15] = runtime_flags;
              if ((runtime_flags & (UINT32_C(1) << 9u)) != 0u) {
                  return VF2_ERROR_UNSUPPORTED;
              }

              status = vf2_i960_cpu_enter_procedure(
                  cpu,
                  VF2_TEXTURE_FINAL_STATUS_TARGET,
                  VF2_TEXTURE_FINAL_STATUS_RETURN
              );
              if (status != VF2_OK) {
                  return status;
              }
              cpu->executed_instructions += UINT64_C(11);

              report->kind = VF2_HYBRID_BRIDGE_TEXTURE_FINAL_STATUS_CALL;
              report->entry_address = VF2_TEXTURE_FINAL_STATUS_ENTRY;
              report->exit_address = cpu->ip;
              report->iterations = UINT64_C(1);
              report->changed_values = UINT64_C(1);
              report->bytes_written = 2u;
              report->recovered_instruction_count = UINT64_C(11);
              report->recovered_procedure_calls = UINT64_C(1);
              report->cpu_poststate_applied = 1;
              return VF2_OK;
          }

          static vf2_status execute_texture_body_return(
              vf2_model2a *machine,
              vf2_i960_cpu *cpu,
              vf2_hybrid_bridge_report *report
          )
          {
              vf2_status status = VF2_OK;

              if (cpu->local_frame_depth == 0u) {
                  return VF2_ERROR_UNSUPPORTED;
              }
              cpu->executed_instructions += UINT64_C(1);
              status = vf2_i960_cpu_return_procedure(cpu, machine);
              if (status != VF2_OK) {
                  return status;
              }

              report->kind = VF2_HYBRID_BRIDGE_TEXTURE_BODY_RETURN;
              report->entry_address = VF2_TEXTURE_BODY_RETURN_ENTRY;
              report->exit_address = cpu->ip;
              report->iterations = UINT64_C(1);
              report->recovered_instruction_count = UINT64_C(1);
              report->recovered_procedure_returns = UINT64_C(1);
              report->cpu_poststate_applied = 1;
              return VF2_OK;
          }

          static vf2_status execute_texture_post_body_call(
              vf2_i960_cpu *cpu,
              vf2_hybrid_bridge_report *report
          )
          {
              vf2_status status = VF2_OK;

              if (cpu->local_frame_depth == 0u) {
                  return VF2_ERROR_UNSUPPORTED;
              }
              status = vf2_i960_cpu_enter_procedure(
                  cpu,
                  VF2_TEXTURE_POST_BODY_CALL_TARGET,
                  VF2_TEXTURE_POST_BODY_CALL_RETURN
              );
              if (status != VF2_OK) {
                  return status;
              }
              cpu->executed_instructions += UINT64_C(1);

              report->kind = VF2_HYBRID_BRIDGE_TEXTURE_POST_BODY_CALL;
              report->entry_address = VF2_TEXTURE_POST_BODY_CALL_ENTRY;
              report->exit_address = cpu->ip;
              report->iterations = UINT64_C(1);
              report->recovered_instruction_count = UINT64_C(1);
              report->recovered_procedure_calls = UINT64_C(1);
              report->cpu_poststate_applied = 1;
              return VF2_OK;
          }

          static vf2_status execute_texture_orchestrator_epilogue(
              vf2_model2a *machine,
              vf2_i960_cpu *cpu,
              vf2_hybrid_bridge_report *report
          )
          {
              const uint32_t stack_end = cpu->registers[1];
              uint32_t register_index = 0u;
              uint32_t value = 0u;
              vf2_status status = VF2_OK;

              if (cpu->local_frame_depth == 0u || stack_end < UINT32_C(112)) {
                  return VF2_ERROR_UNSUPPORTED;
              }
              for (register_index = 30u; register_index >= 3u;
                   --register_index) {
                  status = vf2_model2a_read_u32(
                      machine,
                      stack_end - (UINT32_C(31) - register_index) * UINT32_C(4),
                      &value
                  );
                  if (status != VF2_OK) {
                      return status;
                  }
                  cpu->registers[register_index] = value;
                  if (register_index == 3u) {
                      break;
                  }
              }
              cpu->registers[1] = stack_end - UINT32_C(112);
              cpu->executed_instructions += UINT64_C(21);
              status = vf2_i960_cpu_return_procedure(cpu, machine);
              if (status != VF2_OK) {
                  return status;
              }

              report->kind =
                  VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_EPILOGUE;
              report->entry_address = VF2_TEXTURE_ORCHESTRATOR_EPILOGUE_ENTRY;
              report->exit_address = cpu->ip;
              report->iterations = UINT64_C(28);
              report->changed_values = UINT64_C(28);
              report->recovered_instruction_count = UINT64_C(21);
              report->recovered_procedure_returns = UINT64_C(1);
              report->cpu_poststate_applied = 1;
              return VF2_OK;
          }

          '''
          replace_once(
              "src/recovered/texture_bridge.c",
              "static vf2_status execute_texture_orchestrator_save_call(\n",
              helpers + "static vf2_status execute_texture_orchestrator_save_call(\n",
              "helper insertion",
          )
          replace_once(
              "src/recovered/texture_bridge.c",
              "    case VF2_TEXTURE_ORCHESTRATOR_SAVE_ENTRY:\n",
              "    case VF2_TEXTURE_STATUS_DISPATCH_ENTRY:\n"
              "        status = execute_texture_status_dispatch_call(\n"
              "            machine, cpu, &local_report\n"
              "        );\n"
              "        break;\n"
              "    case VF2_TEXTURE_FINAL_STATUS_ENTRY:\n"
              "        status = execute_texture_final_status_call(\n"
              "            machine, cpu, &local_report\n"
              "        );\n"
              "        break;\n"
              "    case VF2_TEXTURE_BODY_RETURN_ENTRY:\n"
              "        status = execute_texture_body_return(\n"
              "            machine, cpu, &local_report\n"
              "        );\n"
              "        break;\n"
              "    case VF2_TEXTURE_POST_BODY_CALL_ENTRY:\n"
              "        status = execute_texture_post_body_call(\n"
              "            cpu, &local_report\n"
              "        );\n"
              "        break;\n"
              "    case VF2_TEXTURE_ORCHESTRATOR_EPILOGUE_ENTRY:\n"
              "        status = execute_texture_orchestrator_epilogue(\n"
              "            machine, cpu, &local_report\n"
              "        );\n"
              "        break;\n"
              "    case VF2_TEXTURE_ORCHESTRATOR_SAVE_ENTRY:\n",
              "dispatcher cases",
          )
          replace_once(
              "src/recovered/texture_bridge.c",
              "    case VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS:\n"
              "        return \"texture-default-limits\";\n",
              "    case VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS:\n"
              "        return \"texture-default-limits\";\n"
              "    case VF2_HYBRID_BRIDGE_TEXTURE_STATUS_DISPATCH_CALL:\n"
              "        return \"texture-status-dispatch-call\";\n"
              "    case VF2_HYBRID_BRIDGE_TEXTURE_FINAL_STATUS_CALL:\n"
              "        return \"texture-final-status-call\";\n"
              "    case VF2_HYBRID_BRIDGE_TEXTURE_BODY_RETURN:\n"
              "        return \"texture-body-return\";\n"
              "    case VF2_HYBRID_BRIDGE_TEXTURE_POST_BODY_CALL:\n"
              "        return \"texture-post-body-call\";\n"
              "    case VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_EPILOGUE:\n"
              "        return \"texture-orchestrator-epilogue\";\n",
              "kind names",
          )

          replace_once(
              "tools/vf2i960/main.c",
              "    size_t bridge_block_counts[32] = {0u};\n",
              "    size_t bridge_block_counts[64] = {0u};\n",
              "block count capacity",
          )
          replace_once(
              "tools/vf2i960/main.c",
              "                native_ip_before == UINT32_C(0x0004bb18) ||\n"
              "                native_ip_before == UINT32_C(0x0004bcd4) ||\n",
              "                native_ip_before == UINT32_C(0x0004bb18) ||\n"
              "                native_ip_before == UINT32_C(0x0004bd24) ||\n"
              "                native_ip_before == UINT32_C(0x0004bf90) ||\n"
              "                native_ip_before == UINT32_C(0x0004bfdc) ||\n"
              "                native_ip_before == UINT32_C(0x0004bb94) ||\n"
              "                native_ip_before == UINT32_C(0x0004bc58) ||\n"
              "                native_ip_before == UINT32_C(0x0004bcd4) ||\n",
              "candidate addresses",
          )
          replace_once(
              "tools/vf2i960/main.c",
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS ||\n"
              "                        (bridge_validated_blocks % 128u) == 0u;\n",
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS ||\n"
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_STATUS_DISPATCH_CALL ||\n"
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_FINAL_STATUS_CALL ||\n"
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_BODY_RETURN ||\n"
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_POST_BODY_CALL ||\n"
              "                        bridge_report.kind ==\n"
              "                            VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_EPILOGUE ||\n"
              "                        (bridge_validated_blocks % 128u) == 0u;\n",
              "memory checkpoints",
          )
          replace_once(
              "tools/vf2i960/main.c",
              "             bridge_recovered_instructions != UINT64_C(1268800) ||\n"
              "             bridge_interpreted_instructions != UINT64_C(2022) ||\n"
              "             bridge_validated_blocks != 146u ||\n"
              "             bridge_memory_checkpoints != 146u ||\n"
              "             bridge_recovered_calls != UINT64_C(252) ||\n"
              "             bridge_recovered_returns != UINT64_C(298) ||\n",
              "             bridge_recovered_instructions != UINT64_C(1268866) ||\n"
              "             bridge_interpreted_instructions != UINT64_C(1956) ||\n"
              "             bridge_validated_blocks != 154u ||\n"
              "             bridge_memory_checkpoints != 154u ||\n"
              "             bridge_recovered_calls != UINT64_C(258) ||\n"
              "             bridge_recovered_returns != UINT64_C(300) ||\n",
              "strict totals",
          )
          replace_once(
              "tools/vf2i960/main.c",
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS] != 1u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_SECOND_SCHEDULER_ENTRY] != 1u ||\n",
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_DEFAULT_LIMITS] != 1u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_STATUS_DISPATCH_CALL] != 4u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_FINAL_STATUS_CALL] != 1u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_BODY_RETURN] != 1u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_POST_BODY_CALL] != 1u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_EPILOGUE] != 1u ||\n"
              "             bridge_block_counts[VF2_HYBRID_BRIDGE_SECOND_SCHEDULER_ENTRY] != 1u ||\n",
              "strict block counts",
          )
          replace_once(
              "tools/vf2i960/main.c",
              "        printf(\"  second scheduler entries:         %zu\\n\",\n",
              "        printf(\"  status dispatch/calls:             %zu\\n\",\n"
              "               bridge_block_counts[\n"
              "                   VF2_HYBRID_BRIDGE_TEXTURE_STATUS_DISPATCH_CALL\n"
              "               ]);\n"
              "        printf(\"  final status/calls:                %zu\\n\",\n"
              "               bridge_block_counts[\n"
              "                   VF2_HYBRID_BRIDGE_TEXTURE_FINAL_STATUS_CALL\n"
              "               ]);\n"
              "        printf(\"  body returns:                      %zu\\n\",\n"
              "               bridge_block_counts[\n"
              "                   VF2_HYBRID_BRIDGE_TEXTURE_BODY_RETURN\n"
              "               ]);\n"
              "        printf(\"  post-body calls:                   %zu\\n\",\n"
              "               bridge_block_counts[\n"
              "                   VF2_HYBRID_BRIDGE_TEXTURE_POST_BODY_CALL\n"
              "               ]);\n"
              "        printf(\"  orchestrator epilogues:            %zu\\n\",\n"
              "               bridge_block_counts[\n"
              "                   VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_EPILOGUE\n"
              "               ]);\n"
              "        printf(\"  second scheduler entries:         %zu\\n\",\n",
              "summary counts",
          )

          tests = Path("tests/analysis/test_orchestrator_limits.c")
          text = tests.read_text(encoding="utf-8")
          test_block = r'''static void test_orchestrator_shell_bridges(void)
          {
              vf2_model2a machine;
              vf2_i960_cpu cpu;
              vf2_hybrid_bridge_report report = {0};
              uint8_t halfword[2] = {0u, 0u};
              uint32_t value = 0u;
              uint32_t index = 0u;
              const uint32_t stack_start =
                  VF2_WORK_RAM_BASE + UINT32_C(0x4000);
              const uint32_t stack_end = stack_start + UINT32_C(112);

              CHECK(vf2_model2a_initialize(&machine) != 0);
              if (machine.work_ram == NULL) {
                  return;
              }

              halfword[0] = 0x34u;
              halfword[1] = 0x12u;
              CHECK(
                  vf2_model2a_write(
                      &machine, UINT32_C(0x00550168), halfword, sizeof(halfword)
                  ) == VF2_OK
              );
              halfword[0] = 1u;
              halfword[1] = 0u;
              CHECK(
                  vf2_model2a_write(
                      &machine, UINT32_C(0x0055016a), halfword, sizeof(halfword)
                  ) == VF2_OK
              );
              CHECK(
                  vf2_model2a_write_u32(
                      &machine, UINT32_C(0x00508000), 0u
                  ) == VF2_OK
              );
              vf2_i960_cpu_reset(&cpu, 0u, 0u, UINT32_C(0x00001000));
              cpu.registers[1] = VF2_WORK_RAM_BASE + UINT32_C(0x3000);
              CHECK(
                  vf2_i960_cpu_enter_procedure(
                      &cpu, UINT32_C(0x0004bd24), UINT32_C(0x00001004)
                  ) == VF2_OK
              );
              CHECK(
                  vf2_hybrid_post_frame_bridge_execute(
                      &machine, &cpu, &report
                  ) == VF2_OK
              );
              CHECK(
                  report.kind ==
                  VF2_HYBRID_BRIDGE_TEXTURE_STATUS_DISPATCH_CALL
              );
              CHECK(report.recovered_instruction_count == UINT64_C(8));
              CHECK(report.recovered_procedure_calls == UINT64_C(1));
              CHECK(cpu.ip == UINT32_C(0x0004d2c0));
              CHECK(cpu.local_frame_depth == 2u);
              CHECK(cpu.executed_instructions == UINT64_C(8));
              CHECK(cpu.registers[16] == UINT32_C(0x1234));

              CHECK(
                  vf2_model2a_write_u32(
                      &machine, UINT32_C(0x005502c0), 0u
                  ) == VF2_OK
              );
              CHECK(
                  vf2_model2a_write_u32(
                      &machine, UINT32_C(0x005502d0), 0u
                  ) == VF2_OK
              );
              CHECK(
                  vf2_model2a_write_u32(
                      &machine, UINT32_C(0x005502e0), 1u
                  ) == VF2_OK
              );
              vf2_i960_cpu_reset(&cpu, 0u, 0u, UINT32_C(0x00002000));
              cpu.registers[1] = VF2_WORK_RAM_BASE + UINT32_C(0x3000);
              CHECK(
                  vf2_i960_cpu_enter_procedure(
                      &cpu, UINT32_C(0x0004bf90), UINT32_C(0x00002004)
                  ) == VF2_OK
              );
              report = (vf2_hybrid_bridge_report){0};
              CHECK(
                  vf2_hybrid_post_frame_bridge_execute(
                      &machine, &cpu, &report
                  ) == VF2_OK
              );
              CHECK(
                  report.kind == VF2_HYBRID_BRIDGE_TEXTURE_FINAL_STATUS_CALL
              );
              CHECK(report.recovered_instruction_count == UINT64_C(11));
              CHECK(cpu.ip == UINT32_C(0x0004d25c));
              CHECK(cpu.local_frame_depth == 2u);
              CHECK(
                  vf2_i960_cpu_return_procedure(&cpu, &machine) == VF2_OK
              );
              CHECK(cpu.ip == UINT32_C(0x0004bfdc));
              report = (vf2_hybrid_bridge_report){0};
              CHECK(
                  vf2_hybrid_post_frame_bridge_execute(
                      &machine, &cpu, &report
                  ) == VF2_OK
              );
              CHECK(report.kind == VF2_HYBRID_BRIDGE_TEXTURE_BODY_RETURN);
              CHECK(report.recovered_instruction_count == UINT64_C(1));
              CHECK(report.recovered_procedure_returns == UINT64_C(1));
              CHECK(cpu.ip == UINT32_C(0x00002004));
              CHECK(cpu.local_frame_depth == 0u);

              vf2_i960_cpu_reset(&cpu, 0u, 0u, UINT32_C(0x00003000));
              cpu.registers[1] = VF2_WORK_RAM_BASE + UINT32_C(0x3000);
              CHECK(
                  vf2_i960_cpu_enter_procedure(
                      &cpu, UINT32_C(0x0004bb94), UINT32_C(0x00003004)
                  ) == VF2_OK
              );
              report = (vf2_hybrid_bridge_report){0};
              CHECK(
                  vf2_hybrid_post_frame_bridge_execute(
                      &machine, &cpu, &report
                  ) == VF2_OK
              );
              CHECK(report.kind == VF2_HYBRID_BRIDGE_TEXTURE_POST_BODY_CALL);
              CHECK(report.recovered_instruction_count == UINT64_C(1));
              CHECK(report.recovered_procedure_calls == UINT64_C(1));
              CHECK(cpu.ip == UINT32_C(0x0004b8d8));
              CHECK(cpu.local_frame_depth == 2u);

              vf2_i960_cpu_reset(&cpu, 0u, 0u, UINT32_C(0x00004000));
              cpu.registers[1] = VF2_WORK_RAM_BASE + UINT32_C(0x3000);
              CHECK(
                  vf2_i960_cpu_enter_procedure(
                      &cpu, UINT32_C(0x0004bc58), UINT32_C(0x00004004)
                  ) == VF2_OK
              );
              cpu.registers[1] = stack_end;
              for (index = 3u; index <= 30u; ++index) {
                  CHECK(
                      vf2_model2a_write_u32(
                          &machine,
                          stack_start + (index - 3u) * UINT32_C(4),
                          UINT32_C(0x52000000) + index
                      ) == VF2_OK
                  );
              }
              report = (vf2_hybrid_bridge_report){0};
              CHECK(
                  vf2_hybrid_post_frame_bridge_execute(
                      &machine, &cpu, &report
                  ) == VF2_OK
              );
              CHECK(
                  report.kind ==
                  VF2_HYBRID_BRIDGE_TEXTURE_ORCHESTRATOR_EPILOGUE
              );
              CHECK(report.recovered_instruction_count == UINT64_C(21));
              CHECK(report.recovered_procedure_returns == UINT64_C(1));
              CHECK(cpu.ip == UINT32_C(0x00004004));
              CHECK(cpu.local_frame_depth == 0u);
              CHECK(cpu.registers[16] == UINT32_C(0x52000010));
              CHECK(cpu.registers[30] == UINT32_C(0x5200001e));
              CHECK(cpu.executed_instructions == UINT64_C(21));
              CHECK(
                  vf2_model2a_read_u32(
                      &machine, UINT32_C(0x0055c2f0), &value
                  ) == VF2_OK
              );
              CHECK((value & UINT32_C(0xffff)) == 0u);

              vf2_model2a_shutdown(&machine);
          }

          '''
          marker = "static void test_orchestrator_prefix_bridges(void)\n"
          if text.count(marker) != 1:
              raise SystemExit("shell test insertion marker not unique")
          text = text.replace(marker, test_block + marker, 1)
          old_calls = (
              "    test_machine_application();\n"
              "    test_orchestrator_prefix_bridges();\n"
          )
          new_calls = (
              "    test_machine_application();\n"
              "    test_orchestrator_shell_bridges();\n"
              "    test_orchestrator_prefix_bridges();\n"
          )
          if text.count(old_calls) != 1:
              raise SystemExit("shell test invocation marker not unique")
          tests.write_text(text.replace(old_calls, new_calls, 1), encoding="utf-8")

          functions = Path("decomp/i960/functions.csv")
          catalog = functions.read_text(encoding="utf-8")
          anchor = (
              "0x0004bb18,0x0004bcd4,texture_orchestrator_save_call,"
              "recovered-control-block,dynamic-trace+unit,"
              "Twenty register-save instructions plus the call into 0x0004bcd4\n"
          )
          additions = (
              "0x0004bd24,0x0004d2c0,texture_status_dispatch_call,"
              "recovered-observed-branch,dynamic-trace+unit,"
              "Four observed record dispatches recover eight instructions each\n"
              "0x0004bf90,0x0004d25c,texture_final_status_call,"
              "recovered-observed-branch,dynamic-trace+unit,"
              "Final counter gate clears status and enters the final status helper\n"
              "0x0004bfdc,0x0004bb94,texture_body_return,"
              "recovered-control-block,dynamic-trace+unit,"
              "Architectural return from the texture body\n"
              "0x0004bb94,0x0004b8d8,texture_post_body_call,"
              "recovered-control-block,dynamic-trace+unit,"
              "Post-body call into the short maintenance helper\n"
              "0x0004bc58,0x0000a034,texture_orchestrator_epilogue,"
              "recovered-control-block,dynamic-trace+unit,"
              "Restores 28 saved registers and returns to the main loop\n"
          )
          if catalog.count(anchor) != 1:
              raise SystemExit("function catalog anchor not unique")
          functions.write_text(
              catalog.replace(anchor, additions + anchor, 1),
              encoding="utf-8",
          )

          Path("decomp/i960/notes/texture_default_limits_v0024.md").write_text(
              """# v0.0.24 texture orchestrator recovery\n\n"
              "## Recovered observed blocks\n\n"
              "The hybrid bridge now replaces these consecutive or surrounding\n"
              "texture-orchestrator segments with C:\n\n"
              "- `0x0004bb18`: 21-instruction register-save and body call;\n"
              "- `0x0004bcd4`: 5-instruction zero-frame gate and helper call;\n"
              "- `0x0004bfe0`: 22-instruction default-limit selection;\n"
              "- `0x0004bd24`: four 8-instruction status dispatches;\n"
              "- `0x0004bf90`: 11-instruction final status gate and call;\n"
              "- `0x0004bfdc`: one-instruction body return;\n"
              "- `0x0004bb94`: one-instruction post-body call;\n"
              "- `0x0004bc58`: 21-instruction register restore and final return.\n\n"
              "These blocks account for 114 recovered instructions in the observed\n"
              "orchestrator path. Unsupported branch classes continue to return\n"
              "`VF2_ERROR_UNSUPPORTED` rather than guessing.\n\n"
              "## Expected strict totals\n\n"
              "The ROM-backed validator now expects 1,268,866 recovered bridge\n"
              "instructions and 1,956 interpreted instructions across 154 recovered\n"
              "blocks and 154 differential memory checkpoints. Recovered procedure\n"
              "calls/returns are expected to be 258/300.\n\n"
              "The warning-as-error build and ROM-independent tests validate the C\n"
              "semantics and architectural frame transitions. A supported VF2 2.1 ROM\n"
              "set is still required to run `native-second-dispatch` and confirm the\n"
              "updated headline totals as a full live differential MATCH.\n"
              """,
              encoding="utf-8",
          )
          PY

      - name: Build and run ROM-independent tests
        shell: bash
        run: |
          cmake -S . -B build \
            -DVF2_BUILD_TESTS=ON \
            -DVF2_WARNINGS_AS_ERRORS=ON \
            -DVF2_ROM_DIR=/tmp/vf2-roms-not-present
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure \
            -R '^(vf2_tests|vf2_orchestrator_limits)$'

      - name: Commit shell recovery
        shell: bash
        run: |
          rm .github/workflows/recover-v0024-orchestrator-shell.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "decomp(i960): recover orchestrator shell blocks"
          git push origin master
