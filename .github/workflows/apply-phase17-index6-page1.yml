name: Apply selector17 index6 page1
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_phase17_index6_page1.py
      - run: rm scripts/apply_phase17_index6_page1.py .github/workflows/apply-phase17-index6-page1.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover selector17 index6 bookkeeping page1"
          git push
