name: Fix game-info mirror bit9 branch count
on: [push]
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix mirror bit9 branch accounting
        run: python -c "from pathlib import Path; p=Path('src/recovered/hybrid.c'); s=p.read_text(); old='''                                mirror_extra +=\n                                    (fighter1_base & (UINT32_C(1) << 8u)) != 0u\n                                        ? UINT32_C(6) : UINT32_C(7);'''; new='''                                mirror_extra +=\n                                    (fighter1_base & (UINT32_C(1) << 8u)) != 0u\n                                        ? UINT32_C(7) : UINT32_C(8);'''; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator
        run: cp build/vf2i960 ./vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-mirror-bit9-count
          path: vf2i960
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-game-info-mirror-bit9-branch-count.yml
          git add src/recovered/hybrid.c
          git commit -m 'Fix fa_game_info mirror bit9 branch accounting'
          git push
