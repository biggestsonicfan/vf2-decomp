name: Probe game-info mode bit6 bit8 matrix
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply bit8 matrix candidate
        run: python -c "import base64; exec(base64.b64decode('   c2ltcGxlIGFkanVzdG1lbnQgbm90IGZvdW5kIikKcyA9IHMucmVwbGFjZShvbGRfYWRqdXN0LCBuZXdfYWRqdXN0LCAxKQoKcC53cml0ZV90ZXh0KHMpCg=='))"
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator
        run: cp build/vf2i960 ./vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-mode-bit6-bit8-matrix-probe
          path: vf2i960
      - name: Cleanup probe workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/probe-game-info-mode-bit6-bit8-matrix.yml
          git commit -m 'ci: cleanup mode bit6 bit8 matrix probe'
          git push
