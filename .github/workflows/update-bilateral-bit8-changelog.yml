name: Update bilateral bit8 changelog
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update changelog
        run: python .github/scripts/update_bilateral_bit8_changelog.py
      - name: Commit changelog and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/update_bilateral_bit8_changelog.py
          git rm .github/workflows/update-bilateral-bit8-changelog.yml
          git add CHANGELOG.md
          git commit -m "docs: record bilateral state8 changelog"
          git push
