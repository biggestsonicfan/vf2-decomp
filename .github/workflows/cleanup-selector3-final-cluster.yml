name: Cleanup selector3 final cluster

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cleanup-selector3-final-cluster.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete selector3 correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/texture_bridge_condition.c')
          s = p.read_text()
          a = s.index('#include <string.h>\n')
          b = s.index('#define VF2_SELECTOR2_FRAME_DISPATCH_ENTRY', a)
          s = s[:a] + s[b:]
          a = s.index('#define VF2_SELECTOR3_MASK')
          b = s.index('static vf2_status selector3_read_u16(', a)
          s = s[:a] + s[b:]
          a = s.index('static vf2_status selector3_read_u16(')
          b = s.index('static vf2_status apply_selector2_queue_condition(', a)
          s = s[:a] + s[b:]
          a = s.index('static vf2_status selector3_copy_palette_quads(')
          b = s.index('vf2_status vf2_hybrid_bridge_apply_condition_poststate(', a)
          s = s[:a] + s[b:]
          p.write_text(s)
          PY
      - name: Configure sanitizer build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON
      - name: Build sanitizer
        run: cmake --build build --parallel
      - name: Test sanitizer
        run: ctest --test-dir build --output-on-failure
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/cleanup-selector3-final-cluster.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_condition.c .github/workflows/cleanup-selector3-final-cluster.yml
          git commit -m 'Remove obsolete selector3 final cluster correction'
          git push origin HEAD:master
