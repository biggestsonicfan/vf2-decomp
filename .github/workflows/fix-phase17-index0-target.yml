name: Fix selector17 index0 table target

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_phase17_index0_target.py
      - run: rm .github/workflows/fix-phase17-index0-target.yml scripts/fix_phase17_index0_target.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix selector17 index0 indirect dispatch target"
          git push
