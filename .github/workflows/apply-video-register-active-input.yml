name: Apply active input video register recovery

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: stage active input video register recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover measured active-input callback path
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/recovered/texture_bridge_video.c')
          text = path.read_text()
          old = '''    if (callback == 0u) {
        callback = UINT32_C(0x00001284);
    } else if ((newly_enabled & UINT32_C(0x00f7f700)) == 0u) {
        /* The helper at 0x00001200 keeps an installed callback when no
         * relevant video bits changed. Its non-zero callback path executes
         * two more instructions than the initial installation path. */
        instructions += UINT64_C(2);
    } else {
        return VF2_ERROR_UNSUPPORTED;
    }
'''
          new = '''    if (callback == 0u) {
        callback = UINT32_C(0x00001284);
    } else if ((newly_enabled & UINT32_C(0x00f7f700)) == 0u) {
        /* The helper at 0x00001200 keeps an installed callback when no
         * relevant video bits changed. Its non-zero callback path executes
         * two more instructions than the initial installation path. */
        instructions += UINT64_C(2);
    } else if (callback == UINT32_C(0x00001284) &&
               (newly_enabled & UINT32_C(0x00f7f700)) > UINT32_C(0x000001fe)) {
        /* Measured active-input path through 0x00001200: r9 is the masked
         * newly-enabled control word and the installed table contributes only
         * one byte shifted left by one. A value above 0x1fe therefore cannot
         * match; the ROM takes cmpobne and reinstalls the 0x1284 fallback.
         * Keep smaller values and other callback tables explicit unsupported
         * until they are measured. */
        callback = UINT32_C(0x00001284);
        instructions += UINT64_C(6);
    } else {
        return VF2_ERROR_UNSUPPORTED;
    }
'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-video-register-active-input.yml
      - name: Commit recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover active input video register callback path"
          git push
