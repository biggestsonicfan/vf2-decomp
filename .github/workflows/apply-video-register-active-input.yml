name: Apply active input video register recovery

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_active_input_recovery.py
      - run: rm .github/workflows/apply-video-register-active-input.yml scripts/apply_active_input_recovery.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover active input video register callback path"
          git push
