name: Fix selector3 phase6 poststate
on:
  push:
    branches: [master]
    paths: [.github/workflows/fix-selector3-phase6-poststate.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch proven 8f1c poststate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c')
          s=p.read_text()
          old='''            uint32_t columns = 0u;\n            uint32_t destination = UINT32_C(0x010055e0);\n'''
          new='''            uint32_t rows = 0u;\n            uint32_t columns = 0u;\n            uint32_t destination = UINT32_C(0x010055e0);\n            int16_t addend = 0;\n            int16_t word_mode = 0;\n            int32_t last_sample = 0;\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''            if (status == VF2_OK) {\n                status = vf2_model2a_read_u32(\n                    machine, UINT32_C(0x02a6c0da) + UINT32_C(8), &columns\n                );\n            }\n            if (status == VF2_OK) {\n                status = vf2_model2a_write_u32(\n                    machine, cpu->registers[1] + UINT32_C(0x000000c0),\n                    destination\n                );\n            }\n            if (status != VF2_OK) return status;\n\n            cpu->registers[VF2_I960_G0_REGISTER] = UINT32_MAX;\n            cpu->registers[VF2_I960_G0_REGISTER + 2u] = columns * UINT32_C(2);\n            cpu->registers[VF2_I960_G0_REGISTER + 9u] =\n                destination + columns * UINT32_C(2);\n'''
          new='''            if (status == VF2_OK) {\n                status = vf2_model2a_read(\n                    machine, UINT32_C(0x02a6c0da), &addend, sizeof(addend)\n                );\n            }\n            if (status == VF2_OK) {\n                status = vf2_model2a_read(\n                    machine, UINT32_C(0x02a6c0da) + UINT32_C(2),\n                    &word_mode, sizeof(word_mode)\n                );\n            }\n            if (status == VF2_OK) {\n                status = vf2_model2a_read_u32(\n                    machine, UINT32_C(0x02a6c0da) + UINT32_C(4), &rows\n                );\n            }\n            if (status == VF2_OK) {\n                status = vf2_model2a_read_u32(\n                    machine, UINT32_C(0x02a6c0da) + UINT32_C(8), &columns\n                );\n            }\n            if (status == VF2_OK && (rows == 0u || columns == 0u)) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n            if (status == VF2_OK) {\n                const uint32_t sample_index = rows * columns - UINT32_C(1);\n                if (word_mode == 0) {\n                    int8_t sample = 0;\n                    status = vf2_model2a_read(\n                        machine, UINT32_C(0x02a6c0da) + UINT32_C(12) +\n                            sample_index, &sample, sizeof(sample)\n                    );\n                    last_sample = (int32_t)sample;\n                } else {\n                    int16_t sample = 0;\n                    status = vf2_model2a_read(\n                        machine, UINT32_C(0x02a6c0da) + UINT32_C(12) +\n                            sample_index * UINT32_C(2), &sample, sizeof(sample)\n                    );\n                    last_sample = (int32_t)sample;\n                }\n            }\n            if (status == VF2_OK) {\n                status = vf2_model2a_write_u32(\n                    machine, cpu->registers[1] + UINT32_C(0x000000c0),\n                    destination\n                );\n            }\n            if (status != VF2_OK) return status;\n\n            cpu->registers[VF2_I960_G0_REGISTER] = UINT32_MAX;\n            cpu->registers[VF2_I960_G0_REGISTER + 1u] = 0u;\n            cpu->registers[VF2_I960_G0_REGISTER + 2u] = columns * UINT32_C(2);\n            cpu->registers[VF2_I960_G0_REGISTER + 4u] = (uint32_t)(int32_t)addend;\n            cpu->registers[VF2_I960_G0_REGISTER + 5u] = 0u;\n            cpu->registers[VF2_I960_G0_REGISTER + 6u] =\n                (uint32_t)(last_sample + (int32_t)addend);\n            cpu->registers[VF2_I960_G0_REGISTER + 7u] = (uint32_t)(int32_t)word_mode;\n            cpu->registers[VF2_I960_G0_REGISTER + 9u] =\n                destination + columns * UINT32_C(2);\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Configure build test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-selector3-phase6-poststate.yml .github/workflows/dump-selector3-blit-helper.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c .github/workflows
          git commit -m 'Match selector3 phase6 8f1c poststate'
          git push origin HEAD:master
