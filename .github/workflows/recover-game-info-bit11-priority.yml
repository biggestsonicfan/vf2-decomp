name: Recover game-info bit11 priority
on:
  push:
    paths:
      - .github/workflows/recover-game-info-bit11-priority.yml
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Recover bit11 branch priority
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          old = '''    if (status == VF2_OK && (r8 & (UINT32_C(1) << 14u)) != 0u) {
        /* Observed bit-14 path: the 0x188b4..0x188c8 predicate sets
         * r10.bit11 before the shared flag accumulation store. */
        r10 &= ~(UINT32_C(1) << 2u);
        r10 |= UINT32_C(1) << 11u;
    }
    if (status == VF2_OK && (r8 & (UINT32_C(1) << 16u)) != 0u) {
        /* Observed bit-16 path: the ROM's 0x188b4 branch selects the same
         * bit-11 accumulation before the shared store. */
        r10 |= UINT32_C(1) << 11u;
    }
'''
          new = '''    if (status == VF2_OK &&
        (r8 & ((UINT32_C(1) << 15u) | (UINT32_C(1) << 8u))) == 0u) {
        /* 0x188ac..0x188c8 is ordered control flow, not independent flag
         * tests: bit 15 and then bit 8 skip the SETBIT 11 path before bit 16
         * and bit 14 are considered.  For bit 14 + bit 4 the ROM consults
         * fighter0+0x5bc and sets bit 11 only when that halfword is zero. */
        bool set_bit11 = (r8 & (UINT32_C(1) << 16u)) != 0u;
        if (!set_bit11 && (r8 & (UINT32_C(1) << 14u)) != 0u) {
            if ((r8 & (UINT32_C(1) << 4u)) == 0u) {
                set_bit11 = true;
            } else {
                uint16_t guard = 0u;
                status = hybrid_read_u16(
                    machine, fighter0 + UINT32_C(0x000005bc), &guard
                );
                set_bit11 = status == VF2_OK && guard == 0u;
            }
        }
        if (status == VF2_OK && set_bit11) {
            r10 |= UINT32_C(1) << 11u;
        }
    }
'''
          if old not in s:
              raise SystemExit('bit11 priority anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: cp build/vf2i960 vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-bit11-priority
          path: vf2i960
      - name: Commit and cleanup
        run: |
          rm .github/workflows/recover-game-info-bit11-priority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c .github/workflows/recover-game-info-bit11-priority.yml
          git commit -m 'Recover fa_game_info bit11 branch priority'
          git push
