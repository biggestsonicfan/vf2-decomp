name: Fix selector17 index3 decimal forward declaration
on:
  push:
    branches: [master]
    paths:
      - scripts/fix_phase17_index3_decimal_forward.py
      - .github/workflows/fix-phase17-index3-decimal-forward.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_phase17_index3_decimal_forward.py
      - run: rm .github/workflows/fix-phase17-index3-decimal-forward.yml scripts/fix_phase17_index3_decimal_forward.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix selector17 index3 decimal helper declaration"
          git push
