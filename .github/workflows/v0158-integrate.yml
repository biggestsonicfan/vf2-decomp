name: v0158 integrate

on:
  push:
    branches: [master]
    paths:
      - '.github/v0158.patch'
      - '.github/workflows/v0158-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovery patch
        run: |
          git apply --recount --index .github/v0158.patch
          git diff --cached --check
      - name: Configure
        run: cmake -S . -B build -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/v0158.patch .github/workflows/v0158-integrate.yml
          git add src/recovered/hybrid.c decomp/i960/notes/game_info_negative_state8_isolated_high_v0158.md
          git commit -m 'Recover negative state8 isolated high-bit boundaries'
          git push origin master
