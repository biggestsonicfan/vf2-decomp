name: Fix selector3 phase4 spill
on:
  push:
    branches: [master]
    paths: [.github/workflows/fix-selector3-phase4-spill.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch proven 8f1c spill
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/texture_bridge_match.c'); s=p.read_text(); a=s.index('        if (status == VF2_OK && entry_phase == UINT8_C(4)) {'); b=s.index('        if (status == VF2_OK && phase8_handoff) {',a); x=s[a:b]
          old='''            set_signed_condition(cpu, INT32_C(0), INT32_C(-1));\n            account_nested_procedure(cpu, UINT64_C(20), UINT64_C(20));\n'''
          new='''            set_signed_condition(cpu, INT32_C(0), INT32_C(-1));\n            status = vf2_model2a_write_u32(\n                machine, cpu->registers[1] + UINT32_C(0x000000c0),\n                UINT32_C(0x010016da)\n            );\n            if (status != VF2_OK) return status;\n            account_nested_procedure(cpu, UINT64_C(20), UINT64_C(20));\n'''
          assert old in x; x=x.replace(old,new,1); p.write_text(s[:a]+x+s[b:])
          PY
      - name: Configure build test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        run: rm .github/workflows/fix-selector3-phase4-spill.yml && git config user.name celsowm && git config user.email celsowm@gmail.com && git add src/recovered/texture_bridge_match.c .github/workflows && git commit -m 'Preserve selector3 phase4 8f1c spill' && git push origin HEAD:master
