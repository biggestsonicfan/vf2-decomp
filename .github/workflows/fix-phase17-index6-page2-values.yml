name: Fix selector17 index6 page2 values
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_phase17_index6_page2_values.py
      - run: rm scripts/fix_phase17_index6_page2_values.py .github/workflows/fix-phase17-index6-page2-values.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match selector17 index6 bookkeeping page2 values"
          git push
