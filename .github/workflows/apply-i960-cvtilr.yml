name: Apply i960 cvtilr
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add_i960_cvtilr.py
      - run: rm scripts/add_i960_cvtilr.py .github/workflows/apply-i960-cvtilr.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i960: execute cvtilr"
          git push
