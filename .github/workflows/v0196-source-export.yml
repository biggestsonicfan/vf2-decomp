name: v0196 source export
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v0196-source-export.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: |
          tar --exclude=.git -czf /tmp/vf2-source-v0195.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: vf2-source-v0195
          path: /tmp/vf2-source-v0195.tar.gz
          retention-days: 1
