name: Stage cross bit1-bit4 candidate
on:
  push:
    branches: [master]
    paths: [.github/workflows/stage-cross-bit1-bit4.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact cross-state candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c')
          s=p.read_text()
          old='''        const bool bilateral_both_bit1 =\n            r7 == state8_bit1 && r8 == state8_bit1;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1) {\n'''
          new='''        const bool bilateral_both_bit1 =\n            r7 == state8_bit1 && r8 == state8_bit1;\n        const bool bilateral_cross_bit1_bit4 =\n            (r7 == state8_bit1 && r8 == state8_bit4) ||\n            (r7 == state8_bit4 && r8 == state8_bit1);\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4) {\n'''
          if old not in s: raise SystemExit('initial cross guard anchor missing')
          s=s.replace(old,new,1)
          old2='''        const bool both_bilateral =\n            r7 == isolated_state8_bit1 && r8 == isolated_state8_bit1;\n        if (!forward_isolated && !reverse_isolated &&\n            !forward_bilateral && !reverse_bilateral && !both_bilateral) {\n'''
          new2='''        const bool both_bilateral =\n            r7 == isolated_state8_bit1 && r8 == isolated_state8_bit1;\n        const uint32_t state8_bit4 =\n            (UINT32_C(1) << 8u) | (UINT32_C(1) << 4u);\n        const bool cross_bilateral =\n            (r7 == isolated_state8_bit1 && r8 == state8_bit4) ||\n            (r7 == state8_bit4 && r8 == isolated_state8_bit1);\n        if (!forward_isolated && !reverse_isolated &&\n            !forward_bilateral && !reverse_bilateral && !both_bilateral &&\n            !cross_bilateral) {\n'''
          if old2 not in s: raise SystemExit('bit1 cross guard anchor missing')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish candidate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C probe-cross-bit1-bit4
          git add src/recovered/hybrid.c
          git commit -m "candidate: admit bilateral cross bit1-bit4 state"
          git push --force origin probe-cross-bit1-bit4
