name: Stage cross bit1-bit4 candidate
on:
  push:
    branches: [master]
    paths: [.github/workflows/stage-cross-bit1-bit4.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact cross-state candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c')
          s=p.read_text()
          old='''        const bool bilateral_both_bit1 =\n            r7 == state8_bit1 && r8 == state8_bit1;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1) {\n'''
          new='''        const bool bilateral_both_bit1 =\n            r7 == state8_bit1 && r8 == state8_bit1;\n        const bool bilateral_cross_bit1_bit4 =\n            (r7 == state8_bit1 && r8 == state8_bit4) ||\n            (r7 == state8_bit4 && r8 == state8_bit1);\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1 && !bilateral_cross_bit1_bit4) {\n'''
          if old not in s: raise SystemExit('initial cross guard anchor missing')
          s=s.replace(old,new,1)
          old2='''        const bool both_bilateral =\n            r7 == isolated_state8_bit1 && r8 == isolated_state8_bit1;\n        if (!forward_isolated && !reverse_isolated &&\n            !forward_bilateral && !reverse_bilateral && !both_bilateral) {\n'''
          new2='''        const bool both_bilateral =\n            r7 == isolated_state8_bit1 && r8 == isolated_state8_bit1;\n        const uint32_t state8_bit4 =\n            (UINT32_C(1) << 8u) | (UINT32_C(1) << 4u);\n        const bool cross_bilateral =\n            (r7 == isolated_state8_bit1 && r8 == state8_bit4) ||\n            (r7 == state8_bit4 && r8 == isolated_state8_bit1);\n        if (!forward_isolated && !reverse_isolated &&\n            !forward_bilateral && !reverse_bilateral && !both_bilateral &&\n            !cross_bilateral) {\n'''
          if old2 not in s: raise SystemExit('bit1 cross guard anchor missing')
          s=s.replace(old2,new2,1)
          old3='''        if (status == VF2_OK && (int32_t)r13 >= (int32_t)r3 &&\n            !(r7 == ((UINT32_C(1) << 8u) | (UINT32_C(1) << 4u)) &&\n              r8 == ((UINT32_C(1) << 8u) | (UINT32_C(1) << 4u)))) {\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          new3='''        if (status == VF2_OK && (int32_t)r13 >= (int32_t)r3) {\n            const uint32_t state8_bit1 =\n                (UINT32_C(1) << 8u) | (UINT32_C(1) << 1u);\n            const uint32_t state8_bit4 =\n                (UINT32_C(1) << 8u) | (UINT32_C(1) << 4u);\n            const bool both_bit4 = r7 == state8_bit4 && r8 == state8_bit4;\n            const bool cross_bit1_bit4 =\n                (r7 == state8_bit1 && r8 == state8_bit4) ||\n                (r7 == state8_bit4 && r8 == state8_bit1);\n            if (!both_bit4 && !cross_bit1_bit4) {\n                status = VF2_ERROR_UNSUPPORTED;\n            }\n        }\n'''
          if old3 not in s: raise SystemExit('threshold anchor missing')
          s=s.replace(old3,new3,1)
          anchor='''            {\n                const uint32_t state8 = UINT32_C(1) << 8u;\n                const uint32_t state8_bit4 =\n                    state8 | (UINT32_C(1) << 4u);\n                const bool asymmetric_bilateral_bit4 =\n                    (r7 == state8 && r8 == state8_bit4) ||\n                    (r7 == state8_bit4 && r8 == state8);\n\n                if (asymmetric_bilateral_bit4) {\n                    if (return_address == UINT32_C(0x000164b0)) {\n                        if (!countdown_path && !mode_bit6) {\n                            --body_instructions;\n                        } else {\n                            body_instructions += UINT32_C(4);\n                        }\n                    } else if (return_address == UINT32_C(0x000164c4)) {\n                        if (!countdown_path && mode_bit6) {\n                            body_instructions -= UINT32_C(5);\n                        } else if (countdown_path) {\n                            body_instructions += UINT32_C(3);\n                        }\n                    }\n                }\n            }\n'''
          addition='''            {\n                const uint32_t state8_bit1 =\n                    (UINT32_C(1) << 8u) | (UINT32_C(1) << 1u);\n                const uint32_t state8_bit4 =\n                    (UINT32_C(1) << 8u) | (UINT32_C(1) << 4u);\n                const bool cross_forward =\n                    r7 == state8_bit1 && r8 == state8_bit4;\n                const bool cross_reverse =\n                    r7 == state8_bit4 && r8 == state8_bit1;\n\n                if (cross_forward) {\n                    if (return_address == UINT32_C(0x000164b0)) {\n                        if (countdown_path) {\n                            body_instructions += UINT32_C(4);\n                        } else {\n                            body_instructions -= UINT32_C(7);\n                        }\n                    } else if (return_address == UINT32_C(0x000164c4)) {\n                        if (countdown_path) {\n                            body_instructions += UINT32_C(3);\n                        } else {\n                            body_instructions -= mode_bit6\n                                ? UINT32_C(10) : UINT32_C(11);\n                        }\n                    }\n                } else if (cross_reverse) {\n                    if (return_address == UINT32_C(0x000164b0)) {\n                        body_instructions += countdown_path\n                            ? UINT32_C(15) : UINT32_C(1);\n                    } else if (return_address == UINT32_C(0x000164c4)) {\n                        if (countdown_path) {\n                            body_instructions += UINT32_C(14);\n                        } else {\n                            body_instructions -= mode_bit6\n                                ? UINT32_C(2) : UINT32_C(3);\n                        }\n                    }\n                }\n            }\n'''
          if anchor not in s: raise SystemExit('cross accounting anchor missing')
          p.write_text(s.replace(anchor,anchor+addition,1))
          PY
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish candidate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C probe-cross-bit1-bit4-candidate3
          git add src/recovered/hybrid.c
          git commit -m "candidate: fully account bilateral cross bit1-bit4 state"
          git push --force origin probe-cross-bit1-bit4-candidate3
