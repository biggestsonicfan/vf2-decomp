name: Probe game-info state8 bit1
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply state8 bit1 candidate
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator
        run: cp build/vf2i960 ./vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-state8-bit1-probe
          path: vf2i960
