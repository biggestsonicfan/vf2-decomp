name: Recover structural game-info accounting
on: [push]
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Recover structural accounting
        run: python -c "from pathlib import Path; import base64; p=Path('src/recovered/hybrid.c'); s=p.read_text(); start=s.index('        if (shared_bit1_path) {\n            r10 |= UINT32_C(4);'); end=s.index('    if (status == VF2_OK && !shared_bit1_path) {', start); new=base64.b64decode('').decode(); p.write_text(s[:start]+new+s[end:])"
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: cp build/vf2i960 vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-structural-accounting
          path: vf2i960
      - name: Commit and cleanup
        run: |
          rm .github/workflows/recover-game-info-structural-accounting.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/hybrid.c .github/workflows/recover-game-info-structural-accounting.yml
          git commit -m 'Recover structural fa_game_info accounting'
          git push
