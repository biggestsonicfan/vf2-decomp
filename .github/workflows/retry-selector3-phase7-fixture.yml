name: Retry selector3 phase7 fixture
on:
  push:
    branches: [master]
    paths: [.github/workflows/retry-selector3-phase7-fixture.yml]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply phase7 patch and fixture correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          wf=Path('.github/workflows/close-selector3-phase7-b64.yml').read_text()
          encoded=wf.split("echo '",1)[1].split("' | base64 -d",1)[0]
          exec(compile(base64.b64decode(encoded), '/tmp/patch.py', 'exec'))
          p=Path('tests/analysis/test_orchestrator_bridge.c')
          s=p.read_text()
          old='''    CHECK(vf2_model2a_write_u32(&machine, UINT32_C(0x00500168), VF2_MAIN_DATA_BASE) == VF2_OK);\n'''
          new=old+'''    CHECK(vf2_model2a_write_u32(&machine, VF2_MAIN_DATA_BASE + UINT32_C(4), UINT32_C(0x12345678)) == VF2_OK);\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    CHECK(value == VF2_MAIN_DATA_BASE + UINT32_C(4));\n'''
          assert old in s
          s=s.replace(old,'''    CHECK(value == UINT32_C(0x12345678));\n''',1)
          p.write_text(s)
          PY
      - name: Test
        env:
          CC: clang
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON -DVF2_ENABLE_SANITIZERS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Commit
        run: |
          rm -f .github/workflows/retry-selector3-phase7-fixture.yml .github/workflows/close-selector3-phase7-b64.yml .github/workflows/close-selector3-phase7.yml .github/workflows/dump-selector3-profile-helper.yml .github/workflows/dump-selector3-phase7.yml
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git add src/recovered/texture_bridge_match.c tests/analysis/test_orchestrator_bridge.c .github/workflows
          git commit -m 'Close selector3 phase7 observed path'
          git push origin HEAD:master
