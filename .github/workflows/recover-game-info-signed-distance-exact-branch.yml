name: Recover game-info signed-distance exact branch
on: [push]
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact branch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c')
          s=p.read_text()
          old='''            if (second_exact) {\n                if ((r8 & branch_mask) != 0u) {\n                    status = VF2_ERROR_UNSUPPORTED;\n                } else {\n                    signed_distance_instruction_delta = UINT32_C(11);\n                }\n            } else if ((r8 & (branch_mask | (UINT32_C(1) << 1u))) != 0u) {'''
          new='''            if (second_exact) {\n                signed_distance_instruction_delta = UINT32_C(11);\n                if ((r8 & branch_mask) != 0u) {\n                    status = vf2_model2a_read_u32(\n                        machine, fighter0 + UINT32_C(0x00000634), &r3\n                    );\n                    if (status == VF2_OK) {\n                        status = vf2_model2a_read_u32(\n                            machine, fighter0 + UINT32_C(0x000005f4), &r4\n                        );\n                    }\n                    if (status == VF2_OK &&\n                        hybrid_float_from_bits(r4) > hybrid_float_from_bits(r3)) {\n                        signed_distance_instruction_delta += UINT32_C(4);\n                    } else if (status == VF2_OK) {\n                        status = vf2_model2a_read_u32(machine, fighter1, &r15);\n                        if (status == VF2_OK &&\n                            (r15 & (UINT32_C(1) << 8u)) != 0u) {\n                            r10 |= UINT32_C(1) << 13u;\n                            signed_distance_instruction_delta += UINT32_C(7);\n                        } else if (status == VF2_OK &&\n                                   (r8 & (UINT32_C(1) << 25u)) != 0u) {\n                            r10 |= UINT32_C(1) << 13u;\n                            signed_distance_instruction_delta += UINT32_C(8);\n                        } else if (status == VF2_OK) {\n                            r10 |= UINT32_C(1) << 10u;\n                            signed_distance_instruction_delta += UINT32_C(9);\n                        }\n                    }\n                }\n            } else if ((r8 & (branch_mask | (UINT32_C(1) << 1u))) != 0u) {'''
          if old not in s: raise SystemExit('exact branch block missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator
        run: cp build/vf2i960 vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-signed-distance-exact-branch
          path: vf2i960
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/recovered/hybrid.c
          git rm .github/workflows/recover-game-info-signed-distance-exact-branch.yml
          git commit -m 'Recover fa_game_info signed-distance exact branch'
          git push
