name: temporary vf2i960 export
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-export-vf2i960.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build current vf2i960
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=OFF
          cmake --build build --parallel 2 --target vf2i960
      - name: Upload vf2i960
        uses: actions/upload-artifact@v4
        with:
          name: vf2i960-current-linux-x64
          path: build/vf2i960
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary workflow
        run: |
          git config user.name celsowm
          git config user.email celsowm@gmail.com
          git rm .github/workflows/tmp-export-vf2i960.yml
          git commit -m 'Remove temporary vf2i960 export workflow'
          git push origin HEAD:master
