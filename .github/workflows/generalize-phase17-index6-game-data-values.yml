name: Generalize selector17 index6 GAME DATA values
on:
  push:
    paths:
      - tools/generalize_phase17_index6_game_data_values.py
      - .github/workflows/generalize-phase17-index6-game-data-values.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live-value recovery
        run: python3 tools/generalize_phase17_index6_game_data_values.py
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish analysis binary
        uses: actions/upload-artifact@v4
        with:
          name: vf2i960-index6-game-data-live
          path: build/vf2i960
      - name: Commit recovery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/texture_bridge_match.c decomp/i960/notes/selector17_index6_bookkeeping_game_data.md
          git rm -f tools/generalize_phase17_index6_game_data_values.py .github/workflows/generalize-phase17-index6-game-data-values.yml
          git commit -m 'Recover live BOOKKEEPING game data values'
          git push
