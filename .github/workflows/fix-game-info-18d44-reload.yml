name: Fix game-info 18d44 reload
on:
  push:
    paths:
      - .github/workflows/fix-game-info-18d44-reload.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore 0x18db8 r4 reload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/recovered/hybrid.c')
          s = p.read_text()
          old = '''        if (status == VF2_OK && r6 != 0u) {\n            r4 = hybrid_float_to_bits(\n                hybrid_float_from_bits(r7) -\n                hybrid_float_from_bits(r4)\n            );\n'''
          new = '''        /* 0x18db8 reloads fighter+0x1fc after the first branch.  r4 is\n         * scratch inside 0x18d8c..0x18db4, so carrying that transformed\n         * value into the second branch changes the ROM's min(r8,r9). */\n        if (status == VF2_OK) {\n            status = vf2_model2a_read_u32(\n                machine,\n                cpu->registers[VF2_I960_G0_REGISTER + 7u] +\n                    UINT32_C(0x000001fc),\n                &r4\n            );\n        }\n        if (status == VF2_OK && r6 != 0u) {\n            r4 = hybrid_float_to_bits(\n                hybrid_float_from_bits(r7) -\n                hybrid_float_from_bits(r4)\n            );\n'''
          if old not in s:
              raise SystemExit('18d44 reload anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage validator binary
        run: |
          exe=$(find build -type f -name vf2i960 | head -n1)
          cp "$exe" vf2i960 && chmod +x vf2i960
      - uses: actions/upload-artifact@v4
        with:
          name: vf2i960-game-info-18d44-reload
          path: vf2i960
      - name: Commit fix and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/recovered/hybrid.c
          git rm -f .github/workflows/fix-game-info-18d44-reload.yml
          if [ -f .github/workflows/debug-game-info-accounting.yml ]; then git rm -f .github/workflows/debug-game-info-accounting.yml; fi
          git commit -m 'Fix fa_game_info 18d44 operand reload'
          git push origin HEAD:master
