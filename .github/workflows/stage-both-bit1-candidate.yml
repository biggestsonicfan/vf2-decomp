name: Stage bilateral both-bit1 candidate
on:
  push:
    branches: [master]
    paths: [.github/workflows/stage-both-bit1-candidate.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch narrow both-bit1 candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/recovered/hybrid.c')
          s=p.read_text()
          old='''        const bool bilateral_both_bit4 =\n            r7 == state8_bit4 && r8 == state8_bit4;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4) {\n            /* The measured bilateral bit1/bit4 compositions are admitted;\n             * other mixed states remain explicit unsupported boundaries. */\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          new='''        const bool bilateral_both_bit4 =\n            r7 == state8_bit4 && r8 == state8_bit4;\n        const bool bilateral_both_bit1 =\n            r7 == state8_bit1 && r8 == state8_bit1;\n        if (!bilateral_bit1 && !bilateral_bit4 && !bilateral_both_bit4 &&\n            !bilateral_both_bit1) {\n            /* The measured bilateral bit1/bit4 compositions are admitted;\n             * other mixed states remain explicit unsupported boundaries. */\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          if old not in s: raise SystemExit('initial bilateral guard anchor missing')
          s=s.replace(old,new,1)
          old2='''        const bool reverse_bilateral =\n            r7 == isolated_state8_bit1 && r8 == (UINT32_C(1) << 8u);\n        if (!forward_isolated && !reverse_isolated &&\n            !forward_bilateral && !reverse_bilateral) {\n            /* Only the two fighter-order orientations of isolated\n             * state8+bit1 are ROM-backed here. */\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          new2='''        const bool reverse_bilateral =\n            r7 == isolated_state8_bit1 && r8 == (UINT32_C(1) << 8u);\n        const bool both_bilateral =\n            r7 == isolated_state8_bit1 && r8 == isolated_state8_bit1;\n        if (!forward_isolated && !reverse_isolated &&\n            !forward_bilateral && !reverse_bilateral && !both_bilateral) {\n            /* Only the measured isolated and bilateral state8+bit1\n             * compositions are admitted here. */\n            status = VF2_ERROR_UNSUPPORTED;\n        }\n'''
          if old2 not in s: raise SystemExit('bit1 guard anchor missing')
          s=s.replace(old2,new2,1)
          old3='''            body_instructions += state8_bit1_instruction_delta;\n            if (countdown_path &&\n'''
          new3='''            body_instructions += state8_bit1_instruction_delta;\n            if (r7 == ((UINT32_C(1) << 8u) | (UINT32_C(1) << 1u)) &&\n                r8 == ((UINT32_C(1) << 8u) | (UINT32_C(1) << 1u))) {\n                /* Both fighters carrying state8+bit1 execute the shared\n                 * bit1 corridor on both sides: +9 without countdown and\n                 * +11 when countdown takes the earlier shared rejoin. */\n                body_instructions += countdown_path ? UINT32_C(11) : UINT32_C(9);\n            }\n            if (countdown_path &&\n'''
          if old3 not in s: raise SystemExit('accounting anchor missing')
          p.write_text(s.replace(old3,new3,1))
          PY
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Publish candidate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C probe-both-bit1-candidate2
          git add src/recovered/hybrid.c
          git commit -m "candidate: account bilateral both-bit1 state"
          git push --force origin probe-both-bit1-candidate2
