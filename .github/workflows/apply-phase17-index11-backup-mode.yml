name: Apply selector17 index11 backup-mode completion
on:
  push:
    paths:
      - tools/apply_phase17_index11_backup_mode.py
      - .github/workflows/apply-phase17-index11-backup-mode.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recovery
        run: python3 tools/apply_phase17_index11_backup_mode.py
      - name: Configure strict build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF2_BUILD_TESTS=ON -DVF2_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovered/texture_bridge_match.c decomp/i960/notes/selector17_index11_exit_test_mode.md
          git rm -f tools/apply_phase17_index11_backup_mode.py .github/workflows/apply-phase17-index11-backup-mode.yml
          git commit -m 'Complete selector17 index11 EXIT TEST MODE'
          git push
